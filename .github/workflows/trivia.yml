# Downloads the Trivia questions from the Open Trivia Database (scripts/fetch-trivia.js: one request
# every 5 seconds, filtered) and commits trivia.json to the data branch (made or replaced), for a look
# and a merge. Run it by hand from the Actions tab, or by pushing any commit to a branch called
# trivia-fetch; the game itself never calls the API. The inputs reach the shell only through env (never
# interpolated into a script), the branch name is checked, and main and staging are never written to.
name: Fetch trivia questions

on:
  push:
    branches: [trivia-fetch]
  workflow_dispatch:
    inputs:
      branch:
        description: The branch to commit trivia.json to (made or replaced; letters, numbers, - _ / . only; never main or staging)
        default: trivia-data
        required: true
      per:
        description: Questions to keep per category, at most (1 to 500)
        default: '60'
        required: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      TRIVIA_BRANCH: ${{ github.event.inputs.branch || 'trivia-data' }}
      TRIVIA_PER: ${{ github.event.inputs.per || '60' }}
    steps:
      - name: Check the inputs
        run: |
          case "$TRIVIA_BRANCH" in
            main|staging|master|*/main|*/staging) echo "::error::trivia.json is never pushed to $TRIVIA_BRANCH: pick a data branch."; exit 1 ;;
          esac
          if ! printf '%s' "$TRIVIA_BRANCH" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]{0,80}$' || printf '%s' "$TRIVIA_BRANCH" | grep -Eq '(\.\.|//|/$|\.lock$|^-)'; then echo "::error::Not a branch name: $TRIVIA_BRANCH"; exit 1; fi
          if ! printf '%s' "$TRIVIA_PER" | grep -Eq '^[0-9]{1,3}$' || [ "$TRIVIA_PER" -lt 1 ] || [ "$TRIVIA_PER" -gt 500 ]; then echo "::error::per must be a number from 1 to 500: $TRIVIA_PER"; exit 1; fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Download and filter the questions
        run: node scripts/fetch-trivia.js --per "$TRIVIA_PER"
      - name: Commit trivia.json to the data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$TRIVIA_BRANCH" || true
          git checkout -B "$TRIVIA_BRANCH"
          git add trivia.json
          git commit -m "Trivia questions from the Open Trivia Database (CC BY-SA 4.0)" || echo "Nothing new."
          git push --force-with-lease origin "HEAD:refs/heads/$TRIVIA_BRANCH"
