# Deploys the Cloud Functions and the Realtime Database rules when they change on main: only the part that
# changed (functions, rules, or both), from the push's own diff. The functions run the page's engine and
# every game's rules, AI and meta (src/core, src/games; scripts/sync-functions.js copies them into
# functions/), so a change there deploys the functions too. It needs one repository secret,
# FIREBASE_SERVICE_ACCOUNT: a service-account key (JSON) for the Firebase project (README: "Deploying").
# The unit tests and the server tests (Firebase Emulator Suite) run first; nothing deploys unless they pass.
name: Deploy Firebase (functions and rules)

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'src/core/**'
      - 'src/games/**'
      - '!src/games/*/view.js'
      - 'trivia.json'
      - 'database.rules.json'
      - 'firebase.json'
      - '.firebaserc'
      - 'tests/emulator/**'
      - 'tests/server/**'
      - 'scripts/sync-functions.js'
      - 'scripts/smoke-live.js'
      - 'scripts/backfill-records.js'
      - 'scripts/backfill-accounts.js'
      - 'scripts/backfill-opponents.js'
      - 'scripts/check-usernames.js'
      - 'scripts/set-releases.js'
      - '.github/workflows/firebase.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0                 # the push's diff decides what deploys
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: |
          npm ci
          npm ci --prefix functions
          npm i -g firebase-tools@14
          firebase setup:emulators:database    # the database emulator's jar: the two-client Super Chaos test in npm test runs on it
      - name: What changed (functions, rules, or both)
        id: what
        run: |
          before='${{ github.event.before }}'
          if [ '${{ github.event_name }}' = push ] && git cat-file -e "$before" 2>/dev/null; then changed=$(git diff --name-only "$before" '${{ github.sha }}'); else changed=ALL; fi
          only=''
          if [ "$changed" = ALL ] || echo "$changed" | grep -v '/view\.js$' | grep -qE '^(functions/|src/core/|src/games/|trivia\.json|firebase\.json|\.firebaserc|scripts/sync-functions\.js|\.github/workflows/firebase\.yml)'; then only=functions; fi
          if [ "$changed" = ALL ] || echo "$changed" | grep -qE '^(database\.rules\.json|firebase\.json|\.github/workflows/firebase\.yml)'; then only="${only:+$only,}database"; fi
          echo "only=$only" >> "$GITHUB_OUTPUT"
          echo "Deploying: ${only:-nothing}"
      - name: Unit tests
        run: npm test
      - name: Server tests on the Firebase Emulator Suite
        run: npm run test:emulators
      - name: Credentials
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "::error::The FIREBASE_SERVICE_ACCOUNT secret is missing (README: Deploying)."; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Check the key
        # Prints only what identifies the key (type, project, account), never the key or a token.
        run: |
          node -e '
            const fs = require("fs"), file = process.env.GOOGLE_APPLICATION_CREDENTIALS, raw = fs.readFileSync(file, "utf8").replace(/^\uFEFF/, "").trim();
            let k = null;
            try { k = JSON.parse(raw); } catch (e) {
              try { k = JSON.parse(Buffer.from(raw, "base64").toString("utf8")); console.log("(the secret is base64: decoded)"); } catch (e2) { /* not base64 */ }
              if (!k && raw.startsWith("\"") && raw.endsWith("}")) {   // the key pasted without its first line, the opening brace
                try { k = JSON.parse("{" + raw); console.log("::warning::FIREBASE_SERVICE_ACCOUNT is missing its opening { (added here). Re-paste the whole key file when convenient."); } catch (e3) { /* still not */ }
              }
            }
            if (!k) {
              const shape = { length: raw.length, lines: raw.split("\n").length, startsWithBrace: raw.startsWith("{"), endsWithBrace: raw.endsWith("}"), mentionsServiceAccount: raw.includes("service_account"), mentionsPrivateKey: raw.includes("private_key"), curlyQuotes: /[\u201c\u201d]/.test(raw) };
              console.log("secret shape (nothing secret):", JSON.stringify(shape));
              console.log("::error::FIREBASE_SERVICE_ACCOUNT is not a JSON key: paste the whole key file, from { to }.");
              process.exit(1);
            }
            fs.writeFileSync(file, JSON.stringify(k));
            console.log("type:", k.type, "| project:", k.project_id, "| account:", k.client_email);
            if (k.type !== "service_account") { console.log("::error::FIREBASE_SERVICE_ACCOUNT is not a service-account key."); process.exit(1); }
            if (k.project_id !== "tic-tac-chaos") console.log("::warning::The key is for project " + k.project_id + ", not tic-tac-chaos.");
          '
          node -e '
            const { GoogleAuth } = require("./functions/node_modules/google-auth-library");
            new GoogleAuth({ scopes: ["https://www.googleapis.com/auth/cloud-platform"] }).getAccessToken()
              .then(() => console.log("Google accepted the key."), e => { console.log("::error::Google refused the key: " + String(e.message).split("\n")[0]); process.exit(1); });
          '
      - name: Cloud Billing API on
        # The Firebase CLI reads the project's billing status (functions need the Blaze plan), and it
        # does not switch this API on by itself. Once on, this step does nothing.
        run: |
          node -e '
            const { GoogleAuth } = require("./functions/node_modules/google-auth-library");
            (async () => {
              const c = await new GoogleAuth({ scopes: ["https://www.googleapis.com/auth/cloud-platform"] }).getClient();
              const api = "https://serviceusage.googleapis.com/v1/projects/tic-tac-chaos/services/cloudbilling.googleapis.com";
              if ((await c.request({ url: api })).data.state === "ENABLED") { console.log("The Cloud Billing API is on."); return; }
              await c.request({ url: api + ":enable", method: "POST" });
              console.log("Switched the Cloud Billing API on; a minute for it to take effect.");
              await new Promise(r => setTimeout(r, 60000));
            })().catch(e => { console.log("::error::Could not switch on the Cloud Billing API: " + String(e.message).split("\n")[0]); process.exit(1); });
          '
      - name: Deploy functions and rules
        # Once more after two minutes if it fails: Google's services can need a few minutes after first use.
        # Every function is deployed, changed or not: a revision that failed to start keeps its source's
        # hash, so a deploy that skipped "unchanged" functions would leave it broken.
        env:
          FUNCTIONS_DEPLOY_UNCHANGED: 'true'
        run: |
          only='${{ steps.what.outputs.only }}'
          if [ -z "$only" ]; then echo "Nothing to deploy."; exit 0; fi
          deploy() { firebase deploy --only "$only" --project tic-tac-chaos --non-interactive --force; }
          deploy || { echo "::warning::The deploy failed; trying again in two minutes."; sleep 120; deploy; }
      - name: Check the live functions and rules
        run: node scripts/smoke-live.js
      - name: Back-fill records from game history (once)
        run: node scripts/backfill-records.js
      - name: Back-fill games played as X and as O, and accounts' last activity, from game history (once)
        run: node scripts/backfill-accounts.js
      - name: Back-fill each player's record against each opponent (Top opponents) from game history (once)
        run: node scripts/backfill-opponents.js
      - name: Check existing usernames against the word list (once per rules version)
        run: node scripts/check-usernames.js
      - name: Release switches set by request (once each)
        run: node scripts/set-releases.js
