# The launch reset (scripts/reset-production.js): a dated backup of production's database to Cloud Storage
# first (gs://tic-tac-chaos-backups/backups/), then matches, history, match logs, stats and tracking deleted and
# every record back to 0-0-0. Accounts, usernames, the admin flag, releases, game, computer and bot settings stay.
# Run it by hand from the Actions tab: "Reset production" -> Run workflow -> type RESET-PRODUCTION.
# "Dry run" makes the backup and prints what would go, and changes nothing. Undo: the "Restore production" workflow.
# After a reset, scripts/verify-reset.js checks it: every number on the admin page zero with and without my devices, every
# record 0-0-0, every admin section drawn; then one match against the computer played on the live site by a new device
# that is not mine, found on the Overview, Players, Matches and Games, and deleted again. "Check only" runs that alone.
name: Reset production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RESET-PRODUCTION to delete (a dry run needs nothing)'
        required: false
        type: string
      dry_run:
        description: 'Dry run: back up and report only'
        required: true
        default: true
        type: boolean
      check_only:
        description: 'Check only: no backup, no reset; the checks after a reset (a test match is played and deleted)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-data
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Confirm
        env:
          CONFIRM: ${{ inputs.confirm }}
          DRY: ${{ inputs.dry_run }}
          ONLY: ${{ inputs.check_only }}
        run: |
          if [ "$ONLY" = "true" ]; then echo "Check only: nothing is backed up or reset."; exit 0; fi
          if [ "$DRY" != "true" ] && [ "$CONFIRM" != "RESET-PRODUCTION" ]; then echo "::error::Type RESET-PRODUCTION in the confirm box (or run a dry run)."; exit 1; fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install
        run: npm ci --prefix functions
      - name: Credentials
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "::error::The FIREBASE_SERVICE_ACCOUNT secret is missing."; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
          echo "TTC_PROJECT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('.firebaserc','utf8')).projects.production)")" >> "$GITHUB_ENV"
      - name: Check the key
        run: node scripts/check-key.js
      - name: Back up, then reset
        if: ${{ !inputs.check_only }}
        env:
          CONFIRM: ${{ inputs.confirm }}
          DRY: ${{ inputs.dry_run }}
        run: node scripts/reset-production.js $([ "$DRY" = "true" ] && echo --dry-run)
      - name: A browser for the checks
        if: ${{ inputs.check_only || !inputs.dry_run }}
        run: |
          npm ci
          npm i --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check the reset (every number zero; one match against the computer on the live site, shown on every section, then deleted)
        if: ${{ inputs.check_only || !inputs.dry_run }}
        run: node scripts/verify-reset.js
