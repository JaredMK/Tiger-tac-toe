# Publishes the game to GitHub Pages when the site changed on main (the page, its modules in src/, the
# admin page, the Trivia questions). The first run also switches Pages on for the repository.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'admin.html'
      - 'styles.html'
      - 'playtest.js'
      - 'trivia.json'
      - 'src/**'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Collect the site (only the web files; not the functions or tests)
        # The page and its modules as they are (no build step). Matter.js (for Mini Golf, Pool, Bowling and
        # Pinball) loads from cdnjs; the copy from npm sits beside the page as the fallback.
        run: |
          npm ci
          mkdir _site
          cp index.html admin.html playtest.js trivia.json styles.html .nojekyll _site/
          cp -r src _site/src
          cp node_modules/matter-js/build/matter.min.js _site/matter.min.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
