# The old GitHub Pages address (jaredmk.github.io/Tiger-tac-toe/) now only sends visitors to tictacchaos.com, with the
# rest of the address kept (a friend's ?room= link, admin.html). The game itself is on Firebase Hosting (deploy.yml).
# It goes out with a release (a push to main), and only once tictacchaos.com serves the game, so the old address never
# points at a site that is not there yet.
name: Old address redirect (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - '.github/pages-redirect/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  redirect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Wait until tictacchaos.com serves the game (up to 30 minutes)
        run: |
          for i in $(seq 1 60); do
            if curl -fsS https://tictacchaos.com/version.json | grep -q '"env":"production"'; then echo "tictacchaos.com is live."; exit 0; fi
            sleep 30
          done
          echo "::error::tictacchaos.com does not serve the game yet: the old address keeps the old site. Run this workflow again once the domain is connected."
          exit 1
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .github/pages-redirect
      - id: deployment
        uses: actions/deploy-pages@v4
