@media (max-height: 600px) { .menu-card { gap: 8px; } .btn.howto { height: 44px; } .g-hilo { gap: 10px; } .pad button { height: 46px; } .g-dice { gap: 8px; } }   /* a short phone: Higher/Lower fits under the turn bar */
.explain { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 20px max(16px, env(safe-area-inset-right)) 20px max(16px, env(safe-area-inset-left)); background: rgba(22, 18, 16, .5); animation: fade .15s ease-out; cursor: pointer; }
.excard { width: min(100%, 380px); max-height: 100%; overflow-y: auto; background: var(--paper); border: 4px solid var(--ink); box-shadow: 0 7px 0 var(--ink); border-radius: 26px 18px 24px 20px / 20px 26px 18px 24px; padding: 18px 18px 12px; display: flex; flex-direction: column; gap: 12px; animation: pop .25s cubic-bezier(.3, 1.5, .5, 1) both; }
.excard h2 { display: flex; align-items: center; gap: 10px; margin: 0; font-size: 26px; line-height: 1.1; padding-top: 3px; }

.exline { margin: 0; display: grid; grid-template-columns: 58px 1fr; gap: 10px; align-items: start; font-size: 19px; line-height: 1.3; }
.exline b { font-family: 'Luckiest Guy', 'Arial Black', sans-serif; font-weight: 400; font-size: 15px; text-align: center; padding: 4px 0 1px; border: 2.5px solid var(--ink); border-radius: 999px; background: var(--sky); color: #fff; letter-spacing: .04em; }

.rulecard { background: #fff; border: 3.5px solid var(--ink); box-shadow: 0 4px 0 var(--ink); border-radius: 18px 12px 20px 14px / 14px 20px 12px 18px; padding: 12px 16px; font-size: 19px; line-height: 1.35; }
.rulecard p { margin: 0; } .rulecard p + p { margin-top: 8px; }
.howlist { grid-template-columns: 1fr; }

/* computer players */

#app > .ask { position: fixed; inset: 0; z-index: 45; }              /* the join-link question, over everything */
.rtoon { width: 46px; height: 46px; border-radius: 50%; border: 3.5px dashed var(--ink); display: grid; place-items: center; font-family: 'Luckiest Guy', 'Arial Black', sans-serif; font-size: 26px; line-height: 1; padding-top: 4px; background: var(--paper); }
.slot .who-p { width: 46px; height: 46px; }

.slot .field { grid-column: 1 / -1; }
.slot.cpu .field { position: relative; padding-top: 24px; }                  /* room for the computer, bobbing inside its card */
.slot-ico { position: absolute; top: 2px; right: 10px; width: 36px; height: 36px; animation: bobin 1.4s ease-in-out infinite; transform-origin: 50% 100%; pointer-events: none; }
.slot-ico .cpui { width: 36px; height: 36px; margin: 0; }
/* the final board, to look back over */

@keyframes squash { 0% { transform: translateY(-160%) scale(.6, 1.6); opacity: 0; } 10% { opacity: 1; } 42% { transform: translateY(0) scale(.75, 1.35); } 55% { transform: translateY(0) scale(1.45, .55); } 70% { transform: translateY(-12%) scale(.85, 1.2); } 84% { transform: translateY(0) scale(1.1, .9); } 100% { transform: translateY(0) scale(1, 1); opacity: 1; } }
/* a burst pops in, sits about a second, then pops out: it always ends invisible */
@keyframes burstlife {
  0% { transform: scale(0) rotate(-40deg); opacity: 0; animation-timing-function: cubic-bezier(.3, 1.8, .5, 1); }
  30% { transform: scale(1) rotate(-10deg); opacity: 1; }
  80% { transform: scale(1) rotate(-10deg); opacity: 1; animation-timing-function: ease-in; }
  100% { transform: scale(1.35) rotate(-4deg); opacity: 0; }
}
@keyframes burstlife2 {
  0% { transform: scale(0) rotate(30deg); opacity: 0; animation-timing-function: cubic-bezier(.3, 1.8, .5, 1); }
  30% { transform: scale(1) rotate(8deg); opacity: 1; }
  80% { transform: scale(1) rotate(8deg); opacity: 1; animation-timing-function: ease-in; }
  100% { transform: scale(1.35) rotate(3deg); opacity: 0; }
}
@keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
@keyframes bob { 0%, 100% { transform: translateY(0) scale(1.06, .94); } 50% { transform: translateY(-12px) scale(.95, 1.05); } }
@keyframes bobin { 0%, 100% { transform: translateY(0) scale(1.06, .94); } 50% { transform: translateY(-8px) scale(.95, 1.05); } }
@keyframes hop { 0%, 100% { transform: translateY(0) scale(1, 1); } 40% { transform: translateY(-7px) scale(.95, 1.06); } 60% { transform: translateY(0) scale(1.08, .92); } }
@keyframes wiggle { 0%, 100% { transform: rotate(-3deg) scale(1); } 50% { transform: rotate(2deg) scale(1.05); } }
@keyframes stamp { 0% { transform: scale(2.6); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

@keyframes hopx { 0%, 100% { transform: translateY(0) scale(1.06, .94); } 50% { transform: translateY(-12px) scale(.95, 1.05); } }

.lb, .hlist { display: flex; flex-direction: column; gap: 8px; padding-bottom: 6px; }
.lbrow, .hirow { width: 100%; min-height: 48px; display: grid; align-items: center; gap: 10px; padding: 6px 12px; text-align: left; background: #fff; color: var(--ink); border: 2.5px solid var(--ink); border-radius: 13px 9px 12px 10px; box-shadow: 0 3px 0 var(--ink); font-family: 'Patrick Hand', cursive; font-size: 17px; }
.lbrow { grid-template-columns: 50px minmax(0, 1fr) auto 62px; }
.lbrow.me { background: var(--o-soft); }
.lbrow .rk, .lbrow .rt { font-family: 'Luckiest Guy', sans-serif; font-weight: 400; padding-top: 3px; }
.lbrow .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lbrow .rc { color: var(--muted); text-align: right; font-size: 15px; }
.lbme { flex: none; width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 4px; margin: 0; padding-top: 4px; }

.pcard { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; align-items: center; padding: 14px 16px; background: #fff; border: 3px solid var(--ink); border-radius: 16px 12px 15px 11px; box-shadow: 0 4px 0 var(--ink); }
.pcard .prt { display: flex; flex-direction: column; align-items: center; }

.pcard .pjoin { grid-column: 1 / -1; }
.hh { margin: 6px 0 0; font-family: 'Luckiest Guy', sans-serif; font-weight: 400; font-size: 18px; }

.badge { font-style: normal; font-size: 13px; padding: 1px 8px; border: 2px solid var(--ink); border-radius: 999px; background: var(--paper); }

.win-card .vs .orec { color: var(--muted); font-size: 15px; }
/* the players' intro on a Find Match game */

.vscard { width: min(100%, 380px); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; padding: 18px 14px 12px; background: var(--paper); border: 4px solid var(--ink); box-shadow: 0 7px 0 var(--ink); border-radius: 26px 18px 24px 20px / 20px 26px 18px 24px; animation: pop .3s cubic-bezier(.3, 1.5, .5, 1) both; }

/* My Stats and profiles */

.pcard .ppct, .pcard .pfr { display: flex; flex-direction: column; }
.pcard .ppct { align-items: flex-end; }
.pcard .ppct b, .pcard .pfr b { font-family: 'Luckiest Guy', sans-serif; font-weight: 400; font-size: 24px; padding-top: 3px; }

}
.link.opp { display: inline; height: auto; min-height: 44px; padding: 0 8px; font-size: 17px; text-decoration: underline; }
/* ---------- the card games and the wheel: Blackjack, Ride the Bus, Roulette ---------- */
/* Playing cards: cream paper, an ink outline, the rank in the corner and a big suit. A card slides in from
   the shoe (.slide, at --d) and turns face up (.flip, at --f): two animations, on the card and on its inner
   face, each from its own moment in the move. Face down: the back, sky-blue stripes. */
.plc { --cw: 52px; position: relative; display: inline-block; flex: none; width: var(--cw); height: calc(var(--cw) * 1.4); perspective: 500px; vertical-align: middle; }
.pcin { position: absolute; inset: 0; transform-style: preserve-3d; }
.plc.down .pcin { transform: rotateY(180deg); }
.pcf { position: absolute; inset: 0; border-radius: calc(var(--cw) * .14); border: 2.5px solid var(--ink); box-shadow: 0 3px 0 var(--ink); backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.pcf.fc { background: var(--paper); color: var(--ink); }
.plc.red .pcf.fc { color: #d6301e; }
.pcf.rev { transform: rotateY(180deg); background: repeating-linear-gradient(45deg, var(--sky) 0 calc(var(--cw) * .09), #8cc7e3 calc(var(--cw) * .09) calc(var(--cw) * .18)); box-shadow: 0 3px 0 var(--ink), inset 0 0 0 calc(var(--cw) * .06) var(--paper); }
.pcf .rk { position: absolute; left: 7%; top: 4%; font: 400 calc(var(--cw) * .42)/1 'Luckiest Guy', sans-serif; letter-spacing: -.03em; }
.pcf .suit { position: absolute; fill: currentColor; }
.pcf .suit.sm { left: 8%; top: 38%; width: 26%; }
.pcf .suit.lg { right: 7%; bottom: 7%; width: 52%; }
.plc.ghost { opacity: .25; }
.plc.slide { animation: pcslide .26s var(--d, 0ms) cubic-bezier(.25, .8, .35, 1) both; }
.plc.flip .pcin { animation: pcflip .3s var(--f, 0ms) ease-in-out both; }
@keyframes pcslide { from { opacity: 0; transform: translate(var(--sx, 110px), var(--sy, -90px)) rotate(-16deg); } 35% { opacity: 1; } to { opacity: 1; transform: none; } }
@keyframes pcflip { from { transform: rotateY(180deg); } to { transform: rotateY(0); } }
.suit.inl { display: inline-block; width: .95em; height: .95em; vertical-align: -.1em; fill: currentColor; margin-left: 1px; }
.cshort { font-weight: 800; white-space: nowrap; }
.cshort.red { color: #d6301e; }
.appear { animation: appearin .3s var(--t, 0ms) ease-out both; }
@keyframes appearin { from { opacity: 0; transform: scale(.6); } 60% { opacity: 1; transform: scale(1.12); } to { opacity: 1; transform: none; } }

/* the two players' tallies (Blackjack wins, Roulette hits): pips, filled for each one won */
.ctals { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; flex: none; }
.ctals.col { grid-template-columns: 1fr; align-content: center; }
.ctal { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--paper); border: 3px solid var(--ink); border-radius: 14px 10px 16px 9px; padding: 5px 10px 3px; min-width: 0; }
.ctal > b { font-weight: 800; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.ctal.now { box-shadow: 0 0 0 3px var(--o); }
.ctal.X.now { box-shadow: 0 0 0 3px var(--x); }
.ctal .pips { display: flex; gap: 4px; flex: none; }
.ctal .pips i { width: 15px; height: 15px; border-radius: 50%; border: 2.5px solid var(--ink); background: var(--paper); }
.ctal.X .pips i.on { background: var(--x); }
.ctal.O .pips i.on { background: var(--o); }
.ctal .pips i.fillin { animation: pipfill .4s var(--t, 0ms) cubic-bezier(.3, 1.6, .5, 1) both; }
@keyframes pipfill { from { background: var(--paper); transform: none; } 1% { transform: scale(.6); } to { transform: none; } }
.cbtns { display: grid; gap: 8px; flex: none; }
.cbtns.one { grid-template-columns: 1fr; }
.cbtns.two { grid-template-columns: 1fr 1fr; }
.cbtns.three { grid-template-columns: 1fr 1fr 1fr; }
.cbtns.four { grid-template-columns: repeat(4, 1fr); }
.cbtns .big { min-width: 0; padding: 4px 6px 0; }
.big.dbl { background: var(--sky); color: var(--ink); }

/* Blackjack: the felt, with the dealer above and the hand in play below */
.g-bj { width: min(var(--gw), 440px); height: var(--gh); display: flex; flex-direction: column; gap: 10px; padding-top: 4px; }
.felt { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: space-around; gap: 6px; padding: 10px 12px; background: radial-gradient(ellipse at 50% 40%, #3f8a4b, #2c6a37); border: 3.5px solid var(--ink); border-radius: 22px 16px 24px 14px; box-shadow: 0 5px 0 var(--ink), inset 0 0 0 4px rgba(255, 248, 232, .15); }
.bjrow { display: flex; flex-direction: column; align-items: center; gap: 6px; --cw: clamp(40px, calc(var(--gh) / 7), 74px); }
.bjrow .plc { --cw: inherit; }
.bjrow.dealer { --sx: 90px; --sy: -40px; }
.bjrow.player { --sx: 90px; --sy: -160px; }
.bjlab { color: var(--paper); font-weight: 800; font-size: 14px; display: flex; gap: 8px; align-items: baseline; text-shadow: 0 1px 0 rgba(0, 0, 0, .35); }
.bjlab b.X, .bjlab b.O { background: var(--paper); border-radius: 8px; padding: 0 6px; text-shadow: none; }
.bjtot { background: var(--ink); color: var(--paper); border-radius: 999px; padding: 1px 9px 0; font-size: 13px; text-shadow: none; }
.bjtot:empty { display: none; }
.bjcards { display: flex; align-items: center; justify-content: center; min-height: calc(var(--cw) * 1.4 + 3px); }
.bjstack { display: grid; }
.bjstack > .bjset { grid-area: 1 / 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.bjmid > .bjset { justify-content: center; }
.bjcards .plc + .plc { margin-left: calc(var(--cw) * -.28); }
.bjres { align-self: center; display: flex; align-items: center; gap: 8px; min-height: 34px; padding: 3px 14px 1px; border: 3px solid var(--ink); border-radius: 999px; background: var(--paper); font: 400 17px 'Luckiest Guy', sans-serif; text-align: center; }
.bjres .pc { width: 26px; height: 26px; }
.bjres.none { font: 700 14px 'Patrick Hand', sans-serif; background: rgba(255, 248, 232, .85); border-color: transparent; }
.bjres.bj, .bjres.win { background: var(--o); }
.bjres.bust, .bjres.lose { background: #f1c8bf; }

/* Ride the Bus: each player's four slots, the deck and the card drawn, the question */
.g-bus { width: min(var(--gw), 440px); height: var(--gh); display: flex; flex-direction: column; gap: 10px; padding-top: 4px; }
.busrows { display: flex; flex-direction: column; gap: 6px; flex: none; }
.busrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; background: var(--paper); border: 3px solid var(--ink); border-radius: 14px 10px 16px 9px; padding: 5px 8px; --cw: clamp(30px, calc(var(--gh) / 14), 40px); }
.busrow.now { box-shadow: 0 0 0 3px var(--o); }
.busrow.X.now { box-shadow: 0 0 0 3px var(--x); }
.busnm { display: flex; flex-direction: column; min-width: 0; }
.busnm b { align-self: flex-start; max-width: 100%; font-weight: 800; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.busnm small { color: var(--muted); font-size: 12px; font-weight: 700; }
.busslots { display: flex; gap: 5px; }
.busslot { position: relative; width: var(--cw); height: calc(var(--cw) * 1.4); flex: none; }
.bsl { position: absolute; inset: 0; border-radius: calc(var(--cw) * .14); border: 2.5px dashed rgba(22, 18, 16, .3); display: grid; place-items: center; color: var(--muted); }
.bsl-ico { display: grid; place-items: center; width: 64%; height: 64%; }
.bsl-ico svg { width: 100%; height: 100%; }
.bsl.next { border: 2.5px solid var(--ink); background: #fff3c4; color: var(--ink); }
.bsl.got { border: 0; }
.bsl .plc { --cw: inherit; }
.bsl.got.tf .plc { animation: arrive .3s var(--f, 0ms) cubic-bezier(.3, 1.6, .5, 1) both; }
@keyframes arrive { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: none; } }
/* timed swaps, from the move: .tu shows until --u, .tf from --f (nothing in the progress rows changes early) */
.tu { animation: tuntil 1ms var(--u, 0ms) both; }
.tf { animation: tfrom 1ms var(--f, 0ms) both; }
@keyframes tuntil { to { visibility: hidden; opacity: 0; } }
@keyframes tfrom { from { visibility: hidden; opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .tu { display: none; } }
.bswap { display: grid; } .bswap > span { grid-area: 1 / 1; }

// The message in a burst: a line for the name, the message wrapped to short lines, the type sized to fit.

  if (m.name) lines.unshift(m.name.toUpperCase() + ' —');

function renderProfile() {
  const p = prof || {};

    const sum = (...rs) => rs.reduce((t, r) => { r = r || {}; for (const k of ['wins', 'losses', 'draws']) t[k] += r[k] || 0; return t; }, { wins: 0, losses: 0, draws: 0 });
    const addMinis = (...ms) => { const out = {}; for (const m of ms) for (const [t, v] of Object.entries(m || {})) { const o = (out[t] = out[t] || { won: 0, lost: 0 }); o.won += (v && v.won) || 0; o.lost += (v && v.lost) || 0; } return out; };

    const addSides = (...ss) => ({ X: sum(...ss.map(x => x && x.X)), O: sum(...ss.map(x => x && x.O)) });   // games played as X and as O
    const fsides = u.friend && u.friend.sides;
    const sides = view === 'local' ? addSides(loc.sides) : view === 'all' ? addSides(u.sides, fsides, loc.sides) : addSides(u.sides, fsides);
    const games = rec.wins + rec.losses + rec.draws;

      `<tr><td><span class="pg">${ICONS[r.t]}<span>${INFO[r.t].name}</span></span></td><td>${r.won}</td><td>${r.lost}</td><td>${rate(r.won, r.lost)}</td></tr>`).join('')}</tbody></table>`

  if (act === 'explain-close') { closeExplain(); return; }
  if (act === 'intro-close') { closeIntro(); return; }
  if (act === 'ask-stay') { joinAsk = null; render(); scheduleCpu(); return; }
  if (act === 'ask-leave') { if (joinAsk) leaveAndJoin(joinAsk.code); return; }
  if (act === 'dismiss') { if (Date.now() >= flashReady) dismissFlash(); return; }   // not before the animation is over

def('point', 0.14, (c, d, t) => sfxTone(c, d, t, 700, .08, { to: 1000, vol: .35, type: 'triangle' }), { level: .4, vary: true });
def('bank', 0.45, (c, d, t) => [1500, 1900, 2400, 1900].forEach((f, i) => sfxTone(c, d, t + i * .06, f, .1, { vol: .3, type: 'triangle' })), { level: .55 });
def('bust', 0.75, (c, d, t) => { sfxNoise(c, d, t, .3, { f: 1500, to: 200, q: .5, filter: 'lowpass', vol: .9 }); sfxTone(c, d, t, 400, .6, { to: 60, vol: .5, type: 'sawtooth' }); }, { level: .7 });
def('dig', 0.32, (c, d, t) => { sfxNoise(c, d, t, .25, { f: 900, to: 300, q: .8, filter: 'lowpass', vol: .6 }); sfxTone(c, d, t + .2, 120, .1, { to: 80, vol: .4 }); }, { level: .55 });
def('band', 0.28, (c, d, t) => sfxTone(c, d, t, 880, .25, { vol: .35, type: 'triangle' }), { level: .5 });
def('sparkle', 0.55, (c, d, t) => [1319, 1760, 2093, 2637].forEach((f, i) => sfxTone(c, d, t + i * .07, f, .25, { vol: .25 })), { level: .55 });
def('pieceSlide', 0.24, (c, d, t) => sfxNoise(c, d, t, .2, { f: 1200, to: 600, q: .8, filter: 'lowpass', vol: .35 }), { level: .45 });
def('knock', 0.32, (c, d, t) => { sfxTone(c, d, t, 260, .12, { to: 220, vol: .6, type: 'triangle' }); sfxTone(c, d, t + .12, 240, .12, { vol: .5, type: 'triangle' }); }, { level: .6 });
def('peg', 0.07, (c, d, t) => sfxTone(c, d, t, 900, .05, { vol: .5, type: 'triangle' }), { level: .4, vary: true });
def('marker', 0.06, (c, d, t) => sfxTone(c, d, t, 1500, .04, { vol: .4 }), { level: .3, vary: true });
def('reveal', 0.65, (c, d, t) => { sfxTone(c, d, t, 300, .5, { to: 900, vol: .4, type: 'triangle' }); [1046, 1318].forEach((f, i) => sfxTone(c, d, t + .45 + i * .08, f, .25, { vol: .35 })); }, { level: .6 });
def('boing', 0.6, (c, d, t) => { sfxTone(c, d, t, 200, .5, { to: 700, vol: .5 }); sfxTone(c, d, t, 700, .4, { to: 350, vol: .2 }); }, { level: .6 });
// ---- the card games and the wheel
def('cardSlide', 0.14, (c, d, t) => sfxNoise(c, d, t, .12, { f: 2600, to: 1100, q: .9, vol: .4 }), { level: .4, vary: true });
def('cardFlip', 0.07, (c, d, t) => { sfxNoise(c, d, t, .035, { f: 3400, q: 1.6, vol: .6, att: .001 }); sfxTone(c, d, t, 1700, .03, { vol: .15, type: 'triangle' }); }, { level: .4, vary: true });
def('chips', 0.42, (c, d, t) => [0, .07, .16].forEach((dt, i) => { sfxTone(c, d, t + dt, 2500 + i * 320, .12, { vol: .3 }); sfxNoise(c, d, t + dt, .03, { f: 5200, q: 2, vol: .3, att: .001 }); }), { level: .5 });
def('push', 0.32, (c, d, t) => { sfxTone(c, d, t, 523, .12, { vol: .3, type: 'triangle' }); sfxTone(c, d, t + .13, 523, .15, { vol: .3, type: 'triangle' }); }, { level: .4 });
def('rlSpin', 1.3, (c, d, t) => { sfxNoise(c, d, t, 1.25, { f: 1100, to: 300, q: .6, filter: 'lowpass', vol: .3, att: .12 }); sfxTone(c, d, t, 90, 1.2, { to: 55, vol: .12, att: .15 }); }, { level: .35 });   // (fades as the wheel slows; the ball's clicks carry on to the drop)
def('ballTick', 0.04, (c, d, t) => sfxTone(c, d, t, 3100, .025, { vol: .35, type: 'triangle' }), { level: .28, vary: true });
def('ballDrop', 0.3, (c, d, t) => { sfxTone(c, d, t, 1900, .05, { vol: .45, type: 'triangle' }); sfxTone(c, d, t + .1, 1650, .05, { vol: .3, type: 'triangle' }); sfxNoise(c, d, t + .18, .07, { f: 2600, q: 1.5, vol: .35 }); }, { level: .5 });

// Renders every sound into a buffer, one after another (quick, and gentle on a phone). Runs at page load.
SND.load = function () {
  const OC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  if (!OC) return Promise.resolve();
  return Object.keys(SFX).reduce((p, name) => p.then(() => new Promise(done => {
    const s = SFX[name], oc = new OC(1, Math.ceil(s.dur * 44100), 44100);
    oc.oncomplete = e => {
      const buf = e.renderedBuffer, x = buf.getChannelData(0);
      let peak = 0; for (let i = 0; i < x.length; i++) peak = Math.max(peak, Math.abs(x[i]));
      if (peak > 0) for (let i = 0; i < x.length; i++) x[i] *= s.level / peak;   // balanced: each sound peaks at its own level
      SND.bufs[name] = buf; done();
    };
    s.make(oc, oc.destination, 0);
    oc.startRendering();
  })), Promise.resolve()).then(() => { SND.loaded = true; });
};
// The first tap (or key) unlocks audio: the context starts inside the gesture, as iPhone requires.
SND.unlock = function () {
  if (!SND.ctx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { SND.ctx = new AC(); } catch (e) { return; }
    SND.out = SND.ctx.createGain(); SND.out.gain.value = 0.9; SND.out.connect(SND.ctx.destination);
  }
  if (SND.ctx.state !== 'running') {
    SND.ctx.resume().catch(() => {});
    const b = SND.ctx.createBuffer(1, 1, 22050), s = SND.ctx.createBufferSource();   // a silent sound inside the gesture: the rest of iPhone's unlock
    s.buffer = b; s.connect(SND.ctx.destination); s.start(0);
  }
};
// Starts a sound now (or `o.at` seconds later). Nothing plays while muted, or before audio is unlocked.
SND.play = function (name, o = {}) {
  const b = SND.bufs[name];
  if (!b || SND.muted || !SND.ctx || SND.ctx.state !== 'running') return;
  const src = SND.ctx.createBufferSource(), g = SND.ctx.createGain();
  src.buffer = b;
  src.playbackRate.value = o.rate || (SFX[name].vary ? 0.94 + Math.random() * 0.12 : 1);
  g.gain.value = o.vol == null ? 1 : o.vol;
  src.connect(g); g.connect(SND.out);
  src.start(SND.ctx.currentTime + (o.at || 0));
  SND.log.push(name); if (SND.log.length > 400) SND.log.splice(0, 200);   // (what has played, for the tests)
};
SND.setMuted = function (m) {
  SND.muted = !!m;
  try { localStorage.setItem(KEY + '.sound', SND.muted ? 'off' : 'on'); } catch (e) { /* no storage: the choice lasts this visit */ }
};
try { SND.muted = localStorage.getItem(KEY + '.sound') === 'off'; } catch (e) { /* no storage: sound on */ }
try { if (navigator.audioSession) navigator.audioSession.type = 'ambient'; } catch (e) { /* not here: the silent switch is the phone's own */ }
['pointerdown', 'touchend', 'click', 'keydown'].forEach(ev => document.addEventListener(ev, SND.unlock, { capture: true, passive: true }));
// Every control plays its tap sound when pressed (whether or not the game takes the press). The moves
// and card turns play their own sounds, from their events. A press on a disabled control is an error.
const TAP_SOUND = { explain: 'open', 'explain-close': 'close', pause: 'open', 'pause-resume': 'close', zoom: null, move: null, pick: null,
  mmcol: 'peg', mmslot: 'peg', rlnum: 'peg', rlgrp: 'peg', rlzero: 'peg', key: 'key', bksp: 'key', enter: 'key', side: 'toggle', kind: 'toggle', lside: 'toggle', timer: 'toggle', adv: 'toggle',
  sound: 'toggle', 'games-all': 'select', 'games-none': 'deselect', share: 'copy', back: 'tap' };   // (back: the Board button in a square, a plain tap)
document.addEventListener('click', e => {
  if (search.on) return;                                           // the searching screen is silent (even its Cancel)
  const el = e.target.closest && e.target.closest('[data-act], label.chk');
  if (!el || el.classList.contains('chk')) return;                 // (a box: its change plays the toggle)
  const act = el.dataset.act;
  let name = act && act in TAP_SOUND ? TAP_SOUND[act] : (el.classList.contains('back') ? 'back' : 'tap');
  if (name) SND.play(name);
}, true);
document.addEventListener('pointerdown', e => { if (e.target.closest && e.target.closest('button:disabled, input:disabled')) SND.play('error'); }, true);
document.addEventListener('change', e => { if (e.target.type === 'checkbox') SND.play('toggle'); }, true);
// The sound switch: a speaker with waves when sound is on, crossed out when it is off. Its label says which.
const soundLabel = () => (SND.muted ? 'Sound off' : 'Sound on');
const soundIcon = () => `<svg class="snd-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 9.5h3.6L12 5.5v13l-4.9-4H3.5z" fill="currentColor"/>${SND.muted ? '<path d="M16 9.5l5 5M21 9.5l-5 5"/>' : '<path d="M15.5 9a4.2 4.2 0 0 1 0 6"/><path d="M18.3 6.4a8 8 0 0 1 0 11.2"/>'}</svg>`;
const soundBtn = (cls) => `<button class="btn snd ${cls}" data-act="sound" aria-label="${soundLabel()}" title="${soundLabel()}" aria-pressed="${!SND.muted}">${soundIcon()}</button>`;
// The sounds of one move, from its result: [name, ms after the move starts, playback rate], in order.
// Each is timed to the animation it stands for (the same timings the animation uses).
function moveSounds(f) {
  const out = [], add = (n, ms, rate) => out.push([n, ms, rate]);
  const won = f.kind === 'claim' || f.kind === 'match', total = playMs(f, hexLen(f));
  const sq = state.squares[f.square], mini = sq ? sq.mini : {}, last = mini.guesses ? mini.guesses[mini.guesses.length - 1] : null;
  if (f.timeout) { add('buzz', 0); add('randomMove', 380); }
  switch (f.type) {
    case 'ttt': add('mark', 0); if (won) add('swish', 380); break;
    case 'c4': add('whoosh', 0); add('clack', 330); break;
    case 'bs': add('fire', 0); if (f.hit) { add('boom', 430); if (won) add('sink', 700); } else add('splash', 450); break;
    case 'wordle': if (last) last.marks.forEach((m, k) => add(m === 'g' ? 'tileG' : m === 'y' ? 'tileY' : 'tileX', 200 + k * 180)); if (won) add('solve', 1100); break;
    case 'hangman': add(f.kind === 'again' ? 'ding' : 'thud', 260); if (won) add('solve', 600); break;
    case 'hex': add('hexPlace', 0); if (won) { const n = mini.winCells ? mini.winCells.length : 4; for (let k = 0; k < n; k++) add('pathNote', 400 + k * 90, Math.pow(2, k / 12)); } break;
    case 'hilo': add('hiloBlip', 0); if (last) { if (last.res === 'hit') add('ding', 260); else add(last.res === 'higher' ? 'higher' : 'lower', 260); } break;
    case 'snakes': case 'dice': {
      add('rattle', 0); add('thunk', DIE_MS);
      const steps = f.type === 'snakes' ? Math.max(1, f.land - f.from) : Math.max(1, diceSlot(f.total) - diceSlot(f.total - f.roll));
      for (let k = 0; k < steps; k++) add('hop', DIE_MS + k * HOP_MS);
      if (f.via === 'ladder') add('climb', DIE_MS + steps * HOP_MS);
      if (f.via === 'snake') add('slide', DIE_MS + steps * HOP_MS);
      break;
    }
    case 'memory': add('flipUp', 0); add(won ? 'pair' : 'nopair', 380); break;
    case 'candy': {
      const N = 12;                                                  // the wheel ticks, slower and slower as it stops
      for (let k = 1; k <= N; k++) add('wheelTick', SPIN_MS * (1 - Math.pow(1 - k / N, 2)));
      const steps = Math.max(1, f.to - f.from);
      for (let k = 0; k < steps; k++) add('hop', SPIN_MS + k * HOP_MS);
      break;
    }
    case 'coins': { add('coinSpin', 0); for (let k = 0; k < (f.n || 0); k++) add('clink', 1000 + k * 80); break; }
    case 'bj': {                                                    // every card slides and turns, as bjPlan has it; then the result
      const b = f.bj;
      if (!b) break;
      const pl = bjPlan(b);
      for (const c of pl.P.concat(pl.D, pl.NP || [], pl.ND || [])) { if (!c) continue; if (c.slideAt != null) add('cardSlide', c.slideAt); if (c.flipAt != null) add('cardFlip', c.flipAt); }
      const result = (x, end, pEnd) => {
        if (x.res === 'win' || x.res === 'bj') { add('chips', end); if (x.gain > 1) add('chips', end + 170); }
        else if (x.res === 'push') add('push', end);
        else if (x.res === 'bust') add('bust', pEnd);
        else if (x.res === 'lose') add('nopair', end);
      };
      result(b, pl.end, pl.pEnd);
      if (b.next) result(b.next, pl.nEnd, pl.nPEnd);              // after a push, the new hand (when a natural settles it at once)
      break;
    }
    case 'bus': if (f.bus) { const tm = busTimes(f); add('cardSlide', tm.pre); add('cardFlip', tm.flip); add(f.bus.right ? 'ding' : 'thud', tm.mark); if (f.bus.right) add('cardSlide', tm.fly); } break;
    case 'rl': {
      const N = 14;                                                  // the ball clicks over the pockets, slower and slower
      add('rlSpin', 0);
      for (let k = 1; k <= N; k++) add('ballTick', Math.round(RLT.spin * Math.pow(k / N, 0.6)));
      add('ballDrop', RLT.spin);
      if (f.rl) add(f.rl.hit ? (f.rl.bet === 'zero' ? 'sparkle' : 'ding') : 'thud', RLT.spin + RLT.settle);
      break;
    }
    case 'pig':
      if (f.note === 'bust') { add('rattle', 0); add('thunk', 600); add('bust', 650); }
      else if (f.note === 'bank') add('bank', 350);
      else { add('rattle', 0); add('thunk', 600); add('point', 650); }
      break;
    case 'hunt': add('dig', 0); if (f.band === 0 || won) add('sparkle', 800); else add('band', 380, [0, 1100, 880, 660, 440][f.band] / 880); break;
    case 'hexapawn': add('pieceSlide', 0); if (f.capture) add('knock', 340); break;
    case 'mastermind': { const n = (f.solid || 0) + (f.hollow || 0); for (let k = 0; k < n; k++) add('marker', 450 + k * 250); if (won) add('reveal', 1450); break; }
    case 'bump': { add('spin', 0); const steps = Math.max(1, f.to - f.from); for (let k = 0; k < steps; k++) add('hop', SPIN3_MS + k * HOP_MS); if (f.bumped) add('boing', SPIN3_MS + steps * HOP_MS); break; }
  }
  const CASINO = ['bj', 'bus', 'rl'];
  if (won && f.kind !== 'match' && CASINO.includes(f.type)) add('won', total - 600);   // the card games and the wheel: the chime once the result shows
  else if (won && f.kind !== 'match' && f.type !== 'ttt' && f.type !== 'wordle' && f.type !== 'hangman') add('won', Math.round(total * .5));   // the square is won: a chime
  if (f.kind === 'draw') add('reset', 420);                          // the square resets with a new mini-game
  if (f.kind === 'match') { add('swish', total - 500); add(matchEndSound(), total); }   // the line on the board, then the end of the match
  return out;
}
// The end of the match, as this phone sees it: a win fanfare, a loss sting, or the tie chord.
function matchEndSound() { const k = endKind().list; return k === 'win' ? 'winFanfare' : k === 'loss' ? 'loss' : 'tie'; }
// The board comes back after a move: the turn passed to the other player (no whoosh out of the square).
function backSounds(from) {
  if (!state.winner && state.turn !== from.turn) SND.play('turn');
}

SND.load();                                                // renders the sounds now, in the background

boot();
</script>
