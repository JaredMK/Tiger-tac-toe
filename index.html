<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0e1016">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Insane-Tac-Toe</title>
<style>
:root {
  --bg: #0e1016;
  --panel: #181b26;
  --panel-2: #232737;
  --line: #2f3447;
  --text: #eef0f6;
  --muted: #9298ab;
  --x: #ff6b6b;
  --o: #4dabf7;
  --x-soft: rgba(255, 107, 107, .17);
  --o-soft: rgba(77, 171, 247, .17);
  --sea: #15395f;
  --sea-2: #1f4f84;
  --stone: #d9c7a6;
  --green: #5aa65b;
  --yellow: #c9a93d;
  --card: #f3eee4;
  --cr: #ef476f;
  --cy: #ffd166;
  --cg: #06d6a0;
  --cb: #4cc9f0;
  --hdr: 64px;
  --foot: 52px;
  --bar: 56px;
  --pad: 12px;
  --r: 14px;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
}
:root { color-scheme: dark; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  position: fixed; inset: 0; overflow: hidden;
  background: var(--bg); color: var(--text);
  font: 16px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  overscroll-behavior: none;
}
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:disabled { cursor: default; }
svg { display: block; }
b.X { color: var(--x); } b.O { color: var(--o); }
#app {
  height: 100vh; height: 100dvh;
  display: flex; flex-direction: column;
  padding: var(--sat) var(--sar) var(--sab) var(--sal);
}

/* ---------- header: whose turn ---------- */
.hdr {
  flex: none; height: var(--hdr);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px; border-bottom: 1px solid var(--line);
  transition: background .25s;
}
.hdr.t-X { background: linear-gradient(90deg, var(--x-soft), transparent 75%); }
.hdr.t-O { background: linear-gradient(90deg, var(--o-soft), transparent 75%); }
.turn { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 20px; }
.turn .g {
  width: 38px; height: 38px; border-radius: 10px;
  display: grid; place-items: center;
  font-size: 24px; font-weight: 900; color: var(--bg);
}
.t-X .turn { color: var(--x); } .t-X .turn .g { background: var(--x); }
.t-O .turn { color: var(--o); } .t-O .turn .g { background: var(--o); }
.score { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 15px; color: var(--muted); }
.score b { font-size: 17px; }

/* ---------- screens ---------- */
.scr {
  flex: 1; min-height: 0; position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: var(--pad);
  --vh: 100vh;
  --gw: calc(100vw - 2 * var(--pad) - var(--sal) - var(--sar));
}
@supports (height: 100dvh) { .scr { --vh: 100dvh; } }

/* ---------- main board ---------- */
.board-scr { --s: min(var(--gw), calc(var(--vh) - var(--hdr) - var(--foot) - 2 * var(--pad) - var(--sat) - var(--sab))); }
.board {
  width: var(--s); height: var(--s);
  display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 8px;
}
.sq {
  position: relative; border: 0; border-radius: var(--r); padding: 7px;
  background: var(--panel); box-shadow: inset 0 0 0 1px var(--line);
  display: flex; flex-direction: column; justify-content: space-between; gap: 4px;
  overflow: hidden; container-type: size; transition: transform .08s;
}
.sq:active:not(:disabled) { transform: scale(.96); }
.sq.last-X { box-shadow: inset 0 0 0 2px var(--x); }
.sq.last-O { box-shadow: inset 0 0 0 2px var(--o); }
.sq.own-X { background: var(--x-soft); box-shadow: inset 0 0 0 2px var(--x); }
.sq.own-O { background: var(--o-soft); box-shadow: inset 0 0 0 2px var(--o); }
.own-ov {
  position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none;
  font-weight: 900; line-height: 1; font-size: 56px; font-size: 64cqw; opacity: .55; text-shadow: 0 2px 14px rgba(0, 0, 0, .7);
}
.own-X .own-ov { color: var(--x); }
.own-O .own-ov { color: var(--o); }
.tg.tmem i.up { background: var(--card); }
.tg.tmem i.up svg { width: 72%; height: 72%; }
.lab {
  display: flex; align-items: center; justify-content: center; gap: 4px;
  color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .03em; white-space: nowrap;
  font-size: 10px; font-size: clamp(8px, 9cqw, 13px);
}
.lab svg { width: 1.25em; height: 1.25em; flex: none; }
.thumb { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }

/* miniatures */
.tg { display: grid; gap: 2px; }
.tg.g3 { grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); width: 62px; height: 62px; width: 60cqw; height: 60cqw; }
.tg.g3 i { display: grid; place-items: center; border-radius: 3px; background: var(--panel-2); font-weight: 900; line-height: 1; font-size: 12px; font-size: 12cqw; }
.tg i.X { color: var(--x); }
.tg i.O { color: var(--o); }
.tg.g5 { grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(6, 1fr); width: 52px; height: 62px; width: 52cqw; height: 62cqw; }
.tg.g5 i { border-radius: 50%; background: var(--panel-2); }
.tg.g5 i.X { background: var(--x); }
.tg.g5 i.O { background: var(--o); }
.tg.sea i { background: var(--sea); }
.tg.sea i.miss::after { content: ''; width: 36%; height: 36%; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .55); }
.tw { display: flex; flex-direction: column; align-items: center; gap: 1.5cqw; }
.twr { display: flex; gap: 1.5cqw; }
.twr i { width: 11cqw; height: 11cqw; border-radius: 1.5cqw; background: var(--panel-2); box-shadow: inset 0 0 0 1px var(--line); display: grid; place-items: center; font-size: 7cqw; font-weight: 800; line-height: 1; }
.twr i.g { background: var(--green); box-shadow: none; color: #fff; }
.twr i.y { background: var(--yellow); box-shadow: none; color: #1a1a1a; }
.twr i.x { background: var(--line); box-shadow: none; color: var(--muted); }
.tw small, .thg small, .thilo small { font-size: 8cqw; color: var(--muted); font-weight: 700; line-height: 1.2; }
.thg { display: flex; flex-direction: column; align-items: center; gap: 3cqw; }
.thg .hw { display: flex; gap: 1.2cqw; --tw: min(12cqw, calc(82cqw / var(--n))); }
.thg .hw i { width: var(--tw); height: calc(var(--tw) * 1.25); border-bottom: 2px solid var(--muted); display: grid; place-items: center; font-weight: 800; font-size: calc(var(--tw) * .75); line-height: 1; }
.thg .hw i.on { border-color: var(--text); }
.thex { display: flex; flex-direction: column; gap: 1cqw; }
.thex .hr { display: flex; gap: 1cqw; margin-left: calc(var(--k) * 5.5cqw); }
.thex .hr i { width: 10cqw; height: 10cqw; border-radius: 50%; background: var(--panel-2); }
.thex .hr i.X { background: var(--x); }
.thex .hr i.O { background: var(--o); }
.tcandy { display: flex; flex-direction: column; gap: 1.5cqw; width: 84cqw; }
.tcandy .bar { height: 11cqw; border-radius: 2cqw; background: var(--panel-2); display: flex; align-items: center; gap: 1cqw; padding: 0 1.5cqw; }
.tcandy .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 1cqw; }
.tcandy .grid i { aspect-ratio: 1; border-radius: 1.5cqw; display: flex; align-items: center; justify-content: center; }
.tcandy i.red { background: var(--cr); } .tcandy i.yellow { background: var(--cy); } .tcandy i.green { background: var(--cg); } .tcandy i.blue { background: var(--cb); }
.tcandy b { flex: none; width: 9cqw; height: 9cqw; border-radius: 50%; display: grid; place-items: center; font-size: 6cqw; font-weight: 900; line-height: 1; color: #fff; border: 1px solid rgba(0, 0, 0, .6); }
.tcandy b.X { background: var(--x); } .tcandy b.O { background: var(--o); }
.tcandy .grid b + b { margin-left: -3cqw; }
.thilo { text-align: center; }
.thilo b { display: block; font-size: 16cqw; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tdice { display: flex; flex-direction: column; gap: 4cqw; width: 84cqw; }
.tdice .tr { display: grid; grid-template-columns: 9cqw 1fr 12cqw; gap: 2cqw; align-items: center; font-weight: 800; font-size: 9cqw; line-height: 1; }
.tdice .tr span { text-align: right; font-variant-numeric: tabular-nums; }
.tdice .bar { height: 6cqw; border-radius: 99px; background: var(--panel-2); overflow: hidden; }
.tdice .bar i { display: block; height: 100%; }
.tdice .X .bar i { background: var(--x); }
.tdice .O .bar i { background: var(--o); }
.tg.tmem i { background: repeating-linear-gradient(45deg, #2a2f44 0 3px, #232737 3px 6px); color: var(--muted); font-size: 9cqw; }

.foot {
  flex: none; height: var(--foot); width: 100%; max-width: 560px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.hint { color: var(--muted); font-size: 13px; font-weight: 600; }
.link { border: 0; border-radius: 10px; height: 36px; padding: 0 12px; background: var(--panel-2); font-weight: 700; font-size: 13px; flex: none; }

/* ---------- zoomed mini-game ---------- */
.mini {
  --gh: calc(var(--vh) - var(--hdr) - var(--bar) - 2 * var(--pad) - var(--sat) - var(--sab));
  --g: min(var(--gw), var(--gh));
  animation: zoomin .18s ease-out;
}
.bar { flex: none; height: var(--bar); width: 100%; display: flex; align-items: center; gap: 12px; }
.bar.won { border-radius: 14px; padding: 0 12px 0 6px; }
.bar.won-X { background: var(--x-soft); }
.bar.won-O { background: var(--o-soft); }
.ttl small.won { color: var(--text); }
.back {
  flex: none; height: 44px; padding: 0 14px 0 10px; border: 0; border-radius: 12px;
  background: var(--panel-2); font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 2px;
}
.back:disabled { opacity: .35; }
.back svg { width: 20px; height: 20px; }
.ttl { min-width: 0; flex: 1; }
.ttl > b { display: block; font-size: 17px; }
.ttl small { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; color: var(--muted); font-size: 12px; font-weight: 600; line-height: 1.25; }
.gwrap { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }

.g-ttt, .g-bs {
  width: var(--g); height: var(--g);
  display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 10px;
}
.cell {
  border: 0; border-radius: 16px; padding: 0; background: var(--panel-2);
  display: grid; place-items: center; font-weight: 900; line-height: 1;
  font-size: calc(var(--g) * .22); transition: transform .08s;
}
.cell:active:not(:disabled) { transform: scale(.95); }
.cell.X { color: var(--x); }
.cell.O { color: var(--o); }
.cell.win.X { background: var(--x-soft); box-shadow: inset 0 0 0 3px var(--x); }
.cell.win.O { background: var(--o-soft); box-shadow: inset 0 0 0 3px var(--o); }
.pop { animation: pop .2s ease-out; }

.cell.sea { background: radial-gradient(circle at 30% 30%, var(--sea-2), var(--sea)); }
.cell.sea::after { content: ''; width: 16%; height: 16%; border-radius: 50%; background: rgba(255, 255, 255, .08); }
.cell.miss { background: var(--panel-2); }
.cell.miss::after { width: 26%; height: 26%; border: 3px solid rgba(255, 255, 255, .5); background: transparent; }
.cell.hit::after { display: none; }
.cell.hit svg { width: 62%; height: 62%; }
.cell.hit.X { background: var(--x-soft); box-shadow: inset 0 0 0 3px var(--x); color: var(--x); }
.cell.hit.O { background: var(--o-soft); box-shadow: inset 0 0 0 3px var(--o); color: var(--o); }

.g-c4 {
  --cw: min(var(--gw), calc(var(--gh) * 5 / 6));
  width: var(--cw); height: calc(var(--cw) * 6 / 5);
  display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(6, 1fr); gap: 6px;
  padding: 8px; background: var(--panel); border-radius: 16px;
}
.c4c { border: 0; padding: 0; border-radius: 50%; background: var(--panel-2); }
.c4c.X { background: var(--x); }
.c4c.O { background: var(--o); }
.c4c.win { box-shadow: inset 0 0 0 4px rgba(255, 255, 255, .85); }
.c4c.drop { animation: drop .22s ease-out; }

/* on-screen keyboard (Wordle, Hangman) */
.kb { flex: none; width: 100%; display: flex; flex-direction: column; gap: 6px; }
.krow { display: flex; justify-content: center; gap: 4px; }
.key {
  flex: none; width: calc((100% - 9 * 4px) / 10); min-width: 0; height: 46px; padding: 0;
  border: 0; border-radius: 8px; background: var(--panel-2);
  display: grid; place-items: center; font-weight: 800; font-size: 15px;
}
.key.wide { width: calc((100% - 9 * 4px) / 10 * 1.5 + 2px); font-size: 12px; }
.key svg { width: 22px; height: 22px; }
.key.g, .key.hit { background: var(--green); color: #fff; }
.key.y { background: var(--yellow); color: #1a1a1a; }
.key.x, .key.miss { background: var(--line); color: var(--muted); }
.key:disabled:not(.hit):not(.miss):not(.g):not(.y):not(.x) { opacity: .4; }
.key:active:not(:disabled) { transform: scale(.94); }

.g-wordle { width: min(var(--gw), 520px); height: var(--gh); display: flex; flex-direction: column; gap: 10px; --tile: min(52px, calc((var(--gw) - 40px) / 5)); }
.wlist { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; align-items: center; padding: 4px 0; }
.wlist > :first-child { margin-top: auto; }
.wrow { display: flex; gap: 5px; flex: none; }
.wrow.cur { justify-content: center; }
.wt {
  width: var(--tile); height: var(--tile); display: grid; place-items: center; border-radius: 6px;
  background: var(--panel-2); box-shadow: inset 0 0 0 2px var(--line);
  font-weight: 800; font-size: calc(var(--tile) * .5); line-height: 1;
}
.wt.g { background: var(--green); box-shadow: none; color: #fff; }
.wt.y { background: var(--yellow); box-shadow: none; color: #1a1a1a; }
.wt.x { background: var(--line); box-shadow: none; color: var(--muted); }
.wt.typed { box-shadow: inset 0 0 0 2px var(--muted); }
.empty { color: var(--muted); font-weight: 600; text-align: center; padding: 10px; }

.g-hang { width: min(var(--gw), 520px); height: var(--gh); display: flex; flex-direction: column; gap: 14px; --htile: min(50px, calc((var(--gw) - 48px) / 7)); }
.hword { flex: 1; min-height: 0; display: flex; gap: 6px; justify-content: center; align-items: center; }
.ht {
  width: var(--htile); height: calc(var(--htile) * 1.2); display: grid; place-items: center;
  border-bottom: 3px solid var(--muted); font-weight: 800; font-size: calc(var(--htile) * .62); line-height: 1;
}
.ht.on { border-color: var(--text); }
.hmiss { text-align: center; color: var(--muted); font-weight: 700; min-height: 20px; }
.hmiss b { color: var(--text); letter-spacing: .25em; }

.big { height: 64px; border: 0; border-radius: 16px; font-weight: 800; font-size: 20px; background: var(--panel-2); transition: transform .08s; }
.big.X { background: var(--x); color: var(--bg); }
.big.O { background: var(--o); color: var(--bg); }
.big:active:not(:disabled) { transform: scale(.97); }
.big:disabled { opacity: .5; }

.g-hex { width: var(--g); display: flex; flex-direction: column; align-items: center; gap: 8px; --hw: calc((var(--g) * .86 - 10px) / 5.5); --hh: calc(var(--hw) * 1.1547); }
.hexmid { display: flex; align-items: stretch; gap: 8px; }
.hexgoal { display: grid; place-items: center; font-weight: 900; font-size: 14px; border-radius: 999px; }
.hexgoal.O { width: calc(var(--g) * .86); height: 22px; background: var(--o-soft); color: var(--o); }
.hexgoal.X { width: 22px; background: var(--x-soft); color: var(--x); }
.hexboard { display: flex; flex-direction: column; }
.hrow { display: flex; gap: 2px; margin-left: calc(var(--r) * (var(--hw) + 2px) / 2); }
.hrow + .hrow { margin-top: calc(var(--hh) * -.25 + 2px); }
.hexc {
  width: var(--hw); height: var(--hh); border: 0; padding: 0; background: var(--panel-2);
  clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); display: grid; place-items: center;
}
.hexc.X { background: var(--x); }
.hexc.O { background: var(--o); }
.hexc.win::after { content: ''; width: 30%; height: 30%; border-radius: 50%; background: rgba(255, 255, 255, .9); }

/* ---------- setup screen ---------- */
.setup { justify-content: flex-start; gap: 10px; }
.setup-box { width: 100%; max-width: 520px; flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding: 4px 0; }
.setup h1 { margin: 6px 0 0; font-size: 28px; line-height: 1.1; }
.setup .sub { margin: 0; color: var(--muted); font-weight: 600; font-size: 14px; }
.names { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field span { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.field.X span { color: var(--x); }
.field.O span { color: var(--o); }
.field input {
  width: 100%; min-width: 0; height: 48px; padding: 0 12px; border-radius: 12px;
  border: 2px solid var(--line); background: var(--panel-2); color: var(--text);
  font: inherit; font-size: 17px; font-weight: 700; user-select: text; -webkit-user-select: text;
}
.field input:focus { outline: none; border-color: var(--muted); }
.field.X input:focus { border-color: var(--x); }
.field.O input:focus { border-color: var(--o); }
.games-h { display: flex; justify-content: space-between; align-items: baseline; font-weight: 800; font-size: 15px; }
.games-h small { color: var(--muted); font-weight: 700; font-size: 12px; }
.games { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.chk {
  display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 12px; border-radius: 12px;
  background: var(--panel-2); box-shadow: inset 0 0 0 1px var(--line); font-weight: 700; font-size: 14px; cursor: pointer; min-width: 0;
}
.chk input { width: 20px; height: 20px; margin: 0; flex: none; accent-color: var(--o); }
.chk svg { width: 18px; height: 18px; flex: none; color: var(--muted); }
.chk span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chk.off { opacity: .55; }
@media (max-width: 359px) {
  .chk { font-size: 13px; padding: 0 10px; gap: 8px; }
  .chk svg { display: none; }
}
.setup-foot { flex: none; width: 100%; max-width: 520px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.setup-foot .primary { width: 100%; }
.primary:disabled { opacity: .35; }
.warn { color: var(--x); font-weight: 700; font-size: 13px; min-height: 16px; }
.turn .who { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 48vw; }
.notice { align-self: center; flex: none; background: var(--text); color: var(--bg); font-weight: 800; font-size: 14px; padding: 6px 14px; border-radius: 999px; animation: pop .15s; }
.wrow.cur.shake { animation: shake .4s; }

.g-candy { width: var(--g); display: flex; flex-direction: column; gap: 10px; }
.cchip { height: 30px; border-radius: 10px; background: var(--panel); display: flex; align-items: center; gap: 8px; padding: 0 12px; font-weight: 800; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.ctrack { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.cs { aspect-ratio: 1; border-radius: 10px; position: relative; display: flex; align-items: center; justify-content: center; container-type: size; }
.cs.red { background: var(--cr); } .cs.yellow { background: var(--cy); } .cs.green { background: var(--cg); } .cs.blue { background: var(--cb); }
.cs span { position: absolute; top: 3px; left: 6px; font-weight: 800; font-size: 11px; color: rgba(0, 0, 0, .45); }
.toks { display: flex; gap: 2px; }
.tok {
  flex: none; width: 22px; height: 22px; width: 42cqw; height: 42cqw; border-radius: 50%; display: grid; place-items: center;
  font-weight: 900; font-size: 12px; font-size: 24cqw; line-height: 1; color: #fff; border: 2px solid rgba(0, 0, 0, .6);
}
.cchip .tok { width: 22px; height: 22px; font-size: 12px; }
b.tok { color: #fff; }
.tok.X { background: var(--x); }
.tok.O { background: var(--o); }
.tok.moved { animation: pop .3s 1.1s both; }
.tok.ghost { animation: vanish .3s 1.1s both; }
.wheelwrap { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.pointer { width: 0; height: 0; border-left: 9px solid transparent; border-right: 9px solid transparent; border-top: 14px solid var(--text); }
.wheel {
  width: min(120px, calc(var(--g) * .3)); aspect-ratio: 1; border-radius: 50%; border: 4px solid var(--text);
  background: conic-gradient(var(--cr) 0 90deg, var(--cy) 90deg 180deg, var(--cg) 180deg 270deg, var(--cb) 270deg 360deg);
  transform: rotate(var(--to, 0deg)); box-shadow: 0 6px 16px rgba(0, 0, 0, .4);
}
.wheel.spin { animation: spin 1.1s cubic-bezier(.15, .75, .25, 1) both; }
.wheelwrap .dielab { margin-top: 6px; }
.flash.late, .flash.late .card, .flash.late .toast { animation-delay: 1.1s; animation-fill-mode: both; }

.g-hilo { width: var(--g); display: flex; flex-direction: column; gap: 14px; }
.range { background: var(--panel); border-radius: 16px; padding: 14px; text-align: center; }
.range small { display: block; color: var(--muted); font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
.range b { font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; }
.range span { color: var(--muted); font-weight: 700; margin: 0 10px; }
.hist { color: var(--muted); font-weight: 600; font-size: 14px; text-align: center; min-height: 18px; }
.pad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.pad button { height: 52px; border: 0; border-radius: 12px; background: var(--panel-2); font-weight: 800; font-size: 18px; font-variant-numeric: tabular-nums; }
.pad button:disabled { opacity: .25; }
.pad button.X { box-shadow: inset 0 0 0 2px var(--x); opacity: .6; }
.pad button.O { box-shadow: inset 0 0 0 2px var(--o); opacity: .6; }

.g-dice { width: var(--g); display: flex; flex-direction: column; gap: 18px; }
.racers { display: flex; flex-direction: column; gap: 12px; background: var(--panel); border-radius: 16px; padding: 14px; }
.racer { display: grid; grid-template-columns: 30px 1fr 64px; align-items: center; gap: 10px; font-weight: 800; }
.racer .tot { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.racer .bar { height: 18px; border-radius: 999px; background: var(--panel-2); overflow: hidden; }
.racer .bar i { display: block; height: 100%; border-radius: 999px; transition: width .3s; }
.racer.X .bar i { background: var(--x); }
.racer.O .bar i { background: var(--o); }
.dieWrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.die { width: 92px; height: 92px; border-radius: 20px; background: var(--card); display: grid; place-items: center; box-shadow: 0 6px 16px rgba(0, 0, 0, .4); }
.die svg { width: 78%; height: 78%; }
.die .q { font-size: 40px; font-weight: 900; color: #8a8378; }
.dielab { color: var(--muted); font-weight: 700; }

.g-mem { width: var(--g); height: var(--g); display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 10px; }
.mc { border: 0; padding: 0; border-radius: 16px; background: var(--panel-2); display: grid; place-items: center; }
.mc.down {
  background: repeating-linear-gradient(45deg, #2a2f44 0 8px, #232737 8px 16px); box-shadow: inset 0 0 0 2px var(--line);
  color: var(--muted); font-weight: 900; font-size: calc(var(--g) * .1);
}
.mc.pick { box-shadow: inset 0 0 0 3px var(--text); }
.mc.up { background: var(--card); }
.mc.up svg { width: 60%; height: 60%; }
.mc.win { box-shadow: inset 0 0 0 4px var(--green); }

/* ---------- move result overlay ---------- */
.flash {
  position: absolute; inset: 0; z-index: 5; padding: 24px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(14, 16, 22, .6); animation: fade .15s;
}
.flash.lite { align-items: flex-end; background: transparent; padding-bottom: 28px; }
.card {
  max-width: 92%; padding: 22px 26px; text-align: center;
  background: var(--panel); border: 1px solid var(--line); border-radius: 22px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, .55); animation: pop .2s ease-out;
}
.big-g { font-size: 76px; font-weight: 900; line-height: 1; }
.big-g.X { color: var(--x); }
.big-g.O { color: var(--o); }
.big-g svg { width: 76px; height: 76px; margin: 0 auto; color: var(--muted); }
.card h2 { margin: 10px 0 6px; font-size: 22px; }
.card p { margin: 0; color: var(--muted); font-weight: 600; font-size: 15px; }
.card .row { display: flex; gap: 10px; justify-content: center; margin-top: 18px; }
.btn { height: 48px; padding: 0 18px; border: 0; border-radius: 12px; background: var(--panel-2); font-weight: 800; font-size: 15px; }
.btn.go { background: var(--text); color: var(--bg); }
.btn:active { transform: scale(.96); }
.toast {
  padding: 12px 20px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
  font-weight: 700; font-size: 15px; box-shadow: 0 10px 30px rgba(0, 0, 0, .5); animation: pop .15s ease-out;
}

/* ---------- win screen ---------- */
.win-card { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; animation: pop .25s ease-out; }
.win-card h1 { margin: 0; font-size: 30px; }
.win-card p { margin: 0; color: var(--muted); font-weight: 600; font-size: 16px; }
.final { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: min(228px, 56vw); margin: 6px 0; }
.final i {
  aspect-ratio: 1; border-radius: 10px; background: var(--panel-2);
  display: grid; place-items: center; font-weight: 900; font-size: 28px;
}
.final i.X { color: var(--x); background: var(--x-soft); }
.final i.O { color: var(--o); background: var(--o-soft); }
.final i.hl { box-shadow: inset 0 0 0 3px currentColor; }
.primary {
  height: 58px; padding: 0 30px; border: 0; border-radius: 16px;
  background: var(--text); color: var(--bg); font-weight: 800; font-size: 18px;
}
.primary:active { transform: scale(.97); }

@keyframes pop { from { transform: scale(.85); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }
@keyframes drop { from { transform: translateY(-130%); opacity: .4; } }
@keyframes zoomin { from { transform: scale(.94); opacity: 0; } }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
@keyframes vanish { to { opacity: 0; transform: scale(.4); } }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(var(--to, 0deg)); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

function randomType(rng) { return TYPES[randInt(rng, TYPES.length)]; }

function memoryDeck(rng) {

  const cards = [{ s: pick[0].s, c: pick[0].c }, { s: pick[0].s, c: pick[0].c }].concat(pick.slice(1));
  return shuffle(cards, rng);

function wordleMarks(guess, word) {

  for (let i = 0; i < 5; i++) {

  const isEnd = p === 'X' ? i => i % HEX_N === HEX_N - 1 : i => i >= HEX_N * (HEX_N - 1);

    case 'c4':          return { type, cells: new Array(C4.cols * C4.rows).fill(null), last: null };
    case 'bs':          return { type, hidden: randInt(rng, 9), revealed: new Array(9).fill(null), last: null };
    case 'wordle':      return { type, word: WORDS5[randInt(rng, WORDS5.length)].toUpperCase(), guesses: [] };
    case 'hangman':     return { type, word: WORDS_HANG[randInt(rng, WORDS_HANG.length)].toUpperCase(), letters: [] };

function findRun(cells, W, H, K, p) {

      if (path) return { ok: true, outcome: 'win', cells: path };
      if (mini.cells.every(Boolean)) return { ok: true, outcome: 'draw' };   // cannot happen in Hex; kept for safety
      return { ok: true, outcome: 'continue' };
    }
    case 'hilo': {
      if (!Number.isInteger(m) || m < mini.lo || m > mini.hi) return { ok: false, reason: 'bad' };
      if (m === mini.target) { mini.guesses.push({ by: p, n: m, res: 'hit' }); return { ok: true, outcome: 'win' }; }
      const res = m < mini.target ? 'higher' : 'lower';
      mini.guesses.push({ by: p, n: m, res });
      if (res === 'higher') mini.lo = m + 1; else mini.hi = m - 1;
      return { ok: true, outcome: 'continue', note: res };
    }
    case 'dice': {
      const roll = 1 + randInt(rng || Math.random, 6);
      mini.totals[p] += roll; mini.last = { by: p, roll };
      if (mini.totals[p] >= DICE_GOAL) return { ok: true, outcome: 'win' };
      return { ok: true, outcome: 'continue', note: 'roll' };
    }
    case 'memory': {
      if (!Array.isArray(m) || m.length !== 2) return { ok: false, reason: 'bad' };
      const [a, b] = m;
      if (![a, b].every(k => Number.isInteger(k) && k >= 0 && k < 9) || a === b) return { ok: false, reason: 'bad' };
      mini.flips += 1; mini.last = { by: p, a, b };
      const ca = mini.cards[a], cb = mini.cards[b];
      if (ca.s === cb.s && ca.c === cb.c) return { ok: true, outcome: 'win', cells: [a, b] };
      return { ok: true, outcome: 'continue', note: 'nomatch' };
    }
    case 'candy': {
      const color = CANDY.colors[randInt(rng || Math.random, CANDY.colors.length)];
      const from = mini.pos[p];
      let to = CANDY.len;                                    // the finish, unless a space of that colour is ahead
      for (let i = from + 1; i < CANDY.len; i++) if (mini.track[i] === color) { to = i; break; }
      mini.pos[p] = to; mini.last = { by: p, color, from, to };
      if (to === CANDY.len) return { ok: true, outcome: 'win' };
      return { ok: true, outcome: 'continue', note: 'spin' };
    }
  }
  return { ok: false, reason: 'bad' };
}

// Main-board result: three claimed squares in a row, else majority once all nine are claimed.
function mainResult(squares) {
  for (const line of LINES) {
    const o = squares[line[0]].owner;
    if (o && o === squares[line[1]].owner && o === squares[line[2]].owner) return { winner: o, line, reason: 'line' };
  }
  if (squares.every(s => s.owner)) {
    const x = squares.filter(s => s.owner === 'X').length, o = 9 - x;
    return { winner: x > o ? 'X' : 'O', line: null, reason: 'majority', counts: { X: x, O: o } };
  }
  return null;
}

// A full turn: the player to move makes move m in square i. On success state.flash
// describes the result; the UI shows it, then calls endFlash. The turn passes unless
// the mini-game grants the same player another move at once (flash.kind === 'again').
// A square where neither player has a legal move resets like a draw, and a player with
// no legal move anywhere on the board is skipped (flash.pass) so the match never freezes.
function playMove(state, i, m, rng) {
  rng = rng || Math.random;
  if (state.winner) return { ok: false, reason: 'over' };
  if (state.flash) return { ok: false, reason: 'busy' };
  if (state.lock != null && state.lock !== i) return { ok: false, reason: 'locked' };
  const sq = state.squares[i];
  if (!sq) return { ok: false, reason: 'bad' };
  if (sq.owner) return { ok: false, reason: 'claimed' };
  const p = state.turn;
  const res = applyMove(sq.mini, p, m, rng);
  if (!res.ok) return res;
  const mini = sq.mini;
  let outcome = res.outcome, note = res.note || null;
  if (outcome === 'continue' && !canMove(mini, 'X') && !canMove(mini, 'O')) { outcome = 'draw'; note = 'stuck'; }
  const flash = {
    kind: outcome === 'win' ? 'claim' : outcome === 'draw' ? 'draw' : res.again ? 'again' : 'move',
    by: p, next: res.again ? p : other(p), square: i, type: mini.type, note, pass: null,
  };
  switch (mini.type) {
    case 'wordle': flash.word = m.toUpperCase(); break;
    case 'hangman': flash.letter = m.toUpperCase(); break;
    case 'hilo': flash.n = m; break;
    case 'dice': flash.roll = mini.last.roll; flash.total = mini.totals[p]; break;
    case 'memory': flash.reveal = [m[0], m[1]]; break;
    case 'candy': flash.color = mini.last.color; flash.from = mini.last.from; flash.to = mini.last.to; break;
  }
  if (outcome === 'win') {
    const w = res.winner || p;                   // a mini-game may hand the square to the other player
    sq.owner = w;
    mini.winCells = res.cells || null;
    flash.winner = w; flash.counts = res.counts || null;
    const mr = mainResult(state.squares);
    if (mr) {
      state.winner = mr.winner; state.winLine = mr.line; state.winReason = mr.reason; state.counts = mr.counts || null;
      flash.kind = 'match';
    }
  } else if (outcome === 'draw') {
    flash.drawn = mini;                          // keep the full board for the result overlay
    flash.counts = res.counts || null;
    const pool = state.games && state.games.length ? state.games : TYPES;
    sq.mini = newMini(pickType(pool, rng), rng); // the square resets with a new random mini-game from this match's list
    flash.newType = sq.mini.type;
  }
  if (res.again) {
    state.lock = i;
  } else {
    state.lock = null; state.turn = other(p);
    if (!state.winner && !anyMove(state, state.turn) && anyMove(state, p)) { flash.pass = state.turn; state.turn = p; }
    flash.next = state.turn;
  }
  state.draft = ''; state.pick = null;
  state.moves += 1; state.lastSquare = i; state.lastBy = p;
  state.flash = flash;
  return { ok: true, flash };
}

// Clear the result overlay: back to the board, the win screen, or (bonus move) the same mini-game.
function endFlash(state) {
  if (!state.flash) return false;
  const again = state.flash.kind === 'again';
  state.flash = null;
  if (state.winner) { state.screen = 'win'; state.zoom = null; }
  else if (again) { state.screen = 'mini'; state.zoom = state.lock; }
  else { state.screen = 'board'; state.zoom = null; }
  return true;
}
</script>

function dieFace(n) {
  const P = { 1: [[12, 12]], 2: [[6.5, 6.5], [17.5, 17.5]], 3: [[6.5, 6.5], [12, 12], [17.5, 17.5]], 4: [[6.5, 6.5], [17.5, 6.5], [6.5, 17.5], [17.5, 17.5]],

}
const mv = x => `data-m='${JSON.stringify(x)}'`;

function render() {
  app.innerHTML = renderHeader() + renderMain();

  if (wl) wl.scrollTop = wl.scrollHeight;

}
function renderMain() {
  if (state.screen === 'setup') return renderSetup();

function renderHeader() {

/* ----- setup screen ----- */
function renderSetup() {

/* ----- main board ----- */
function renderBoard() {
  const sqs = state.squares.map((sq, i) => {
    const cls = ['sq'];
    if (sq.owner) cls.push('own-' + sq.owner);
    else if (i === state.lastSquare && state.lastBy) cls.push('last-' + state.lastBy);
    const info = INFO[sq.mini.type];

    const body = `<div class="lab">${ICONS[sq.mini.type]}<span>${info.name}</span></div><div class="thumb">${thumb(sq.mini, !!sq.owner)}</div>`
      + (sq.owner ? `<div class="own-ov" aria-hidden="true">${sq.owner}</div>` : '');
    const label = sq.owner ? `Square ${i + 1}: ${info.name}, won by ${N(sq.owner)}. Tap to view` : `Square ${i + 1}: ${info.name}`;
    return `<button class="${cls.join(' ')}" data-act="zoom" data-i="${i}" aria-label="${label}">${body}</button>`;
  }).join('');
  const hint = state.moves ? 'Tap any open square to make a move' : `${N(state.turn)} goes first. Tap a square to play`;
  const confirm = state.confirm === 'new'
    ? `<div class="flash"><div class="card"><h2>Start a new match?</h2><p>The current match will be lost.</p>
        <div class="row"><button class="btn" data-act="cancel">Keep playing</button><button class="btn go" data-act="confirm-new">New match</button></div></div></div>`
    : '';
  return `<main class="scr board-scr"><div class="board">${sqs}</div>
    <div class="foot"><span class="hint">${hint}</span><button class="link" data-act="new">New match</button></div>${confirm}</main>`;
}
// Miniatures: public information only. Hidden words, numbers, cards and the ship never appear here,
// except that a claimed Memory square shows the pair that won it.
function thumb(mini, final) {
  switch (mini.type) {
    case 'ttt': return `<div class="tg g3">${mini.cells.map(c => `<i class="${c || ''}">${c || ''}</i>`).join('')}</div>`;
    case 'c4':  return `<div class="tg g5">${mini.cells.map(c => `<i class="${c || ''}"></i>`).join('')}</div>`;
    case 'bs':  return `<div class="tg g3 sea">${mini.revealed.map(r => `<i class="${r ? 'miss' : ''}"></i>`).join('')}</div>`;
    case 'wordle': {
      const last = mini.guesses.slice(-4);
      const rows = last.length
        ? last.map(g => `<div class="twr">${g.word.split('').map((ch, k) => `<i class="${g.marks[k]}">${ch}</i>`).join('')}</div>`).join('')
        : `<div class="twr">${'<i></i>'.repeat(5)}</div><div class="twr">${'<i></i>'.repeat(5)}</div>`;
      const more = mini.guesses.length - last.length;
      return `<div class="tw">${rows}${more > 0 ? `<small>+${more} earlier</small>` : ''}</div>`;
    }
    case 'hangman': {
      const got = new Set(mini.letters.filter(x => x.hit).map(x => x.l));
      const wrong = mini.letters.length - got.size;
      return `<div class="thg"><div class="hw" style="--n:${mini.word.length}">${mini.word.split('').map(ch => `<i class="${got.has(ch) ? 'on' : ''}">${got.has(ch) ? ch : ''}</i>`).join('')}</div><small>${wrong} wrong</small></div>`;
    }
    case 'hex': return `<div class="thex">${[0, 1, 2, 3].map(r => `<div class="hr" style="--k:${r}">${[0, 1, 2, 3].map(c => `<i class="${mini.cells[r * HEX_N + c] || ''}"></i>`).join('')}</div>`).join('')}</div>`;
    case 'hilo': return `<div class="thilo"><b>${mini.lo}–${mini.hi}</b><small>${mini.guesses.length} guess${mini.guesses.length === 1 ? '' : 'es'}</small></div>`;
    case 'dice': return `<div class="tdice">${['X', 'O'].map(p => `<div class="tr ${p}"><b class="${p}">${p}</b><div class="bar"><i style="width:${Math.min(100, mini.totals[p] / DICE_GOAL * 100)}%"></i></div><span>${mini.totals[p]}</span></div>`).join('')}</div>`;
    case 'memory': {
      const shown = final && mini.winCells ? mini.winCells : [];
      return `<div class="tg g3 tmem">${mini.cards.map((card, i) => (shown.includes(i) ? `<i class="up">${shapeSvg(card)}</i>` : '<i>?</i>')).join('')}</div>`;
    }
    case 'candy': {
      const tk = i => ['X', 'O'].filter(p => mini.pos[p] === i).map(p => `<b class="${p}">${p}</b>`).join('');

}
// QWERTY keyboard. With `extra` the keys type into the Wordle draft; without it each key is a Hangman move.
function keyboard(cls, disabled, extra) {

  ).join('')}${ri === 2 && extra ? `<button class="key wide" data-act="bksp" aria-label="Backspace"${extra.bksp ? ' disabled' : ''}>${BKSP}</button>` : ''}</div>`).join('')}</div>`;
}

/* ----- zoomed mini-game ----- */
function renderMini(sq) {
  const f = state.flash;
  const mini = f && f.drawn ? f.drawn : sq.mini;   // after a draw, keep showing the full board under the overlay
  const info = INFO[mini.type];
  const view = !!sq.owner && !f;                    // a claimed square: final state, read-only, secrets revealed
  const locked = !!f || view;                       // no input while the result is showing, or when just looking
  const anim = f ? (Number.isInteger(mini.last) ? mini.last : mini.last && Number.isInteger(mini.last.cell) ? mini.last.cell : null) : null;
  const won = i => !!(mini.winCells && mini.winCells.includes(i));
  const turn = state.turn;
  let g = '';
  switch (mini.type) {
    case 'ttt':
      g = `<div class="g-ttt">${mini.cells.map((c, i) =>
        `<button class="cell ${c || ''}${won(i) ? ' win' : ''}${anim === i ? ' pop' : ''}" data-act="move" ${mv(i)} aria-label="Cell ${i + 1}${c ? ', ' + c : ''}"${c || locked ? ' disabled' : ''}>${c || ''}</button>`
      ).join('')}</div>`;
      break;
    case 'c4':
      g = `<div class="g-c4">${mini.cells.map((c, i) => {
        const col = i % C4.cols, full = !!mini.cells[col];
        return `<button class="c4c ${c || ''}${won(i) ? ' win' : ''}${anim === i ? ' drop' : ''}" data-act="move" ${mv(col)} aria-label="Drop in column ${col + 1}"${full || locked ? ' disabled' : ''}></button>`;
      }).join('')}</div>`;
      break;
    case 'bs':
      g = `<div class="g-bs">${mini.revealed.map((r, i) => {
        const hit = (r || view) && i === mini.hidden;
        const cls = hit ? ' hit ' + (r || sq.owner) : r ? ' miss' : '';
        return `<button class="cell sea${cls}${anim === i ? ' pop' : ''}" data-act="move" ${mv(i)} aria-label="Cell ${i + 1}${hit ? ', hit' : r ? ', miss' : ''}"${r || locked ? ' disabled' : ''}>${hit ? BOAT : ''}</button>`;
      }).join('')}</div>`;
      break;
    case 'wordle': {
      const rows = mini.guesses.map(gs => `<div class="wrow">${gs.word.split('').map((ch, k) => `<i class="wt ${gs.marks[k]}">${ch}</i>`).join('')}</div>`).join('');
      const d = state.draft || '';
      const cur = Array.from({ length: 5 }, (_, k) => `<i class="wt${d[k] ? ' typed' : ''}">${d[k] || ''}</i>`).join('');
      const rank = { x: 1, y: 2, g: 3 }, best = {};
      for (const gs of mini.guesses) gs.word.split('').forEach((ch, k) => { if ((rank[gs.marks[k]] || 0) > (rank[best[ch]] || 0)) best[ch] = gs.marks[k]; });
      g = `<div class="g-wordle"><div class="wlist" id="wlist">${rows || '<div class="empty">No guesses yet. Type a 5-letter word.</div>'}</div>
        ${state.notice ? `<div class="notice" role="alert">${esc(state.notice)}</div>` : ''}
        ${view ? '' : `<div class="wrow cur${state.notice ? ' shake' : ''}" aria-label="Your guess">${cur}</div>`}
        ${keyboard(k => best[k] || '', () => locked || d.length >= 5, { enter: locked || d.length !== 5, bksp: locked || !d.length })}</div>`;
      break;
    }
    case 'hangman': {
      const got = {};
      for (const x of mini.letters) got[x.l] = x.hit ? 'hit' : 'miss';
      const tiles = mini.word.split('').map(ch => `<i class="ht${got[ch] || view ? ' on' : ''}">${got[ch] || view ? ch : ''}</i>`).join('');
      const wrong = mini.letters.filter(x => !x.hit).map(x => x.l).join(' ');
      g = `<div class="g-hang"><div class="hword">${tiles}</div>
        <div class="hmiss">${wrong ? `Wrong: <b>${wrong}</b>` : 'No wrong letters yet'}</div>
        ${keyboard(k => got[k] || '', k => locked || !!got[k])}</div>`;
      break;
    }
    case 'hex': {
      const rows = [0, 1, 2, 3].map(r => `<div class="hrow" style="--r:${r}">${[0, 1, 2, 3].map(c => {
        const i = r * HEX_N + c, v = mini.cells[i];
        return `<button class="hexc ${v || ''}${won(i) ? ' win' : ''}${anim === i ? ' pop' : ''}" data-act="move" ${mv(i)} aria-label="Row ${r + 1} cell ${c + 1}${v ? ', ' + v : ''}"${v || locked ? ' disabled' : ''}></button>`;
      }).join('')}</div>`).join('');
      g = `<div class="g-hex"><div class="hexgoal O">O</div><div class="hexmid"><div class="hexgoal X">X</div><div class="hexboard">${rows}</div><div class="hexgoal X">X</div></div><div class="hexgoal O">O</div></div>`;
      break;
    }
    case 'hilo': {
      const by = {};
      for (const x of mini.guesses) by[x.n] = x.by;
      const hist = mini.guesses.slice(-3).map(x => `<b class="${x.by}">${N(x.by)}</b> ${x.n}: ${x.res === 'hit' ? 'yes!' : x.res}`).join(' · ');
      const first = !mini.guesses.length;
      g = `<div class="g-hilo"><div class="range"><small>${first ? 'A number from' : 'It is between'}</small><b>${mini.lo}</b><span>${first ? 'to' : 'and'}</span><b>${mini.hi}</b></div>
        <div class="hist">${hist || 'No guesses yet'}</div>
        <div class="pad">${Array.from({ length: HILO.hi }, (_, k) => k + 1).map(n =>
          `<button class="${by[n] || ''}" data-act="move" ${mv(n)}${n < mini.lo || n > mini.hi || locked ? ' disabled' : ''}>${n}</button>`
        ).join('')}</div></div>`;
      break;
    }
    case 'dice': {
      const racer = p => `<div class="racer ${p}"><b class="${p}">${p}</b><div class="bar"><i style="width:${Math.min(100, mini.totals[p] / DICE_GOAL * 100)}%"></i></div><span class="tot">${mini.totals[p]} / ${DICE_GOAL}</span></div>`;
      g = `<div class="g-dice"><div class="racers">${racer('X')}${racer('O')}</div>
        <div class="dieWrap"><div class="die${f ? ' pop' : ''}">${mini.last ? dieFace(mini.last.roll) : '<span class="q">?</span>'}</div>
          <div class="dielab">${mini.last ? `<b class="${mini.last.by}">${N(mini.last.by)}</b> rolled ${mini.last.roll}` : 'No rolls yet'}</div></div>
        <button class="big ${turn}" data-act="move" ${mv(1)}${locked ? ' disabled' : ''}>Roll for ${N(turn)}</button></div>`;
      break;
    }
    case 'memory': {
      const up = new Set();
      if (state.pick != null && !f) up.add(state.pick);
      if (f && f.reveal) f.reveal.forEach(k => up.add(k));
      if (view) mini.cards.forEach((_, k) => up.add(k));      // the whole deck, once the square is won
      g = `<div class="g-mem">${mini.cards.map((card, i) => {
        const isUp = up.has(i);
        return `<button class="mc ${isUp ? 'up' : 'down'}${state.pick === i && !f ? ' pick' : ''}${won(i) ? ' win' : ''}${f && isUp ? ' pop' : ''}" data-act="pick" data-i="${i}" aria-label="Card ${i + 1}${isUp ? ', face up' : ''}"${locked ? ' disabled' : ''}>${isUp ? shapeSvg(card) : '?'}</button>`;
      }).join('')}</div>`;
      break;
    }
    case 'candy': {
      const at = i => {
        let s = '';
        for (const p of ['X', 'O']) {
          const moving = f && f.type === 'candy' && f.by === p;
          if (mini.pos[p] === i) s += `<b class="tok ${p}${moving ? ' moved' : ''}">${p}</b>`;
          else if (moving && f.from === i) s += `<b class="tok ${p} ghost">${p}</b>`;
        }
        return s ? `<span class="toks">${s}</span>` : '';
      };
      const k = mini.last ? CANDY.colors.indexOf(mini.last.color) : -1;
      const angle = k < 0 ? 0 : 360 - (k * 90 + 45);        // puts that colour under the pointer
      const spinning = !!(f && f.type === 'candy');
      g = `<div class="g-candy"><div class="cchip">Start ${at(-1)}</div>
        <div class="ctrack">${CANDY_ORDER.map(i => `<div class="cs ${mini.track[i]}"><span>${i + 1}</span>${at(i)}</div>`).join('')}</div>
        <div class="cchip">Finish ${at(CANDY.len)}</div>
        <div class="wheelwrap"><div class="pointer"></div><div class="wheel${spinning ? ' spin' : ''}" style="--to:${(spinning ? 1080 : 0) + angle}deg" aria-hidden="true"></div>
          <div class="dielab">${mini.last ? `<b class="${mini.last.by}">${N(mini.last.by)}</b> spun ${mini.last.color}` : 'No spins yet'}</div></div>
        <button class="big ${turn}" data-act="move" ${mv(1)}${locked ? ' disabled' : ''}>Spin for ${N(turn)}</button></div>`;
      break;
    }
  }
  const lock = state.lock != null;
  let sub = lock ? `<b class="${turn}">${N(turn)}</b> guessed right: go again` : info.hint;
  if (view) {
    const secret = mini.type === 'wordle' || mini.type === 'hangman' ? `The word was ${mini.word}`
      : mini.type === 'hilo' ? `The number was ${mini.target}`
      : mini.type === 'bs' ? `The ship was at row ${Math.floor(mini.hidden / 3) + 1}, column ${mini.hidden % 3 + 1}`
      : mini.type === 'memory' ? 'Every card shown' : '';
    sub = `<b class="${sq.owner}">Won by ${N(sq.owner)}</b>${secret ? ' · ' + secret : ''}`;
  }
  return `<main class="scr mini">
    <div class="bar${view ? ' won won-' + sq.owner : ''}" role="${view ? 'status' : 'presentation'}"><button class="back" data-act="back" aria-label="Back to the board"${f || lock ? ' disabled' : ''}>${CHEV}Board</button>
      <div class="ttl"><b>${info.name}</b><small${view ? ' class="won"' : ''}>${sub}</small></div></div>
    <div class="gwrap">${g}</div>${f ? renderFlash(f) : ''}</main>`;
}
function renderFlash(f) {
  const next = f.pass
    ? `<b class="${f.pass}">${N(f.pass)}</b> has no move · <b class="${f.next}">${N(f.next)}</b> again`
    : `<b class="${f.next}">${N(f.next)}</b>'s turn`;
  const who = `<b class="${f.by}">${N(f.by)}</b>`;
  const name = INFO[f.type].name;
  const late = f.type === 'candy' ? ' late' : '';                  // let the wheel finish spinning first
  if (f.kind === 'match') {
    const w = state.winner;
    return `<div class="flash${late}" data-act="dismiss"><div class="card"><div class="big-g ${w}">${w}</div><h2>${N(w)} wins the match!</h2><p>Tap to continue</p></div></div>`;
  }
  if (f.kind === 'claim') {
    const w = f.winner || f.by;
    return `<div class="flash${late}" data-act="dismiss"><div class="card"><div class="big-g ${w}">${w}</div><h2>${N(w)} wins ${name}!</h2><p>Square claimed · ${next}</p></div></div>`;
  }
  if (f.kind === 'draw') {
    const [head, why] = f.note === 'stuck' ? ['Stuck!', 'No legal moves for either player'] : ['Draw!', 'Full board'];
    return `<div class="flash" data-act="dismiss"><div class="card"><div class="big-g">${RESET}</div><h2>${head}</h2><p>${why} · Square reset to ${INFO[f.newType].name} · ${next}</p></div></div>`;
  }
  if (f.kind === 'again') return `<div class="flash lite" data-act="dismiss"><div class="toast">${who} found ${f.letter} · guess again</div></div>`;
  let msg;
  switch (f.type) {
    case 'bs': msg = `Miss! · ${next}`; break;
    case 'wordle': msg = `${who} tried ${f.word} · ${next}`; break;
    case 'hangman': msg = `No ${f.letter} · ${next}`; break;
    case 'hilo': msg = `${f.n}? ${f.note === 'higher' ? 'Higher' : 'Lower'}! · ${next}`; break;
    case 'dice': msg = `${who} rolled ${f.roll} · ${f.total} total · ${next}`; break;
    case 'memory': msg = `No match · ${next}`; break;
    case 'candy': msg = `${who} spun ${f.color} · ${next}`; break;
    default: msg = `${who} placed · ${next}`;
  }
  const skip = f.type === 'memory' ? '' : ' data-act="dismiss"';   // the two cards stay up for the full 2 seconds
  return `<div class="flash lite${late}"${skip}><div class="toast">${msg}</div></div>`;
}

/* ----- win screen ----- */
function renderWin() {
  const w = state.winner;
  const why = state.winReason === 'line'
    ? 'Three squares in a row'
    : `Most squares: ${state.counts[w]} to ${state.counts[other(w)]}`;
  const final = state.squares.map((s, i) =>
    `<i class="${s.owner || ''}${state.winLine && state.winLine.includes(i) ? ' hl' : ''}">${s.owner || ''}</i>`
  ).join('');
  return `<main class="scr win-scr"><div class="win-card">
    <div class="big-g ${w}">${w}</div><h1>${N(w)} wins the match!</h1><p>${why}</p>
    <div class="final" aria-hidden="true">${final}</div>
    <button class="primary" data-act="new">New match</button></div></main>`;
}

/* ----- input ----- */
app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const act = el.dataset.act;
  if (act === 'dismiss') { dismissFlash(); return; }
  if (state.flash) return;                      // everything else waits for the result to clear
  if (act === 'zoom') {                        // open squares to play, claimed squares to look
    const i = Number(el.dataset.i);
    if (state.winner || !state.squares[i]) return;
    if (state.lock != null && state.lock !== i) return;
    state.screen = 'mini'; state.zoom = i; state.draft = ''; state.pick = null; state.notice = null; commit();
  } else if (act === 'back') {
    if (state.lock != null) return;             // a bonus guess has to be taken here
    state.screen = 'board'; state.zoom = null; state.draft = ''; state.pick = null; state.notice = null; commit();
  } else if (act === 'move') {
    if (playMove(state, state.zoom, JSON.parse(el.dataset.m)).ok) commit();
  } else if (act === 'key') {
    typeLetter(el.dataset.k);
  } else if (act === 'bksp') {
    backspace();
  } else if (act === 'enter') {
    submitWord();
  } else if (act === 'pick') {
    const i = Number(el.dataset.i);
    if (state.pick == null) state.pick = i;
    else if (state.pick === i) state.pick = null;
    else if (!playMove(state, state.zoom, [state.pick, i]).ok) state.pick = null;
    commit();
  } else if (act === 'new') {
    if (state.winner || state.moves === 0) { state.screen = 'setup'; state.confirm = null; commit(); }
    else { state.confirm = 'new'; commit(); }
  } else if (act === 'confirm-new') {
    state.screen = 'setup'; state.confirm = null; commit();
  } else if (act === 'cancel') {
    state.confirm = null; commit();
  } else if (act === 'start') {
    if (startMatch(state)) commit();
  }
});
// Setup screen: names are saved as they are typed (no re-render, so the field keeps focus);
// ticking a game re-renders the list.
app.addEventListener('input', e => {
  const el = e.target;
  if (el.matches && el.matches('input[data-p]') && state.setup) { state.setup.names[el.dataset.p] = el.value; save(); }
});
app.addEventListener('change', e => {
  const el = e.target;
  if (el.matches && el.matches('input[data-t]') && state.setup) { state.setup.games[el.dataset.t] = el.checked; commit(); }
});
function zoomedType() {
  if (state.screen !== 'mini' || state.zoom == null || state.flash || state.winner) return null;
  const sq = state.squares[state.zoom];
  return sq && !sq.owner ? sq.mini.type : null;
}
function typeLetter(k) {
  if (zoomedType() !== 'wordle' || (state.draft || '').length >= 5) return;
  state.draft = (state.draft || '') + k; commit();
}
function backspace() {
  if (zoomedType() !== 'wordle' || !(state.draft || '').length) return;
  state.draft = state.draft.slice(0, -1); commit();
}
function submitWord() {
  if (zoomedType() !== 'wordle' || (state.draft || '').length !== 5) return;
  const r = playMove(state, state.zoom, state.draft);
  if (r.ok) { commit(); return; }
  if (r.reason === 'notword') {                 // the guess stays typed and the turn is still theirs
    state.notice = 'Not a word'; commit();
    clearTimeout(noticeTimer);
    noticeTimer = setTimeout(() => { state.notice = null; commit(); }, 1200);
  }
}
// Physical keyboard, for desktops: Wordle typing and Hangman letters.
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target && e.target.tagName === 'INPUT') return;   // typing a name
  const type = zoomedType();
  if (!type) return;
  if (/^[a-zA-Z]$/.test(e.key)) {
    if (type === 'wordle') typeLetter(e.key.toUpperCase());
    else if (type === 'hangman' && playMove(state, state.zoom, e.key.toUpperCase()).ok) commit();
  } else if (e.key === 'Backspace') backspace();
  else if (e.key === 'Enter') submitWord();
});
document.addEventListener('contextmenu', e => e.preventDefault());

function commit() { save(); render(); }
function armFlash() {
  if (!state.flash || flashTimer) return;
  const f = state.flash;
  let ms = f.type === 'memory' && f.kind === 'move' ? MEMORY_MS : (FLASH_MS[f.kind] || 800);
  if (f.type === 'candy') ms += SPIN_MS;           // the wheel spins first
  flashTimer = setTimeout(dismissFlash, ms);
}
function dismissFlash() {
  clearTimeout(flashTimer); flashTimer = null;
  if (endFlash(state)) commit();
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* no storage: just play without resume */ }
}
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && s.v === 4 && Array.isArray(s.squares) && s.squares.length === 9 && (s.turn === 'X' || s.turn === 'O') && s.setup) {
      if (s.lock != null && !s.winner) { s.screen = 'mini'; s.zoom = s.lock; }
      s.notice = null;
      return s;
    }
  } catch (e) { /* ignore corrupt saves */ }
  return null;
}

render();
</script>
</body>
</html>
