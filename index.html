      <div class="kind" role="group" aria-label="Player 2"><button class="seg${isCpu ? '' : ' on'}" data-act="kind" data-kind="human" aria-pressed="${!isCpu}">Human</button><button class="seg${isCpu ? ' on' : ''}" data-act="kind" data-kind="cpu" aria-pressed="${isCpu}">Computer</button></div>
      <label class="field ${s2 || ''}">${isCpu ? `<i class="slot-ico" aria-hidden="true">${CPU_ICON}</i>` : ''}<span>Player 2 name</span><input data-ln="n2" value="${esc(L.n2)}" maxlength="${NAME_MAX}" placeholder="${isCpu ? CPU_NAME : s2 || 'X or O'}" autocomplete="off" autocapitalize="words" aria-label="Player 2 name"></label></div>`;
  };
  return `<main class="scr setup">
    <div class="bar">${host ? `<button class="back" data-act="lobby-back" aria-label="Close the room and go back">${CHEV}Back</button>` : `<button class="back" data-act="menu" aria-label="Back to the main menu">${CHEV}Menu</button>`}
      <div class="ttl"><b>${title}</b>${sub ? `<small>${sub}</small>` : ''}</div></div>
    <div class="setup-box" data-keep-scroll="setup">
    ${room}
    ${host ? `<div class="names">${field('X')}${field('O')}</div>` : `<div class="slots">${slots()}</div>`}
    ${host ? sides : ''}
    ${timer}
    <div class="adv${advOpen ? ' open' : ''}"><button class="adv-h" data-act="adv" aria-expanded="${advOpen}"><span>Advanced</span><small>${on} of ${VT.length} mini-games on</small><i class="chev">${CHEV}</i></button>
      ${advOpen ? `<div class="games-top"><button class="btn selall" data-act="games-none"${on === 0 ? ' disabled' : ''}>Deselect all</button><button class="btn selall" data-act="games-all"${on === VT.length ? ' disabled' : ''}>Select all</button></div><div class="games">${VT.map(chk).join('')}</div>` : ''}</div>
  </div>
  <div class="setup-foot"><button class="primary" data-act="start"${ready ? '' : ' disabled'}>Start match</button><small class="warn">${setupWarn(s)}</small></div></main>`;
}
// Start opens once at least one mini-game is on (online, also once the friend is in).
const onGames = s => enabledGames(s).filter(t => visibleTypes().includes(t));   // the games on, among those this player may see
function setupReady(s) { const on = onGames(s).length; return isHost() ? !!(on && state.online.joined && connected) : !!on; }
function setupWarn(s) { return !onGames(s).length ? 'Select at least one mini-game to start' : isHost() && !setupReady(s) ? 'Start opens once your friend has joined' : ''; }
// Ticking a mini-game (or Select all) changes the screen in place, with no re-render, so the list
// stays exactly where it was scrolled and Advanced stays open. The choice is saved for the next match.
function setGames(change) {
  const s = state.setup;
  change(s.games);
  save();
  const VT = visibleTypes(), on = onGames(s).length;
  for (const box of app.querySelectorAll('input[data-t]')) {
    const v = !!s.games[box.dataset.t];
    box.checked = v;
    box.closest('.chk').classList.toggle('off', !v);
  }
  const n = app.querySelector('.adv-h small'); if (n) n.textContent = `${on} of ${VT.length} mini-games on`;
  const all = app.querySelector('[data-act="games-all"]'); if (all) all.disabled = on === VT.length;
  const none = app.querySelector('[data-act="games-none"]'); if (none) none.disabled = on === 0;
  const start = app.querySelector('[data-act="start"]'); if (start) start.disabled = !setupReady(s);
  const warn = app.querySelector('.setup-foot .warn'); if (warn) warn.textContent = setupWarn(s);
  dbSetup({ games: restrictGames(Object.assign({}, s.games), VT) });   // (the room never holds a game its host may not deal)
}

/* ----- main board ----- */
// The squares as they ended, every secret included (online, the unclaimed squares' secrets come from the room).
function reviewSquares() {
  if (isMM() && room && room.pub && room.pub.final) { try { return JSON.parse(room.pub.final).squares; } catch (e) { /* not yet: the public board */ } }   // a server game: its final state, everything revealed
  if (state.online && !isMM() && room && room.match) { const rec = parseMatch(room.match); if (rec) return fullState(rec).squares; }
  return state.squares;
}
const STAMP_MS = 1500;                    // the stamp is over by then
const BOARD_BURST = [320, 500];           // when the two bursts on the board pop in, in ms after the stamp starts
function renderBoard(review) {
  const spot = review ? null : state.spot;
  // A fresh claim stamps in once, from the moment it landed on the board (stampFx). A re-render while it
  // plays carries it on from there; after that the owner's mark simply sits there. Nothing replays it.
  const stampAt = !review && state.stamp != null && state.squares[state.stamp] && state.squares[state.stamp].owner ? fxAt('stamp', state.stampId) : null;
  const el = stampAt == null ? Infinity : performance.now() - stampAt;
  const stampOn = el < STAMP_MS;
  const sqs = state.squares.map((sq, i) => {
    const cls = ['sq'];
    if (spot && spot.square === i && spot.before) sq = spot.before;     // a move about to be played back: the square as it was until then
    if (sq.owner) cls.push('own-' + sq.owner);
    else if (i === state.lastSquare && state.lastBy && !(spot && spot.square === i)) cls.push('last-' + state.lastBy);
    if (spot && spot.square === i) cls.push('spot', 'spot-' + spot.by);
    const info = INFO[sq.mini.type];
    // a claimed square keeps its label and final state, with the owner's mark laid over them
    const body = `<div class="lab${info.name.length > 14 ? ' long' : ''}">${ICONS[sq.mini.type]}<span>${info.name}</span></div><div class="thumb">${thumb(sq.mini, !!sq.owner)}</div>`
      + (sq.owner ? `<div class="own-ov${stampOn && state.stamp === i ? ' stamp' : ''}"${stampOn && state.stamp === i ? fxAttr(stampAt) : ''} aria-hidden="true">${toon(sq.owner)}<b class="sr">${sq.owner}</b></div>` : '')   // a fresh claim stamps in
      + (spot && spot.square === i ? `<div class="spot-lab ${spot.by}" role="status">${cpuPlays(spot.by) ? CPU_ICON : ''}${esc(spot.label)}</div>` : '');
    const label = sq.owner ? `Square ${i + 1}: ${info.name}, won by ${esc(playerName(state, sq.owner))}. Tap to view` : `Square ${i + 1}: ${info.name}`;
    if (review) return `<button class="${cls.join(' ')}" data-act="${reviewCtx.sq}" data-i="${i}" aria-label="${label}. Tap to see it">${body}</button>`;
    return `<button class="${cls.join(' ')}" data-act="zoom" data-i="${i}" aria-label="${label}"${spot && spot.square === i ? fxAttr(fxAt('spot', spot)) : ''}${cpuTurn() ? ' disabled' : ''}>${body}</button>`;
  }).join('');
  if (review) return `<main class="scr board-scr review-scr"><div class="revhead"><button class="back" data-act="${reviewCtx.back}" aria-label="${reviewCtx.backAria}">${CHEV}${reviewCtx.backLabel}</button>
      <div class="ttl"><b>${reviewCtx.title}</b><small>Tap any square to see how it ended</small></div></div><div class="board">${sqs}</div>
    <div class="foot"><span class="hint">Every hidden word, number, card and ship is shown</span></div>${pauseMenu()}</main>`;
  const hint = spot ? (cpuPlays(spot.by) ? CPU_ICON : '') + esc(spot.label) : cpuTurn() ? `${N(state.turn)} is thinking…` : remoteTurn() ? `Waiting for ${N(state.turn)}…`
    : state.moves ? 'Tap any open square to make a move' : `${N(state.turn)}: tap a square to start`;
  const st = el < BOARD_BURST[1] + BURST_MS ? state.stamp : null;    // a fresh claim: two bursts around it, gone after about a second
  const bw = st == null ? null : burstPick('board:' + state.stampId), bend = k => Math.round(stampAt + BOARD_BURST[k] + BURST_MS);
  const pow = st == null ? '' : `<div class="pow-b c${st % 3}" style="grid-row:${Math.floor(st / 3) + 1} / span 1;grid-column:${st % 3 + 1} / span 1"${fxAttr(stampAt)} aria-hidden="true">${el < BOARD_BURST[0] + BURST_MS ? `<span class="b1" data-bend="${bend(0)}">${burstSvg(bw.words[0], 'y', 150, 110, 34)}</span>` : ''}<span class="b2" data-bend="${bend(1)}">${burstSvg(bw.words[1], 'r', 160, 104, 28)}</span></div>`;
  return `<main class="scr board-scr">${netBar()}<div class="board">${sqs}${pow}</div>
    <div class="foot"><span class="hint">${hint}</span></div>${pauseMenu()}</main>`;
}
// Miniatures: public information only. Hidden words, numbers, cards and the ship never appear here,
// except that a claimed Memory square shows the pair that won it.
function thumb(mini, final) {
  switch (mini.type) {
    case 'ttt': return `<div class="tg g3">${mini.cells.map(c => `<i class="${c || ''}">${c ? toonT(c) : ''}</i>`).join('')}</div>`;
    case 'c4':  return `<div class="tg g5">${mini.cells.map(c => `<i class="${c || ''}"></i>`).join('')}</div>`;
    case 'mastermind': {
      const last = mini.guesses.slice(-4), more = mini.guesses.length - last.length;
      const rows = last.length ? last.map(g => `<div class="tmr">${g.code.map(c => `<i class="c${c}"></i>`).join('')}${mmMarks(g, 'tiny')}</div>`).join('')
        : `<div class="tmr">${'<i></i>'.repeat(4)}</div><div class="tmr">${'<i></i>'.repeat(4)}</div>`;
      return `<div class="tmm">${rows}${more > 0 ? `<small>+${more} earlier</small>` : ''}</div>`;
    }
    case 'hexapawn': return `<div class="tg thp">${mini.cells.map((c, i) => `<i class="${c || ''}${(Math.floor(i / HP.cols) + i) % 2 ? ' dk' : ''}">${c ? toonT(c) : ''}</i>`).join('')}</div>`;
    case 'bs': {
      const sunk = mini.winCells || [], hits = mini.hits || [], len = mini.len || 1;
      const parts = Array.from({ length: len }, (_, k) => `<g transform="translate(${k * 100} 0)">${SHIP_PART[shipPart(len, k)].replace('class="hull"', `class="hull${k < hits.length ? ' hit' : ''}"`)}</g>`).join('');
      return `<div class="tbs"><div class="tg g4 sea">${mini.revealed.map((r, i) => `<i class="${sunk.includes(i) ? 'ship ' + (r || '') : hits.includes(i) ? 'hit' : r ? 'miss' : ''}"></i>`).join('')}</div>
        <div class="tship" aria-label="${BS.names[len]}, ${len} part${len === 1 ? '' : 's'}"><svg viewBox="0 20 ${len * 100} 60" aria-hidden="true">${parts}</svg><b>${BS.names[len]}</b></div></div>`;
    }
    case 'wordle': {
      const last = mini.guesses.slice(-4);
      const rows = last.length
        ? last.map(g => `<div class="twr">${g.word.split('').map((ch, k) => `<i class="${g.marks[k]}">${ch}</i>`).join('')}</div>`).join('')
        : `<div class="twr">${'<i></i>'.repeat(5)}</div><div class="twr">${'<i></i>'.repeat(5)}</div>`;
      const more = mini.guesses.length - last.length;
      return `<div class="tw">${rows}${more > 0 ? `<small>+${more} earlier</small>` : ''}</div>`;
    }
    case 'hangman': {
      const got = new Set(mini.letters.filter(x => x.hit).map(x => x.l));
      const wrong = mini.letters.filter(x => !x.hit).map(x => x.l);   // the wrong letters themselves, crossed out as in the full view
      return `<div class="thg"><div class="hw" style="--n:${mini.word.length}">${mini.word.split('').map(ch => `<i class="${got.has(ch) ? 'on' : ''}">${got.has(ch) ? ch : ''}</i>`).join('')}</div>${wrong.length ? `<div class="hmx${wrong.length > 16 ? ' many' : wrong.length > 10 ? ' mid' : ''}" aria-label="Wrong letters: ${wrong.join(', ')}">${wrong.map(l => `<i>${l}</i>`).join('')}</div>` : ''}</div>`;
    }
    case 'hex': return `<div class="thex">${[0, 1, 2, 3].map(r => `<div class="hr" style="--k:${r}">${[0, 1, 2, 3].map(c => `<i class="${mini.cells[r * HEX_N + c] || ''}"></i>`).join('')}</div>`).join('')}</div>`;
    case 'hilo': return `<div class="thilo"><b>${mini.lo}–${mini.hi}</b><small>${mini.guesses.length} guess${mini.guesses.length === 1 ? '' : 'es'}</small></div>`;
    case 'dice': return trackSvg(DICE_SPEC, { tokens: { X: diceSlot(mini.totals.X), O: diceSlot(mini.totals.O) }, finish: 'flag', mini: true });
    case 'memory': {
      const shown = final && mini.winCells ? mini.winCells : [];
      return `<div class="tg g3 tmem">${mini.cards.map((card, i) => (shown.includes(i) ? `<i class="up">${shapeSvg(card)}</i>` : '<i>?</i>')).join('')}</div>`;
    }
    case 'candy': return trackSvg(CANDY_SPEC, { colors: mini.track, tokens: { X: mini.pos.X, O: mini.pos.O }, finish: 'colours', mini: true });
    case 'snakes': return trackSvg(SNL_SPEC, { tokens: { X: mini.pos.X - 1, O: mini.pos.O - 1 }, finish: 'none', goal: true, mini: true, cls: 'snl', overlay: snlArt(SNL_SPEC, mini, true) });
    case 'bump': return trackSvg(BUMP_SPEC, { tokens: { X: mini.pos.X - 1, O: mini.pos.O - 1 }, finish: 'flag', mini: true });
    case 'coins': return `<div class="tcoin">${mini.coins.map(c => `<i class="${c === COINS.mystery ? 'm' : c}">${c}</i>`).join('')}</div>`;
    case 'bj': return `<div class="tpip">${['X', 'O'].map(p => `<div class="tr ${p}"><b class="${p}">${p}</b>${Array.from({ length: BJ.goal }, (_, k) => `<i class="${k < mini.wins[p] ? 'on' : ''}"></i>`).join('')}</div>`).join('')}</div>`;
    case 'bus': return `<div class="tpip">${['X', 'O'].map(p => `<div class="tr bus ${p}"><b class="${p}">${p}</b>${Array.from({ length: BUS.rounds }, (_, k) => `<i class="${k < mini.prog[p].length ? 'on' : ''}"></i>`).join('')}</div>`).join('')}</div>`;
    case 'rl': {                                               // the hits so far, and the recent spins: every one, a hit in the spinner's colour, a miss plain
      const spins = (mini.spins || []).map(x => (typeof x === 'number' ? { n: x, hit: false } : x)).filter(x => x && Number.isInteger(x.n));
      const chip = x => `<i class="sp ${x.n === 0 ? 'g' : rlRed(x.n) ? 'r' : 'b'}${x.hit ? ' hit ' + (x.by || '') : ''}" title="${x.n}${x.hit ? ': a hit' : ''}">${x.n}</i>`;
      return `<div class="tpip">${['X', 'O'].map(p => `<div class="tr ${p}"><b class="${p}">${p}</b>${Array.from({ length: RL.goal }, (_, k) => `<i class="${k < mini.hits[p] ? 'on' : ''}"></i>`).join('')}</div>`).join('')}${spins.length ? `<div class="tspins" aria-label="Recent spins: ${spins.map(x => x.n + (x.hit ? ' (hit)' : '')).join(', ')}">${spins.map(chip).join('')}</div>` : ''}</div>`;
    }
    case 'bullseye': return bullsThumb(mini);
    case 'echo': return `<div class="tpip">${['X', 'O'].map(p => `<div class="tr ${p}"><b class="${p}">${p}</b>${ECHO.lengths.map((_, k) => `<i class="sq${k < mini.level[p] ? ' on' : ''}"></i>`).join('')}</div>`).join('')}</div>`;
    case 'plinko': { const pts = mini.pts || { X: 0, O: 0 }, tg = mini.target || PLINKO_DEFAULTS.target; return `<div class="tplk" aria-label="Plinko: X ${pts.X}, O ${pts.O} of ${tg} points"><div class="tbins">${(mini.vals || []).map((v, b) => `<i class="${v === 5 ? 'top' : ''}${mini.last && mini.last.bin === b ? ' ' + mini.last.by : ''}">${v}</i>`).join('')}</div><div class="tbpts">${['X', 'O'].map(p => `<div class="tr ${p}"><b class="${p}">${p}</b><span>${Math.min(tg, pts[p])}</span><small>/${tg}</small></div>`).join('')}</div></div>`; }
    case 'pong': return `<div class="tpip">${['X', 'O'].map(p => `<div class="tr ${p}"><b class="${p}">${p}</b>${mini.cups[p].map(up => `<i class="${up ? 'on' : ''}"></i>`).join('')}</div>`).join('')}</div>`;
    case 'trivia': return `<div class="tpip">${['X', 'O'].map(p => `<div class="tr ${p}"><b class="${p}">${p}</b>${Array.from({ length: TRIVIA.goal }, (_, k) => `<i class="${k < mini.right[p] ? 'on' : ''}"></i>`).join('')}</div>`).join('')}</div>`;
    case 'headcount': case 'flash': case 'snapshot': return `<div class="tpip">${['X', 'O'].map(p => `<div class="tr ${p}"><b class="${p}">${p}</b>${Array.from({ length: ATT.goal }, (_, k) => `<i class="${k < mini.right[p] ? 'on' : ''}"></i>`).join('')}</div>`).join('')}</div>`;   // both players' progress: ●●○
    case 'skyhop': case 'scoop': return `<div class="trun" aria-label="X at ${fingAt(mini, 'X')}, O at ${fingAt(mini, 'O')} of ${mini.cfg.target}">${['X', 'O'].map(p => `<div class="tr ${p}"><b class="${p}">${p}</b><i style="--w:${(100 * Math.min(1, fingAt(mini, p) / mini.cfg.target)).toFixed(1)}%"></i></div>`).join('')}</div>`;   // both players' progress: the height climbed, the scoops stacked
    case 'pinball': return `<div class="tpip t7" aria-label="X has lit ${fingAt(mini, 'X')}, O ${fingAt(mini, 'O')} of ${mini.lit.X.length}">${['X', 'O'].map(p => `<div class="tr ${p}"><b class="${p}">${p}</b>${mini.lit[p].map(on => `<i class="${on ? 'on' : ''}"></i>`).join('')}</div>`).join('')}</div>`;   // each player's lit targets out of the seven
    case 'oddone': return `<div class="tpip">${['X', 'O'].map(p => `<div class="tr ${p}"><b class="${p}">${p}</b>${Array.from({ length: ODD.goal }, (_, k) => `<i class="${k < mini.finds[p] ? 'on' : ''}"></i>`).join('')}</div>`).join('')}</div>`;
    case 'golf': case 'pool': case 'bowling': return physThumb(mini);
    case 'craps': { const d = mini.last ? mini.last.roll || (mini.last.rolls || [])[(mini.last.rolls || []).length - 1] : null; return `<div class="tpip">${['X', 'O'].map(p => `<div class="tr ${p}"><b class="${p}">${p}</b>${Array.from({ length: CRAPS.goal }, (_, k) => `<i class="${k < mini.wins[p] ? 'on' : ''}"></i>`).join('')}</div>`).join('')}${d ? `<div class="tcdice ${mini.last.result === 'win' ? 'w' : mini.last.result === 'lose' ? 'l' : ''}"><span>${dieFace(d[0])}</span><span>${dieFace(d[1])}</span></div>` : ''}</div>`; }
    case 'takeover': return `<div class="tg gtk">${mini.cells.map(c => `<i class="${c || ''}"></i>`).join('')}</div>`;
    case 'seating': return `<div class="tseat">${Array.from({ length: SEAT.tables }, (_, t) => { const l = mini.who[2 * t], r = mini.who[2 * t + 1], own = l && l === r && l !== 'Z' ? ' own ' + l : ''; return `<span class="${own}">${[2 * t, 2 * t + 1].map(i => `<i class="${mini.who[i] || ''}" style="--sc:${SEAT_COL[mini.color[i]]}"></i>`).join('')}</span>`; }).join('')}</div>`;
    case 'districts': { const t = distTally(mini.map, mini.who); return `<svg class="tdist" viewBox="-2 -2 104 124" aria-hidden="true">${mini.map.regions.map((poly, r) => `<path class="dreg${t.lead[r] ? ' ' + t.lead[r] : ''}" d="${distPath(poly)}"/>`).join('')}${mini.map.spots.map((sp, k) => `<circle class="${mini.who[k] || ''}" cx="${sp.x}" cy="${sp.y}" r="4.6"/>`).join('')}</svg>`; }
    case 'shelves': return `<div class="tshelf">${Array.from({ length: SHELF.n }, (_, r) => `<span>${mini.cells.slice(r * SHELF.per, r * SHELF.per + SHELF.per).map(w => `<i class="${w || ''}"></i>`).join('')}</span>`).join('')}</div>`;
    case 'roads': return `<svg class="troad" viewBox="0 0 100 100" aria-hidden="true">${mini.segs.map((w, k) => { const [p, q] = ROAD_SEGS[k].map(ROAD_PT); return `<line class="${w || ''}" x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}"/>`; }).join('')}</svg>`;
    case 'patterns': { const pz = mini.puz || (mini.last ? { seq: mini.last.seq } : null); return `<div class="tpat">${['X', 'O'].map(p => `<div class="tr ${p}"><b class="${p}">${p}</b>${Array.from({ length: PATTERNS.goal }, (_, k) => `<i class="${k < mini.right[p] ? 'on' : ''}"></i>`).join('')}</div>`).join('')}${pz ? `<div class="tseq">${pz.seq.map(it => (it ? `<span>${patSvg(it)}</span>` : '<span class="q">?</span>')).join('')}</div>` : ''}</div>`; }   // the right answers so far, and the puzzle open now
    case 'wheels': return `<div class="trun" aria-label="X has ${mini.pts.X}, O has ${mini.pts.O} of ${mini.target}">${['X', 'O'].map(p => `<div class="tr ${p}"><b class="${p}">${p}</b><i style="--w:${(100 * Math.min(1, mini.pts[p] / mini.target)).toFixed(1)}%"></i></div>`).join('')}</div>`;   // both players' points to the target
    case 'sniff': { const [x, y] = sniffXY(mini.dog); return `<svg class="tsniff" viewBox="0 0 100 100" aria-hidden="true">${Array.from({ length: SNIFF.n * SNIFF.n }, (_, c) => { const [cx, cy] = sniffXY(c); return `<rect x="${cx - 9}" y="${cy - 9}" width="18" height="18" rx="3"/>`; }).join('')}<circle class="tdog" cx="${x}" cy="${y}" r="7"/></svg>`; }   // the field and the dog: nothing of the past
    case 'flood': return `<div class="tg gfl">${mini.colors.map((c, i) => `<i class="${mini.owner[i] === 'X' || mini.owner[i] === 'O' ? 'own ' + mini.owner[i] : ''}" style="background:${FLOOD_COL[c]}"></i>`).join('')}</div>`;
    case 'dash': case 'lane': case 'flap': case 'chopper': return `<div class="trun" aria-label="X at ${Math.round(mini.dist.X)} m, O at ${Math.round(mini.dist.O)} m of ${mini.cfg.target}">${['X', 'O'].map(p => `<div class="tr ${p}"><b class="${p}">${p}</b><i style="--w:${(100 * Math.min(1, mini.dist[p] / mini.cfg.target)).toFixed(1)}%"></i></div>`).join('')}</div>`;   // both players' progress to the target
    case 'pig': return `<div class="tdice">${['X', 'O'].map(p => `<div class="tr ${p}"><b class="${p}">${p}</b><div class="bar"><i style="width:${Math.min(100, mini.bank[p] / RISKY.goal * 100)}%"></i></div><span>${mini.bank[p]}</span></div>`).join('')}</div>`;
    case 'hunt': return `<div class="tg g5x5" style="--hn:${huntSize(mini)}">${mini.dug.map((d, i) => {
      if (!d) return '<i></i>';
      const k = clueAt(mini, i), b = BAND[k] || BAND[4];
      return `<i style="background:${b.bg};color:${b.fg}">${k ? '' : GEM}</i>`;
    }).join('')}</div>`;
  }

    if (state.online !== o) return;                               // went back meanwhile: nothing to show
    if (!r || !r.players) { setNet('error', `No game with the code ${o.code} is open. Check the code with the host.`); commit(); return; }
    if (!resume && Number(r.created) < Date.now() - 24 * 3600 * 1000) { setNet('error', `The game ${o.code} has expired. Ask the host for a new code.`); commit(); return; }

    } else {

      if (r.status !== 'lobby') { setNet('error', 'That match has already started without you.'); commit(); return; }
      const nm = String(o.name || (resume && r.players[free] && r.players[free].name) || '').trim().slice(0, NAME_MAX) || 'Friend';
      await m.set(m.ref(db, `rooms/${o.code}/players/${free}`), { uid, name: nm, joined: m.serverTimestamp() });   // the rules let only an empty seat be taken
      o.me = free;

  if (r.left && r.left.side !== o.me) { menuNote = `${String(r.left.name || other(o.me)).slice(0, NAME_MAX)} left the match`; leaveRoom(true); return; }

  if (!acct.user || !acct.ready) return;
  if (loggedIn()) flushLocal();                                 // local matches still waiting to be recorded
  if (!acct.profile || !acct.profile.username) { if (state.screen === 'login') { state.screen = 'username'; unameMsg = null; loginFinishing = false; save(); } return; }
  if (state.screen !== 'login' && state.screen !== 'username') return;
  loginFinishing = false;
  const go = afterLogin; afterLogin = null;
  if (go === 'profile') { openProfile(acct.user.uid, 'menu'); return; }
  if (go === 'host') { hostRoom(null, false); return; }       // logged in on the way to hosting: the room opens at once
  state.screen = go === 'find' ? 'find' : 'menu';
  save();
  if (go === 'find') startSearch();             // logged in on the way to Find Match: searching at once
}
// The server made a game for this player while searching: straight into it.
function onActive() {

}
// Find Match, a profile, hosting a friend game: these need an account (and a username). Otherwise the login screen.
async function needAccount(next) {
  afterLogin = next;
  if (loggedIn()) return true;
  loginMsg = null;
  state.screen = acct.user && acct.ready ? 'username' : 'login';
  commit();
  if (!(await connectQuiet())) { loginMsg = { text: 'No connection. Check your internet and try again.' }; render(); }
  else if (loggedIn()) { afterAccount(); return false; }
  return false;
}
function authError(e) {
  const c = String((e && e.code) || '');
  if (/popup-closed|cancelled-popup/.test(c)) return null;
  if (/popup-blocked/.test(c)) return { text: 'Your browser blocked the sign-in window. Allow pop-ups for this site and try again.' };
  if (/invalid-email/.test(c)) return { text: "That email address doesn't look right." };
  if (/user-not-found|wrong-password|invalid-credential|invalid-login/.test(c)) return { text: 'Wrong email or password.' };
  if (/email-already-in-use/.test(c)) return { text: 'There is already an account with that email: log in instead.' };
  if (/weak-password/.test(c)) return { text: 'Use a password of at least 6 characters.' };
  if (/missing-password/.test(c)) return { text: 'Enter a password.' };
  if (/too-many-requests/.test(c)) return { text: 'Too many tries. Wait a minute, then try again.' };
  if (/network/.test(c)) return { text: 'No connection. Check your internet and try again.' };
  if (/account-exists-with-different-credential/.test(c)) return { text: 'That email already has an account with another way of logging in.' };
  return { text: "Couldn't log in. Try again." };
}
async function loginWith(how) {
  if (loginBusy) return;
  const mailEl = document.getElementById('lemail'), passEl = document.getElementById('lpass');
  if (mailEl) loginMail = mailEl.value.trim();
  if (passEl) loginPass = passEl.value;
  if (how !== 'google') {
    if (!loginMail) { loginMsg = { text: 'Enter your email address.' }; render(); return; }
    if (!loginPass) { loginMsg = { text: 'Enter a password.' }; render(); return; }
  }
  loginBusy = true; loginMsg = null; render();
  try {
    if (!(await connectQuiet())) throw { code: 'auth/network-request-failed' };
    const A = fb.authM;
    const popup = (window.TTT_FIREBASE && window.TTT_FIREBASE.popup) || A.signInWithPopup;   // (the tests: Google through the emulator, without its popup page)
    if (how === 'google') {
      try { await popup(fb.auth, new A.GoogleAuthProvider()); }
      catch (e) {
        if (!/popup-blocked|operation-not-supported|web-storage-unsupported/.test(String(e && e.code))) throw e;
        loginPending(afterLogin || 'menu');                     // no sign-in window here: the whole page goes to Google and comes back
        save();
        await ((window.TTT_FIREBASE && window.TTT_FIREBASE.redirect) || A.signInWithRedirect)(fb.auth, new A.GoogleAuthProvider());   // (the tests: the emulator's sign-in, then a reload)
        return;
      }
      onAuthUser(fb.auth.currentUser);                          // signed in: on to the username or the menu, without waiting for the event
    }
    else if (how === 'create') await A.createUserWithEmailAndPassword(fb.auth, loginMail, loginPass);
    else await A.signInWithEmailAndPassword(fb.auth, loginMail, loginPass);
    loginPass = '';
  } catch (e) { loginMsg = authError(e); }

}
async function loginReset() {

  loginBusy = true; render();
  const sent = { ok: true, text: `If there is an account for ${loginMail}, an email with a link to reset the password is on its way.` };
  try {
    if (!(await connectQuiet())) throw { code: 'auth/network-request-failed' };
    await fb.authM.sendPasswordResetEmail(fb.auth, loginMail);
    loginMsg = sent;
  } catch (e) { loginMsg = /invalid-email|network|too-many/.test(String(e && e.code)) ? authError(e) : sent; }   // (never says whether an account exists)
  loginBusy = false; render();
}
async function saveUsername() {
  const el = document.getElementById('uname');
  unameDraft = el ? el.value.trim() : unameDraft;
  if (!/^[A-Za-z0-9_]{3,16}$/.test(unameDraft)) { unameMsg = '3 to 16 letters, numbers or underscores.'; render(); return; }
  loginBusy = true; unameMsg = null; render();

    const r = await call('claimUsername', { username: unameDraft });

}
async function logout() {
  stopSearch();
  if (fb && fb.auth) await fb.authM.signOut(fb.auth).catch(() => {});
  rememberAccount(false);
  loginFinishing = false; loginPending(null);
  acct = { user: null, profile: null, active: null, ready: true };
  prof = null; state.screen = 'menu'; commit();

/* ----- Find Match: a queue on the server; the phone checks in every few seconds while it waits ----- */
async function openFind() {
  if (acct.active && acct.active.game && !(isMM() && state.online.game === acct.active.game)) { enterGame(acct.active.game, acct.active.side); return; }   // back to the match in progress
  if (!findOn) { state.screen = 'online'; commit(); return; }   // switched off: the greyed button on Play Online
  if (!(await needAccount('find'))) return;
  search.msg = ''; search.found = false;
  state.screen = 'find'; commit();
  startSearch();                                // straight into searching: nothing to choose
}
function startSearch() {
  if (search.on || !loggedIn()) return;
  search.on = true; search.found = false; search.since = Date.now(); search.msg = '';   // (the searching screen is silent: only "found" sounds, when the match starts)
  render();
  searchTick();
}
async function searchTick() {
  clearTimeout(searchTimer); searchTimer = null;
  if (!search.on) return;
  if (!searchBusy) {
    searchBusy = true;
    try {
      const r = await call('findMatch', {});                     // one queue, 1 minute a turn
      searchBusy = false;
      if (search.on && r.status === 'matched') { enterGame(r.game, r.side); return; }
      search.msg = '';
    } catch (e) {
      searchBusy = false;
      if (e && e.details && e.details.off) { stopSearch(); setFindOn(false); state.screen = 'online'; commit(); return; }   // switched off: already out of the queue
      search.msg = e && /precondition|invalid-argument|unauthenticated/.test(String(e.code)) ? String(e.message) : 'Connection trouble: still trying…';
    }
  }
  if (search.on) { render(); searchTimer = setTimeout(searchTick, 3000); }
}
async function cancelSearch() {
  if (!search.on) return;
  stopSearch();
  state.screen = 'online'; commit();            // back to Play Online
  try { const r = await call('cancelSearch', {}); if (r.status === 'matched') enterGame(r.game, r.side); }   // paired just before Cancel: the game is on
  catch (e) { /* a searcher who stops checking in is dropped from the queue anyway */ }
}
function stopSearch() { search.on = false; clearTimeout(searchTimer); searchTimer = null; }
function findAgain() {                          // the results screen: another game
  if (!findOn) return;
  leaveRoom(true);
  state.screen = 'find'; commit();
  startSearch();
}

/* ----- a matchmaking game: the public game read live, moves sent to the server ----- */
function enterGame(id, side) {
  if (search.on || search.found) SND.play('found');
  stopSearch();
  if (isMM() && state.online.game === id) return;
  if (state.online) stopListening();
  clearTimeout(spotTimer); spotTimer = null; clearTimeout(flashTimer); flashTimer = null; clearTimeout(holdTimer); holdTimer = null;
  clearTimeout(moveTimer); moveWait = null; presentingSeq = null; awayNote = '';
  state.stats = null;                         // an online match: never recorded as a local one
  state.online = { kind: 'mm', game: id, me: side, joined: true, shownSeq: null, matchId: null };
  state.setup.mode = 'online'; state.cpu = null; menuOpen = false; menuStep = 'main';
  state.flash = null; state.done = null; state.spot = null; state.lock = null; state.zoom = null;
  search.found = true;
  state.screen = 'find';                          // "Match found", until the game arrives
  setNet('connecting', 'Loading the match…');
  commit();
  listenGame(id);
  presenceUp();
}
function listenGame(id) {
  stopListening();
  roomUnsub = fb.m.onValue(fb.m.ref(fb.db, `games/${id}/pub`), s => onGameValue(s.val()), () => { setNet('error', 'Lost access to this match.'); commit(); });
  presUnsub = fb.m.onValue(fb.m.ref(fb.db, `gpresence/${id}`), s => { presence = s.val(); noteNet(); if (state.online) render(); });
  listenReacts(id);
}
function onGameValue(pub) {
  const o = state.online;
  if (!o || o.kind !== 'mm' || !fb) return;
  if (!pub || !pub.players) { menuNote = 'That match is over.'; leaveRoom(true); return; }
  room = { kind: 'mm', status: 'playing', players: pub.players, match: { state: pub.state }, setup: { timer: pub.timer }, pub };
  for (const s of ['X', 'O']) state.setup.names[s] = String(pub.players[s].name || s);
  state.setup.timer = pub.timer;
  o.mode = pub.mode; o.queue = pub.queue;
  if (net.status !== 'connected') setNet('connected', '');
  if (state.screen === 'find') {
    state.screen = 'board'; search.found = false;
    let st0 = null; try { st0 = JSON.parse(pub.state); } catch (e) { /* shown as it comes */ }
    if (st0 && !st0.seq && !st0.moves && !st0.winner) showIntro(pub);   // a fresh game: who plays whom first
  }
  if (presenting()) { pendingRoom = room; return; }
  applyMatch(room);
}
// The players' intro: both usernames with their records, about 3 seconds (or until tapped), then the
// board. The server starts the first turn's clock late enough for it.
let mmIntro = null, introTimer = null;
const INTRO_MS = 3000;
function showIntro(pub) {
  mmIntro = { players: pub.players, me: state.online.me };
  clearTimeout(introTimer); introTimer = setTimeout(closeIntro, INTRO_MS);
}
function closeIntro() {
  clearTimeout(introTimer); introTimer = null;
  if (!mmIntro) return;
  mmIntro = null;
  const el = app.querySelector('.vsintro'); if (el) el.remove();
}
function renderIntro() {
  if (!mmIntro || !isMM() || state.screen !== 'board') return '';
  const side = s => { const p = mmIntro.players[s] || {}; return `<div class="vsp ${s}">${toon(s)}<b>${esc(p.name || s)}</b><small>${record(p.record)}</small>${mmIntro.me === s ? '<i>You</i>' : ''}</div>`; };
  return `<div class="vsintro" data-act="intro-close" role="dialog" aria-label="Your match"><div class="vscard">${side('X')}<div class="vsmid">VS</div>${side('O')}
    <p class="hint">${mmIntro.me === 'X' ? 'You go first' : `${esc((mmIntro.players.X || {}).name || 'X')} goes first`} · tap to start</p></div></div>`;
}
// The clock ran out on a matchmaking game: ask the server, which checks the deadline itself.
async function fireTimeoutMM(seq, deadline) {
  const key = state.online.game + ':' + seq + ':' + deadline;
  if (timeoutTry.key === key && Date.now() - timeoutTry.at < 2000) return;
  timeoutTry = { key, at: Date.now() };
  timeoutBusy = true;
  try { await call('timeout', { game: state.online.game }); } catch (e) { /* the next tick tries again */ }
  timeoutBusy = false;
}
// Leaving a matchmaking game through the menu: a resignation, which loses the match.
async function resignMM() {
  const id = state.online.game, over = !!state.winner;
  menuOpen = false; menuStep = 'main';
  if (!over) {
    moveWait = Date.now(); render();
    try { await call('resign', { game: id }); } catch (e) { /* and if not, the clock runs out for this side */ }
    moveWait = null;
    menuNote = 'You left the match: it counts as a loss.';
  }
  leaveRoom(true);
}

/* ----- the leaderboard: the top 100 by rating (players with 5+ ranked games), and your own rank ----- */
async function openLeaderboard() {
  lb = { rows: null, me: null, error: null };
  state.screen = 'leaderboard'; commit();
  if (!(await connectQuiet())) { lb.error = 'No connection. Check your internet and try again.'; render(); return; }
  try {
    const m = fb.m, top = await m.get(m.query(m.ref(fb.db, 'leaderboard'), m.orderByChild('rating'), m.limitToLast(100)));
    const rows = [];
    top.forEach(c => { rows.push(Object.assign({ uid: c.key }, c.val())); });
    rows.sort((a, b) => b.rating - a.rating || (a.username < b.username ? -1 : 1));
    rows.forEach(r => { r.rank = 1 + rows.filter(x => x.rating > r.rating).length; });   // equal ratings share a rank
    lb.rows = rows;
    const uid = acct.user && acct.user.uid;
    if (uid && !rows.some(r => r.uid === uid)) {
      const mine = (await m.get(m.ref(fb.db, 'leaderboard/' + uid))).val();
      if (mine) {
        const above = await m.get(m.query(m.ref(fb.db, 'leaderboard'), m.orderByChild('rating'), m.startAfter(mine.rating)));
        lb.me = Object.assign({ uid, rank: above.size + 1 }, mine);
      } else lb.me = { uid, unlisted: true, games: acct.profile ? acct.profile.games : 0 };
    }
  } catch (e) { lb.error = "Couldn't load the leaderboard. Try again."; }
  render();
}

/* ----- profiles and game history ----- */
async function openProfile(uid, back) {
  if (!uid) { if (!(await needAccount('profile'))) return; uid = acct.user.uid; }
  if (prof && prof.uid === uid && prof.user && state.screen === 'profhist') { state.screen = 'profile'; render(); return; }   // back from its game history
  prof = { uid, user: null, hist: null, local: null, view: prof && prof.uid === uid ? prof.view : 'online', back: back || (NAV_SCREENS.includes(state.screen) ? state.screen : state.screen === 'win' ? 'win' : 'menu'), error: null };
  state.screen = 'profile'; commit();
  if (!(await connectQuiet())) { prof.error = 'No connection. Check your internet and try again.'; render(); return; }
  try {
    const m = fb.m;
    const own = acct.user && uid === acct.user.uid;
    const last50 = node => m.get(m.query(m.ref(fb.db, `${node}/${uid}`), m.orderByChild('date'), m.limitToLast(50)));
    const [u, h, ls, lh] = await Promise.all([m.get(m.ref(fb.db, 'users/' + uid)), last50('history'),
      own ? m.get(m.ref(fb.db, 'localStats/' + uid)).catch(() => null) : null, own ? last50('localHistory').catch(() => null) : null]);   // local games: your own, private
    if (!prof || prof.uid !== uid) return;
    prof.user = u.val();
    prof.local = ls ? ls.val() || {} : null;
    if (!prof.user) prof.error = 'This player has no profile.';
    const list = [];
    h.forEach(c => { list.push(Object.assign({ id: c.key }, c.val())); });
    if (lh) lh.forEach(c => { list.push(Object.assign({ id: c.key }, c.val())); });
    prof.hist = list.sort((a, b) => b.date - a.date).slice(0, 80);  // newest first
  } catch (e) { if (prof) prof.error = "Couldn't load this profile. Try again."; }
  render();
}
function profileBack() {
  const back = prof && prof.back;
  if (back === 'win' && state.winner) state.screen = 'win';
  else if (back === 'leaderboard' && RATINGS_ENABLED) state.screen = 'leaderboard';

// A past game on the read-only review board: the final state with everything revealed.
function openHistory(id) {
  const e = prof && prof.hist && prof.hist.find(x => x.id === id);
  if (!e) return;
  let f;
  try { f = JSON.parse(e.final); } catch (err) { return; }
  const v = newState(RNG);
  Object.assign(v, { squares: f.squares, winner: f.winner || null, winLine: f.winLine || null, winReason: f.winReason || null, counts: f.counts || null, resigned: f.resigned || null, games: f.games || TYPES.slice(), moves: f.moves || 0, screen: 'review' });
  v.setup.names = Object.assign({ X: 'X', O: 'O' }, f.names || {});
  v.squares.forEach(sq => upgradeMini(sq.mini));
  hist = { entry: e, view: v, zoom: null };
  state.screen = 'hreview'; render();
}
// Render with another state in place of the live one (a past game), and put the live one back.
function withView(v, fn) { const live = state; state = v; try { return fn(); } finally { state = live; } }
const REVIEW_LIVE = { back: 'results', backLabel: 'Results', backAria: 'Back to the results', sq: 'review-sq', mback: 'review-back', title: 'Final board' };
const REVIEW_HIST = { back: 'hist-close', backLabel: 'Games', backAria: 'Back to the game history', sq: 'hist-sq', mback: 'hist-back', title: 'Final board' };
let reviewCtx = REVIEW_LIVE;
function renderHistory() {

  const mini = state.screen === 'hreview-mini' && hist.zoom != null;      // (read before the past game takes the place of the live state)
  reviewCtx = REVIEW_HIST;

const fmtDate = t => { try { return new Date(t).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }); } catch (e) { return ''; } };
const HOW_TEXT = { line: 'three in a row', majority: 'most squares', timeout: 'timeout', resign: 'resignation', draw: 'no line left' };
const MODE_TEXT = RATINGS_ENABLED ? { ranked: 'Ranked', casual: 'Casual', match: 'Find Match', friend: 'Unrated', local: 'Local' } : { ranked: 'Find Match', casual: 'Find Match', match: 'Find Match', friend: 'Friend', local: 'Local' };

const winPct = u => { const g = (u && ((u.wins || 0) + (u.losses || 0) + (u.draws || 0))) || 0; return g ? Math.round(100 * (u.wins || 0) / g) + '%' : '–'; };   // of all games, draws included

// A profile (My Stats for your own): the Find Match record and win rate, the vs-friends record, squares won

function renderProfile() {
  const p = prof || {};

  const u = p.user;

  if (p.error) body = `<div class="warn">${esc(p.error)}</div>`;
  else if (!u) body = '<p class="hint center">Loading…</p>';
  else {
    // Your own stats: Online (Find Match and friend games together), Local, or All. Someone else's: online only.
    const view = own ? (p.view || 'online') : 'online';
    const sum = (...rs) => rs.reduce((t, r) => { r = r || {}; for (const k of ['wins', 'losses', 'draws']) t[k] += r[k] || 0; return t; }, { wins: 0, losses: 0, draws: 0 });
    const addMinis = (...ms) => { const out = {}; for (const m of ms) for (const [t, v] of Object.entries(m || {})) { const o = (out[t] = out[t] || { won: 0, lost: 0 }); o.won += (v && v.won) || 0; o.lost += (v && v.lost) || 0; } return out; };
    const loc = own ? p.local || {} : {};
    const online = sum(u, u.friend), local = sum(loc), all = sum(online, local);
    const rec = view === 'local' ? local : view === 'all' ? all : online;
    const minis = view === 'local' ? addMinis(loc.minis) : view === 'all' ? addMinis(u.minis, loc.minis) : addMinis(u.minis);
    const addSides = (...ss) => ({ X: sum(...ss.map(x => x && x.X)), O: sum(...ss.map(x => x && x.O)) });   // games played as X and as O
    const fsides = u.friend && u.friend.sides;
    const sides = view === 'local' ? addSides(loc.sides) : view === 'all' ? addSides(u.sides, fsides, loc.sides) : addSides(u.sides, fsides);
    const games = rec.wins + rec.losses + rec.draws;
    const tabs = own ? `<div class="ptabs" role="tablist" aria-label="Which games">${[['online', 'Online'], ['local', 'Local'], ['all', 'All']].map(([v, l]) => `<button class="seg${view === v ? ' on' : ''}" role="tab" aria-selected="${view === v}" data-act="pview" data-v="${v}">${l}</button>`).join('')}</div>` : '';
    const label = { online: 'Online record', local: 'Local record', all: 'All games' }[view];
    const card = `${tabs}<div class="pcard rec">${RATINGS_ENABLED ? `<div class="prt"><small>Rating</small><b>${u.rating}</b></div>` : ''}
      <div class="prec"><small>${label}</small><b>${record(rec)}</b><small>wins-losses-draws · ${games} game${games === 1 ? '' : 's'}</small></div>
      <div class="ppct"><small>Win rate</small><b>${winPct(rec)}</b></div>
      ${view === 'online' ? `<div class="pfr"><small>Find Match ${record(u)} · Friends ${record(u.friend)}</small></div>` : ''}
      <small class="pjoin">Joined ${fmtDate(u.joined)}</small></div>`;
    const sideRow = p => { const r = sides[p], g = r.wins + r.losses + r.draws; return `<tr><td><span class="pg">${toon(p)}<span>As ${p}</span></span></td><td>${g}</td><td>${record(r)}</td><td>${winPct(r)}</td></tr>`; };
    const sideTable = `<table class="ptab psides" aria-label="Games played as X and as O"><thead><tr><th>Played as</th><th>Games</th><th>W-L-D</th><th>Win rate</th></tr></thead><tbody>${sideRow('X')}${sideRow('O')}</tbody></table>`;
    // Squares count once they end claimed by X or O (a square still open when the match ended, or a board
    // reset after a draw, is not a mini-game won or lost).
    const rows = Object.entries(minis).filter(([t]) => TYPES.includes(t)).map(([t, v]) => ({ t, won: v.won, lost: v.lost }))   // the games in the pool only (not Hexapawn or the Dice race)
      .filter(r => r.won + r.lost).sort((a, b) => b.won - a.won || a.lost - b.lost || INFO[a.t].name.localeCompare(INFO[b.t].name));
    const allWon = rows.reduce((t, r) => t + r.won, 0), allLost = rows.reduce((t, r) => t + r.lost, 0);
    const rate = (w, l) => `${Math.round(100 * w / (w + l))}%`;
    const table = rows.length ? `<table class="ptab pmini"><thead><tr><th>Mini-game</th><th>Won</th><th>Lost</th><th>Win rate</th></tr></thead><tbody><tr class="pall"><td><span class="pg"><span>All mini-games</span></span></td><td>${allWon}</td><td>${allLost}</td><td>${rate(allWon, allLost)}</td></tr>${rows.map(r =>
      `<tr><td><span class="pg">${ICONS[r.t]}<span>${INFO[r.t].name}</span></span></td><td>${r.won}</td><td>${r.lost}</td><td>${rate(r.won, r.lost)}</td></tr>`).join('')}</tbody></table>`
      : `<p class="hint center">No squares won or lost ${view === 'local' ? 'in local games' : view === 'all' ? '' : 'online'} yet.</p>`;
    const nh = p.hist ? p.hist.length : null;
    const what = { online: 'online games: Find Match and friends', local: 'local games (you as player 1)', all: 'every game: online and local' }[view];
    body = `<button class="btn wide phist" data-act="prof-hist"${p.hist ? '' : ' disabled'}>Game history${nh != null ? ` (${nh})` : ''}</button>
      ${card}${sideTable}<h3 class="hh">Mini-games</h3><p class="hint">Squares won and lost in ${what}. Only squares that ended claimed count.</p>${table}`;   // the game history first, then the stats
  }
  return `<main class="scr setup acct-scr prof-scr">
    <div class="bar"><button class="back" data-act="prof-back" aria-label="Back">${CHEV}${backLabel}</button>
      <div class="ttl"><b>${own ? 'My Stats' : esc(u ? u.username : 'Profile')}</b><small>${own ? esc(u ? u.username : '') : 'Player profile'}</small></div></div>
    <div class="setup-box" data-keep-scroll="profile">${body}${own ? '<button class="link wide" data-act="logout">Log out</button>' : ''}</div></main>`;
}

app.addEventListener('click', e => {
  if (rx.tray && !e.target.closest('.rtray, [data-act="react-open"]')) { rx.tray = false; render(); }   // a tap elsewhere closes the reaction tray
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const act = el.dataset.act;
  if (act === 'explain') { e.preventDefault(); openExplain(el.dataset.t); return; }    // never a move: open over anything, even mid-turn
  if (act === 'explain-close') { closeExplain(); return; }
  if (act === 'intro-close') { closeIntro(); return; }
  if (act === 'ask-stay') { joinAsk = null; render(); scheduleCpu(); return; }
  if (act === 'ask-leave') { if (joinAsk) leaveAndJoin(joinAsk.code); return; }
  if (act === 'dismiss') { if (Date.now() >= flashReady) dismissFlash(); return; }   // not before the animation is over
  const free = ['pause', 'pause-resume', 'pause-main', 'pause-back', 'pause-leave', 'leave', 'lobby-back', 'menu', 'find-again', 'profile', 'prof-back', 'prof-hist', 'mystats', 'hist-open', 'hist-sq', 'hist-back', 'hist-close', 'leaderboard', 'rejoin', 'host-retry', 'share', 'rematch', 'timer', 'review', 'review-sq', 'review-back', 'results', 'pview', 'react-open', 'react-send'];
  if (act === 'sound') { SND.setMuted(!SND.muted); if (!SND.muted) SND.play('toggle'); render(); return; }   // (the press's own sound came with the press when it was still on)
  if (act === 'react-mute') { rx.mute = !rx.mute; if (rx.mute && rx.card && rx.card.side !== mySide()) { clearTimeout(rx.hide); rx.card = null; } render(); return; }   // this match only: the opponent's emoji stop showing and sounding
  if (act === 'pause') { menuOpen = true; menuStep = 'main'; startFx('menu', menuStep); render(); scheduleCpu(); return; }
  if (act === 'pause-resume') { menuOpen = false; menuStep = 'main'; render(); scheduleCpu(); return; }
  if (act === 'pause-main') { menuStep = 'confirm'; startFx('menu', menuStep); render(); return; }
  if (act === 'pause-back') { menuStep = 'main'; startFx('menu', menuStep); render(); return; }
  if (act === 'pause-leave') { quitMatch(); return; }
  if (menuOpen) return;                         // the menu is up: nothing underneath reacts
  if (state.flash && !free.includes(act)) return;   // everything else waits for the result to clear
  if (state.done && !free.includes(act)) return;    // the result is still on show
  if (cpuTurn() && !free.includes(act)) return;   // the computer is playing
  if (act === 'react-open') { if (!reactCooling()) { rx.tray = !rx.tray; render(); } return; }   // (before the stamp: a reaction never clears a claim's stamp)
  if (act === 'react-send') { sendReact(Number(el.dataset.i)); return; }
  state.stamp = null;                           // a claim stamps in once
  if (act === 'zoom') {                        // open squares to play, claimed squares to look
    const i = Number(el.dataset.i);
    if (state.winner || !state.squares[i]) { SND.play('error'); return; }
    if (lockMine() && state.lock !== i) { SND.play('error'); return; }
    state.screen = 'mini'; state.zoom = i; state.draft = ''; state.sel = []; state.notice = null; hpSel = null; SND.play('tap');   // (a plain tap: no whoosh into the square)
    if (!state.online) { state.pick = null; state.pickSq = null; }
    commit();
  } else if (act === 'back') {
    if (lockMine() || pinned()) return;
    if (state.done) return;
    state.screen = 'board'; state.zoom = null; state.draft = ''; state.sel = []; state.notice = null; state.stamp = null;
    if (!state.online) { state.pick = null; state.pickSq = null; }
    commit();
  } else if (act === 'mode-go') {              // the main menu: pick a mode, then set up
    state.setup.mode = 'two'; normSetup(state.setup); normLocal(state.setup); state.screen = 'setup'; advOpen = false; commit();
  } else if (act === 'kind') {                 // Play Local: player 2 is a Human or the Computer

    case 'skyhop': case 'scoop': case 'pinball': fingSounds(f, add); break;   // someone else's attempt as it replays (its bounces, catches, flips), then the result
    case 'oddone': { const pre = oddPre(f); if (pre) { add('reveal', ODD.show); if (f.odd.picked >= 0) add('tap', pre); } if (f.odd) add(f.odd.correct ? 'ding' : 'thud', pre + 250); break; }   // someone else's pick: the reveal, then their tap
    case 'dash': case 'lane': case 'flap': case 'chopper': if (f.run) {
      const rep = laneRep(f);                                     // the computer's Lane Rush run: its skids and crash first
      if (rep) { for (const st of rep.plan.steps) add('skid', Math.round((st.t * 1000) / rep.speed)); add(f.run.done ? 'sparkle' : 'crash', rep.drive); add('ding', rep.ms + RUNT.bar); }
      else { add(f.run.done ? 'sparkle' : 'thud', 0); add('ding', RUNT.bar); }
    } break;   // the crash (or the finish) as the result shows, the bar landing at its new distance
    case 'craps': {                                                   // the roll: the rattle, the dice landing; the puck going on or off; a round's result
      if (!f.craps) break;
      if (f.craps.kind === 'stop') { add('toggle', 0); break; }
      add('rattle', 0); add('thunk', 500);
      if (f.craps.result === 'point' || (f.craps.was != null && f.craps.result !== 'stay')) add('clack', 600);
      if (f.craps.result === 'win') add('ding', 700); else if (f.craps.result === 'lose') add('thud', 700);
      break;
    }
    case 'takeover': if (f.take) { add('mark', 0); [...f.take.took, ...f.take.flipped].filter(k => k !== f.take.at).slice(0, 4).forEach((k, n) => add(f.take.flipped.includes(k) ? 'flipUp' : 'pop', TAKEOVER_MS.place + n * 70)); } break;
    case 'seating': if (f.seat) { add('mark', 0); if (f.seat.table != null) add('ding', PLACE_MS.mark); if (f.seat.z != null) { add('hop', PLACE_MS.mark + 150); add('cushion', PLACE_MS.mark + PLACE_MS.walk - 120); } else if (f.seat.left) { add('hop', PLACE_MS.mark + 150); add('whoosh', PLACE_MS.mark + PLACE_MS.walk - 300); } } break;   // a customer with no seat: in, and off out the side
    case 'districts': if (f.dist) { add('marker', 0); add('flipUp', PLACE_MS.mark); if (f.dist.grey != null) add('thud', PLACE_MS.mark + PLACE_MS.drop - 150); } break;
    case 'shelves': if (f.shelf) { add('mark', 0); if (f.shelf.grey != null) add('thud', PLACE_MS.mark + PLACE_MS.drop - 150); } break;
    case 'patterns': if (f.pat) add(f.pat.correct ? 'ding' : 'thud', 250); break;   // the pick glows (and drops into the gap) or is struck through
    case 'wheels': {                                               // the wheel turns, ticking slower and slower; it stops: the points, or nothing
      add('rlSpin', 0);
      const ticks = 16;
      for (let k = 1; k <= ticks; k++) add('wheelTick', Math.round(WHEELT.spin * (1 - Math.pow(1 - k / ticks, 2.2))));
      if (f.wheel) { add(f.wheel.v ? 'ding' : 'thud', WHEELT.spin); if (f.wheel.w === 'high' && f.wheel.v) add('sparkle', WHEELT.spin + 120); }
      break;
    }
    case 'sniff': if (f.sniff) { add('hop', 0); add('hop', Math.round(SNIFF.step * 0.5)); if (f.sniff.found) { add('dig', SNIFF.step); add('sparkle', SNIFF.step + 250); } else add(f.sniff.hot ? 'higher' : 'lower', SNIFF.step); } break;   // the dog trots (its paws), then hotter or colder, or it digs up the chest
    case 'roads': if (f.road) { add('pieceSlide', 0); if (f.road.block != null) add('knock', PLACE_MS.mark + PLACE_MS.drop - 150); } break;
    case 'flood': if (f.flood) { add('splash', 0); if (!f.flood.gain) add('thud', FLOOD_MS.base); f.flood.waves.slice(0, 6).forEach((w, k) => add('pop', Math.round(FLOOD_MS.base * 0.55 + k * FLOOD_MS.wave), 1 + k * 0.06)); } break;
    case 'golf': case 'pool': case 'bowling': {                   // the recording's events, as they come round in the replay; then the result
      const ph = f.phys; if (!ph) break;
      const live = ph.rec && !REDUCED, end = live ? ph.ms : 0;
      if (live) for (const e of ph.events || []) { const t = e.t * 1000; if (e.k === 'balls') add('clack', t); else if (e.k === 'wall') add('cushion', t); else if (e.k === 'pin') add('pinHit', t); else if (e.k === 'hole') add('plop', t); else if (e.k === 'pocket') add(e.id === 'cue' ? 'thud' : 'plop', t); else if (e.k === 'lip') add('clink', t); else if (e.k === 'gutter') add('thud', t); }
      if (f.type === 'bowling') add(ph.strike ? 'strike' : ph.gutter ? 'thud' : 'ding', end);
      else if (f.type === 'pool') add(ph.black ? 'buzz' : ph.scratch ? 'thud' : ph.own && !ph.theirs ? 'ding' : 'thud', end);
      else if (!ph.first) add(ph.lip ? 'thud' : 'ding', end);
      break;
    }
    case 'pig':
      if (f.note === 'bust') { add('rattle', 0); add('thunk', 600); add('bust', 650); }
      else if (f.note === 'bank') add('bank', 350);
      else { add('rattle', 0); add('thunk', 600); add('point', 650); }
      break;
    case 'hunt': add('dig', 0); if (f.band === 0 || won) add('sparkle', 800); else add('band', 380, [0, 1100, 880, 660, 440][f.band] / 880); break;
    case 'hexapawn': add('pieceSlide', 0); if (f.capture) add('knock', 340); break;
    case 'mastermind': { const n = (f.solid || 0) + (f.hollow || 0); for (let k = 0; k < n; k++) add('marker', 450 + k * 250); if (won) add('reveal', 1450); break; }
    case 'bump': { add('spin', 0); const steps = Math.max(1, f.to - f.from); for (let k = 0; k < steps; k++) add('hop', SPIN3_MS + k * HOP_MS); if (f.bumped) add('boing', SPIN3_MS + steps * HOP_MS); break; }
  }
  const CASINO = ['bj', 'bus', 'rl', 'bullseye', 'echo', 'plinko', 'pong', 'trivia', 'oddone', 'dash', 'lane', 'golf', 'pool', 'bowling', 'craps', 'takeover', 'flood', 'seating', 'districts', 'shelves', 'roads', 'flap', 'chopper', 'patterns', 'wheels', 'sniff', 'headcount', 'flash', 'snapshot', 'skyhop', 'scoop', 'pinball'];
  if (won && f.kind !== 'match' && CASINO.includes(f.type)) add('won', total - 600);   // the card games and the wheel: the chime once the result shows
  else if (won && f.kind !== 'match' && f.type !== 'ttt' && f.type !== 'wordle' && f.type !== 'hangman') add('won', Math.round(total * .5));   // the square is won: a chime
  if (f.kind === 'draw') add('reset', 420);                          // the square resets with a new mini-game
  if (f.kind === 'match') { add('swish', total - 500); add(matchEndSound(), total); }   // the line on the board, then the end of the match
  return out;
}
// The end of the match, as this phone sees it: a win fanfare, a loss sting, or the tie chord.
function matchEndSound() { const k = endKind().list; return k === 'win' ? 'winFanfare' : k === 'loss' ? 'loss' : 'tie'; }
// The board comes back after a move: the turn passed to the other player (no whoosh out of the square).
function backSounds(from) {
  if (!state.winner && state.turn !== from.turn) SND.play('turn');
}

SND.load();                                                // renders the sounds now, in the background

boot();
</script>
