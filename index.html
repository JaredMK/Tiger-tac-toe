@keyframes pendpulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(.93); } }
@media (prefers-reduced-motion: reduce) { .pend { animation: none; opacity: .7; } }
.menu-top .btn { height: 44px; padding: 0 14px; font-size: 15px; min-width: 44px; }
.menu-top .chip { max-width: 58%; display: flex; align-items: center; gap: 8px; }
.menu-top .chip span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.menu-top .chip.in b { flex: none; background: var(--o); border: 2px solid var(--ink); border-radius: 999px; padding: 2px 8px 0; font-weight: 400; }
.acct-scr .setup-box { gap: 12px; }
.acct-scr .primary { width: 100%; }
.acct-scr .row2 { display: flex; gap: 10px; }
.acct-scr .row2 .btn { flex: 1; }
.acct-scr .hint { margin: 0; color: var(--muted); font-size: 16px; }
.acct-scr .hint.center { text-align: center; padding: 24px 0; }
.or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 15px; }
.or::before, .or::after { content: ''; flex: 1; height: 2.5px; background: var(--ink); opacity: .2; border-radius: 2px; }
.primary.google { background: var(--paper); color: var(--ink); }
.qdesc { margin: 0; font-size: 17px; }
.find-kind { display: flex; gap: 8px; }
.searching { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 28px 0 8px; text-align: center; }
.searching h2 { margin: 0; font-family: 'Luckiest Guy', sans-serif; font-weight: 400; font-size: 30px; }
.searching .spinner { display: flex; gap: 6px; }
.searching .spinner .pc { width: 56px; height: 56px; animation: hopx .8s ease-in-out infinite; }   /* one loop for both, the O half a hop behind */
.searching .spinner .pc:last-child { animation-delay: -.4s; }
@keyframes hopx { 0%, 100% { transform: translateY(0) scale(1.06, .94); } 50% { transform: translateY(-12px) scale(.95, 1.05); } }
.searching.found .big-g { display: flex; gap: 6px; }
.searching.found .big-g .pc { width: 64px; height: 64px; }
.lb, .hlist { display: flex; flex-direction: column; gap: 8px; padding-bottom: 6px; }
.lbrow, .hirow { width: 100%; min-height: 48px; display: grid; align-items: center; gap: 10px; padding: 6px 12px; text-align: left; background: #fff; color: var(--ink); border: 2.5px solid var(--ink); border-radius: 13px 9px 12px 10px; box-shadow: 0 3px 0 var(--ink); font-family: 'Patrick Hand', cursive; font-size: 17px; }
.lbrow { grid-template-columns: 50px minmax(0, 1fr) auto 62px; }
.lbrow.me { background: var(--o-soft); }
.lbrow .rk, .lbrow .rt { font-family: 'Luckiest Guy', sans-serif; font-weight: 400; padding-top: 3px; }
.lbrow .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lbrow .rc { color: var(--muted); text-align: right; font-size: 15px; }
.lbme { flex: none; width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 4px; margin: 0; padding-top: 4px; }
.lbme small { color: var(--muted); }
.pcard { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; align-items: center; padding: 14px 16px; background: #fff; border: 3px solid var(--ink); border-radius: 16px 12px 15px 11px; box-shadow: 0 4px 0 var(--ink); }
.pcard .prt { display: flex; flex-direction: column; align-items: center; }
.pcard .prt b { font-family: 'Luckiest Guy', sans-serif; font-weight: 400; font-size: 40px; line-height: 1; padding-top: 4px; }
.pcard small { color: var(--muted); font-size: 14px; }
.pcard .prec { display: flex; flex-direction: column; }
.pcard .prec b { font-family: 'Luckiest Guy', sans-serif; font-weight: 400; font-size: 24px; padding-top: 3px; }
.pcard .pjoin { grid-column: 1 / -1; }
.hh { margin: 6px 0 0; font-family: 'Luckiest Guy', sans-serif; font-weight: 400; font-size: 18px; }
.hirow { grid-template-columns: 52px minmax(0, 1fr) auto; }
.hirow .hres { font-family: 'Luckiest Guy', sans-serif; padding-top: 3px; }
.hirow.win .hres { color: var(--green); } .hirow.loss .hres { color: var(--x); }
.hirow .hvs { min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
.hirow .hvs small { color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hirow .hmeta { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.badge { font-style: normal; font-size: 13px; padding: 1px 8px; border: 2px solid var(--ink); border-radius: 999px; background: var(--paper); }
.badge.ranked { background: var(--o); } .badge.casual { background: var(--sky); }
.hchg { font-size: 13px; color: var(--muted); }
.hchg.up { color: var(--green); } .hchg.down { color: var(--x); }
.rchg { margin: 0; font-family: 'Luckiest Guy', sans-serif; font-weight: 400; font-size: 20px; }
.rchg b { font-weight: 400; font-size: 26px; }
.rchg.up b { color: var(--green); } .rchg.down b { color: var(--x); }
.rchg.wait { color: var(--muted); font-size: 16px; }
.mmres { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 0 14px; }
.rrec b { color: var(--ink); }
.win-card .vs .orec { color: var(--muted); font-size: 15px; }
/* the players' intro on a Find Match game */
.vsintro { position: fixed; inset: 0; z-index: 35; display: grid; place-items: center; padding: 20px 16px; background: rgba(22, 18, 16, .55); animation: fade .2s ease-out; cursor: pointer; }
.vscard { width: min(100%, 380px); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; padding: 18px 14px 12px; background: var(--paper); border: 4px solid var(--ink); box-shadow: 0 7px 0 var(--ink); border-radius: 26px 18px 24px 20px / 20px 26px 18px 24px; animation: pop .3s cubic-bezier(.3, 1.5, .5, 1) both; }
.vsp { min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
.vsp .pc { width: 64px; height: 64px; }
.vsp b { max-width: 100%; font-family: 'Luckiest Guy', sans-serif; font-weight: 400; font-size: 19px; padding-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vsp small { font-family: 'Luckiest Guy', sans-serif; font-size: 16px; color: var(--muted); }
.vsp i { font-style: normal; font-size: 13px; background: var(--ink); color: var(--paper); border-radius: 999px; padding: 1px 9px; }
.vsmid { font-family: 'Luckiest Guy', sans-serif; font-size: 30px; color: var(--x); text-shadow: 2px 2px 0 var(--ink); }
.vscard .hint { grid-column: 1 / -1; margin: 4px 0 0; text-align: center; }
/* My Stats and profiles */
.pcard.rec { grid-template-columns: 1fr auto; }
.pcard .ppct, .pcard .pfr { display: flex; flex-direction: column; }
.pcard .ppct { align-items: flex-end; }
.pcard .ppct b, .pcard .pfr b { font-family: 'Luckiest Guy', sans-serif; font-weight: 400; font-size: 24px; padding-top: 3px; }
.ptab { width: 100%; border-collapse: collapse; background: #fff; border: 3px solid var(--ink); border-radius: 14px; overflow: hidden; box-shadow: 0 4px 0 var(--ink); font-size: 17px; }
.ptab th, .ptab td { padding: 7px 8px; text-align: right; border-bottom: 1.5px solid var(--panel-2); white-space: nowrap; }
.ptab th:first-child, .ptab td:first-child { text-align: left; }
.ptab th { font-family: 'Luckiest Guy', sans-serif; font-weight: 400; font-size: 13px; color: var(--muted); }
.ptab tr:last-child td { border-bottom: 0; }
.ptab .pg { display: inline-flex; align-items: center; gap: 8px; }
.ptab .pg svg { width: 18px; height: 18px; flex: none; }
.ptab tr.pall td { font-weight: 700; background: var(--panel); border-bottom: 3px solid var(--ink); }   /* every mini-game together, above the rest */
.ptab.psides { margin-top: 2px; }
.btn.wide { width: 100%; }
.sides.three .seg { padding: 0 8px; line-height: 1.05; }
.sides.three .seg small { display: block; font-size: 10px; opacity: .75; }
@media (max-width: 359px) { .sides.three { gap: 6px; } .sides.three .seg { padding: 0 3px; font-size: 13px; } }   /* a small phone: Random still fits */
.win-card .vs { margin: 0; font-size: 17px; }
.win-card.mm .final { width: min(120px, 32vw); }
.win-card.mm .big-g { width: 64px; height: 64px; }
.win-card.mm .big-g .pc { width: 64px; height: 64px; }
/* a short phone: the whole results card on screen, its buttons on one row */
@media (max-height: 700px) {
  .winburst { width: min(180px, 50vw); margin-bottom: -12px; }
  .win-card { gap: 6px; }
  .win-card h1 { font-size: 23px; }
  .win-card p, .win-card .vs { font-size: 15px; }
  .win-card .big-g, .win-card .big-g .pc, .win-card.mm .big-g, .win-card.mm .big-g .pc { width: 52px; height: 52px; }
  .win-card .final, .win-card.mm .final { width: min(108px, 30vw); margin: 0; gap: 4px; }
  .win-card .row { flex-wrap: nowrap; gap: 6px; margin-top: 2px; }
  .win-card .row .primary, .win-card .row .btn { height: 48px; padding: 0 9px; font-size: 14px; white-space: nowrap; }
  .rchg { font-size: 16px; } .rchg b { font-size: 20px; }
}
.link.opp { display: inline; height: auto; min-height: 44px; padding: 0 8px; font-size: 17px; text-decoration: underline; }
/* ---------- the card games and the wheel: Blackjack, Ride the Bus, Roulette ---------- */
/* Playing cards: cream paper, an ink outline, the rank in the corner and a big suit. A card slides in from
   the shoe (.slide, at --d) and turns face up (.flip, at --f): two animations, on the card and on its inner
   face, each from its own moment in the move. Face down: the back, sky-blue stripes. */
.plc { --cw: 52px; position: relative; display: inline-block; flex: none; width: var(--cw); height: calc(var(--cw) * 1.4); perspective: 500px; vertical-align: middle; }
.pcin { position: absolute; inset: 0; transform-style: preserve-3d; }
.plc.down .pcin { transform: rotateY(180deg); }
.pcf { position: absolute; inset: 0; border-radius: calc(var(--cw) * .14); border: 2.5px solid var(--ink); box-shadow: 0 3px 0 var(--ink); backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.pcf.fc { background: var(--paper); color: var(--ink); }
.plc.red .pcf.fc { color: #d6301e; }
.pcf.rev { transform: rotateY(180deg); background: repeating-linear-gradient(45deg, var(--sky) 0 calc(var(--cw) * .09), #8cc7e3 calc(var(--cw) * .09) calc(var(--cw) * .18)); box-shadow: 0 3px 0 var(--ink), inset 0 0 0 calc(var(--cw) * .06) var(--paper); }
.pcf .rk { position: absolute; left: 7%; top: 4%; font: 400 calc(var(--cw) * .42)/1 'Luckiest Guy', sans-serif; letter-spacing: -.03em; }
.pcf .suit { position: absolute; fill: currentColor; }
.pcf .suit.sm { left: 8%; top: 38%; width: 26%; }
.pcf .suit.lg { right: 7%; bottom: 7%; width: 52%; }
.plc.ghost { opacity: .25; }
.plc.slide { animation: pcslide .26s var(--d, 0ms) cubic-bezier(.25, .8, .35, 1) both; }
.plc.flip .pcin { animation: pcflip .3s var(--f, 0ms) ease-in-out both; }
@keyframes pcslide { from { opacity: 0; transform: translate(var(--sx, 110px), var(--sy, -90px)) rotate(-16deg); } 35% { opacity: 1; } to { opacity: 1; transform: none; } }
@keyframes pcflip { from { transform: rotateY(180deg); } to { transform: rotateY(0); } }
.suit.inl { display: inline-block; width: .95em; height: .95em; vertical-align: -.1em; fill: currentColor; margin-left: 1px; }
.cshort { font-weight: 800; white-space: nowrap; }
.cshort.red { color: #d6301e; }
.appear { animation: appearin .3s var(--t, 0ms) ease-out both; }
@keyframes appearin { from { opacity: 0; transform: scale(.6); } 60% { opacity: 1; transform: scale(1.12); } to { opacity: 1; transform: none; } }

/* the two players' tallies (Blackjack wins, Roulette hits): pips, filled for each one won */
.ctals { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; flex: none; }
.ctals.col { grid-template-columns: 1fr; align-content: center; }
.ctal { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--paper); border: 3px solid var(--ink); border-radius: 14px 10px 16px 9px; padding: 5px 10px 3px; min-width: 0; }
.ctal > b { font-weight: 800; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.ctal.now { box-shadow: 0 0 0 3px var(--o); }
.ctal.X.now { box-shadow: 0 0 0 3px var(--x); }
.ctal .pips { display: flex; gap: 4px; flex: none; }
.ctal .pips i { width: 15px; height: 15px; border-radius: 50%; border: 2.5px solid var(--ink); background: var(--paper); }
.ctal.X .pips i.on { background: var(--x); }
.ctal.O .pips i.on { background: var(--o); }
.ctal .pips i.fillin { animation: pipfill .4s var(--t, 0ms) cubic-bezier(.3, 1.6, .5, 1) both; }
@keyframes pipfill { from { background: var(--paper); transform: none; } 1% { transform: scale(.6); } to { transform: none; } }
.cbtns { display: grid; gap: 8px; flex: none; }
.cbtns.hold { visibility: hidden; }   /* kept for its room: the button comes and goes without moving anything */
.cbtns.one { grid-template-columns: 1fr; }
.cbtns.two { grid-template-columns: 1fr 1fr; }
.cbtns.three { grid-template-columns: 1fr 1fr 1fr; }
.cbtns.four { grid-template-columns: repeat(4, 1fr); }
.cbtns .big { min-width: 0; padding: 4px 6px 0; }
.big.dbl { background: var(--sky); color: var(--ink); }

/* Blackjack: the felt, with the dealer above and the hand in play below */
.g-bj { width: min(var(--gw), 440px); height: var(--gh); display: flex; flex-direction: column; gap: 10px; padding-top: 4px; }
.felt { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: space-around; gap: 6px; padding: 10px 12px; background: radial-gradient(ellipse at 50% 40%, #3f8a4b, #2c6a37); border: 3.5px solid var(--ink); border-radius: 22px 16px 24px 14px; box-shadow: 0 5px 0 var(--ink), inset 0 0 0 4px rgba(255, 248, 232, .15); }
.bjrow { display: flex; flex-direction: column; align-items: center; gap: 6px; --cw: clamp(40px, calc(var(--gh) / 7), 74px); }
.bjrow .plc { --cw: inherit; }
.bjrow.dealer { --sx: 90px; --sy: -40px; }
.bjrow.player { --sx: 90px; --sy: -160px; }
.bjlab { color: var(--paper); font-weight: 800; font-size: 14px; display: flex; gap: 8px; align-items: baseline; text-shadow: 0 1px 0 rgba(0, 0, 0, .35); }
.bjlab b.X, .bjlab b.O { background: var(--paper); border-radius: 8px; padding: 0 6px; text-shadow: none; }
.bjtot { background: var(--ink); color: var(--paper); border-radius: 999px; padding: 1px 9px 0; font-size: 13px; text-shadow: none; }
.bjtot:empty { display: none; }
.bjcards { display: flex; align-items: center; justify-content: flex-start; min-height: calc(var(--cw) * 1.4 + 3px); width: calc(var(--cw) * 3.9); }
.bjstack { display: grid; }
.bjstack > .bjset { grid-area: 1 / 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.bjmid > .bjset { justify-content: center; }
.bjcards .plc + .plc { margin-left: calc(var(--cw) * -.28); }
.bjres { align-self: center; display: flex; align-items: center; gap: 8px; min-height: 34px; padding: 3px 14px 1px; border: 3px solid var(--ink); border-radius: 999px; background: var(--paper); font: 400 17px 'Luckiest Guy', sans-serif; text-align: center; }
.bjres .pc { width: 26px; height: 26px; }
.bjres.none { font: 700 14px 'Patrick Hand', sans-serif; background: rgba(255, 248, 232, .85); border-color: transparent; }
.bjres.bj, .bjres.win { background: var(--o); }
.bjres.bust, .bjres.lose { background: #f1c8bf; }

/* Ride the Bus: each player's four slots, the deck and the card drawn, the question */
.g-bus { width: min(var(--gw), 440px); height: var(--gh); display: flex; flex-direction: column; gap: 10px; padding-top: 4px; }
.busrows { display: flex; flex-direction: column; gap: 6px; flex: none; }
.busrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; background: var(--paper); border: 3px solid var(--ink); border-radius: 14px 10px 16px 9px; padding: 5px 8px; --cw: clamp(30px, calc(var(--gh) / 14), 40px); }
.busrow.now { box-shadow: 0 0 0 3px var(--o); }
.busrow.X.now { box-shadow: 0 0 0 3px var(--x); }
.busnm { display: flex; flex-direction: column; min-width: 0; }
.busnm b { align-self: flex-start; max-width: 100%; font-weight: 800; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.busnm small { color: var(--muted); font-size: 12px; font-weight: 700; }
.busslots { display: flex; gap: 5px; }
.busslot { position: relative; width: var(--cw); height: calc(var(--cw) * 1.4); flex: none; }
.bsl { position: absolute; inset: 0; border-radius: calc(var(--cw) * .14); border: 2.5px dashed rgba(22, 18, 16, .3); display: grid; place-items: center; color: var(--muted); }
.bsl-ico { display: grid; place-items: center; width: 64%; height: 64%; }
.bsl-ico svg { width: 100%; height: 100%; }
.bsl.next { border: 2.5px solid var(--ink); background: #fff3c4; color: var(--ink); }
.bsl.got { border: 0; }
.bsl .plc { --cw: inherit; }
.bsl.got.tf .plc { animation: arrive .3s var(--f, 0ms) cubic-bezier(.3, 1.6, .5, 1) both; }
@keyframes arrive { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: none; } }
/* timed swaps, from the move: .tu shows until --u, .tf from --f (nothing in the progress rows changes early) */
/* ---- the arcade games: Bullseye, Echo, Plinko, Cup Pong, Trivia, Odd One Out ---- */
.g-arc { width: min(var(--gw), 440px); height: var(--gh); display: flex; flex-direction: column; gap: 8px; padding-top: 4px; }
.g-arc .ctal small { font-size: 12px; color: var(--muted); font-weight: 700; white-space: nowrap; }
.ctal small, .ctal .pips { font-variant-numeric: tabular-nums; }
.g-arc .ctal > small { min-width: 6.2em; text-align: right; } .wtal small { min-width: 3.6em; text-align: right; }   /* a tally's text is a set width: as its number grows, nothing beside it moves */
.arcres { text-align: center; font-family: 'Luckiest Guy', 'Arial Black', sans-serif; font-size: 20px; letter-spacing: .02em; line-height: 1.05; }

.arcres, .arcnote { margin: 0; flex: none; height: 40px; align-content: center; }   /* the status or result line under a table: always this tall (up to two lines), so swapping one for the other never moves the board */
/* Bullseye: the bar, its middle zone, the sweeping marker (a dart) */
.bulls { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 12px; min-height: 0; }
.bfield { position: relative; margin: 0 auto; width: min(100%, 330px, calc((100dvh - 330px) * 100 / 120)); min-width: 200px; aspect-ratio: 100 / 120; border: 3px solid var(--ink); border-radius: 14px; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
  background: radial-gradient(circle at 50% 40%, #fdf6e3 0 30%, #f1e6c9 100%); background-image: radial-gradient(circle at 50% 40%, #fdf6e3, #efe2c2), repeating-linear-gradient(0deg, transparent 0 19px, rgba(22,18,16,.05) 19px 20px); }
.bfield[data-live] { cursor: crosshair; }
.bdboard { position: absolute; aspect-ratio: 1; transform: translate(-50%, -50%); pointer-events: none; }
.bdboard svg { width: 100%; height: 100%; display: block; overflow: visible; }
.bdboard .bring { fill: #2b2420; stroke: var(--ink); stroke-width: 3; } .bdboard .bsa { fill: #e8d6a6; } .bdboard .bsb { fill: #3b8f4a; } .bdboard .bbulo { fill: #3b8f4a; stroke: var(--ink); stroke-width: 2; } .bdboard .bbul { fill: var(--x); stroke: var(--ink); stroke-width: 2; }
.bdboard.slide { animation: bslide .45s var(--t0, 0ms) cubic-bezier(.3, .8, .3, 1) both; }

.bdboard.hit1 svg { animation: boardhit .5s var(--t, 0ms) both; } .bdboard.hit3 svg { animation: bullhit .8s var(--t, 0ms) both; }
@keyframes boardhit { 0%, 100% { filter: none; } 40% { filter: brightness(1.35); } }
@keyframes bullhit { 0%, 100% { filter: none; transform: none; } 30% { filter: brightness(1.5) drop-shadow(0 0 6px var(--o)); transform: scale(1.12); } }
.bvline, .bhline { position: absolute; pointer-events: none; background: var(--ink); }
.bvline { top: 0; bottom: 0; width: 3px; margin-left: -1.5px; }
.bhline { left: 0; right: 0; height: 3px; margin-top: -1.5px; }
.bvline.sweep { animation: bsweepx var(--p, 1300ms) var(--dl, 0ms) linear infinite alternate both; background: var(--x); box-shadow: 0 0 0 1px var(--ink); }
.bhline.sweep { animation: bsweepy var(--p, 1560ms) var(--dl, 0ms) linear infinite alternate both; background: var(--x); box-shadow: 0 0 0 1px var(--ink); }
.bvline.set, .bhline.set { background: var(--ink); opacity: .55; }
.blayer { position: absolute; inset: 0; pointer-events: none; }
.bvline.rep { animation: bsweepx var(--p, 1040ms) var(--t, 0ms) linear var(--it, 1) alternate both; background: var(--x); box-shadow: 0 0 0 1px var(--ink); }
.bhline.rep { animation: bsweepy var(--p, 1250ms) var(--t, 0ms) linear var(--it, 1) alternate both; background: var(--x); box-shadow: 0 0 0 1px var(--ink); }
@keyframes bsweepx { from { left: 0%; } to { left: 100%; } }
@keyframes bsweepy { from { top: 0%; } to { top: 100%; } }
.bdart { position: absolute; width: 18px; height: calc(18px * 66 / 26); margin-left: -9px; margin-top: calc(18px * -62 / 26); pointer-events: none; }   /* the drawing's own shape (26 x 66), its tip (13, 62) exactly on the spot */
.bdart svg { width: 100%; height: 100%; display: block; }
.bdart.fly svg { animation: dartfly .38s var(--t, 0ms) cubic-bezier(.3, .6, .4, 1) both; transform-origin: 50% 100%; }
@keyframes dartfly { from { transform: translateY(140px) scale(2.2); opacity: 0; } 20% { opacity: 1; } to { transform: none; opacity: 1; } }
/* Echo: four pads, lit in turn as the pattern plays, then tapped back */
.echo { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 10px; min-height: 0; }
.epads { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: min(100%, 300px); margin: 0 auto; aspect-ratio: 1; }
.epad { position: relative; border: 3px solid var(--ink); border-radius: 18px; box-shadow: 0 4px 0 var(--ink); font-size: 34px; color: rgba(255, 255, 255, .85); display: grid; place-items: center; opacity: .55; transition: opacity .12s, transform .08s; touch-action: manipulation; }
.epad.k0 { background: #e5432a; } .epad.k1 { background: #4e9d3a; } .epad.k2 { background: #3b87c7; } .epad.k3 { background: #f6c21b; color: rgba(60, 40, 0, .7); }
.epad:disabled { cursor: default; }
.epad.live { opacity: .55; } .epad.live:active { opacity: 1; transform: translateY(2px); box-shadow: 0 2px 0 var(--ink); }
.epad.on { opacity: 1; filter: brightness(1.18); transform: scale(.96); transition: none; }   /* the pad just tapped, lit (the page lights it for a moment) */

@keyframes padon { from, to { opacity: 1; } }
@keyframes padlit { 0% { opacity: .55; } 12%, 80% { opacity: 1; transform: scale(1.04); } 100% { opacity: .55; } }
@keyframes padpass { 0%, 100% { opacity: .55; } 30%, 70% { opacity: 1; } }
@keyframes padhint { 0%, 100% { opacity: .55; } 40%, 80% { opacity: 1; box-shadow: 0 0 0 4px var(--green), 0 4px 0 var(--ink); } }
.elock { position: absolute; inset: -6px; border-radius: 22px; background: transparent; }   /* over the pads while the pattern plays: no tapping yet */
.esteps { display: flex; justify-content: center; gap: 5px; flex-wrap: wrap; min-height: 12px; }

@keyframes tapin { from, to { background: var(--green); } }
.elev { display: inline-flex; gap: 3px; } .elev i { width: 12px; height: 12px; border-radius: 3px; border: 2px solid var(--ink); background: var(--paper); }
.ctal.X .elev i.on { background: var(--x); } .ctal.O .elev i.on { background: var(--o); }
.elev i.fillin { animation: pipfill .4s var(--t, 0ms) cubic-bezier(.3, 1.6, .5, 1) both; }   /* a pattern beaten: its square fills in when the result shows */
/* Plinko: the slots, the pegs, the bins, the chip */
.plinko { flex: 1; display: flex; flex-direction: column; min-height: 0; gap: 6px; }
.pslots { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; width: min(100%, 380px); margin: 0 auto; }
.pslots button { height: 40px; border: 3px solid var(--ink); border-radius: 10px; background: var(--paper); font-family: 'Luckiest Guy', sans-serif; font-size: 14px; box-shadow: 0 3px 0 var(--ink); padding: 0; }
.pslots button:disabled { opacity: .55; box-shadow: none; }
.pslots button.X { background: var(--x-soft); } .pslots button.O { background: var(--o-soft); }
.pboard { position: relative; width: min(100%, 380px); margin: 0 auto; flex: 1; min-height: 180px; max-height: 360px; border: 3px solid var(--ink); border-radius: 14px; background: var(--paper); overflow: hidden; }
.pboard svg { position: absolute; inset: 0; width: 100%; height: 100%; }

.pboard .bin.top { fill: #f6c21b; }
.pboard .bin.lit { animation: binlit .5s var(--t, 0ms) both; }
@keyframes binlit { 0%, 100% { filter: none; } 50% { filter: brightness(1.4); } }
.pboard text { font: 700 11px 'Luckiest Guy', sans-serif; fill: var(--ink); text-anchor: middle; }
.pchip { position: absolute; width: 8%; aspect-ratio: 1; margin-left: -4%; border-radius: 50%; border: 3px solid var(--ink); box-shadow: 0 2px 0 var(--ink); transform: translate(0, -100%); transform-origin: 50% 100%; }   /* left/top: the middle of its bottom edge */
.pvals { position: absolute; left: 0; right: 0; top: 86%; height: 12%; pointer-events: none; }
.pval { position: absolute; top: 0; height: 100%; width: 10%; margin-left: -5%; display: grid; place-items: center; font: 400 clamp(12px, 4.2vw, 18px)/1 'Luckiest Guy', sans-serif; padding-top: 2px; color: var(--ink); }
.pbonus { position: absolute; width: 7%; aspect-ratio: 1; margin: -3.5% 0 0 -3.5%; border-radius: 50%; background: #f6c21b; border: 2.5px solid var(--ink); box-shadow: 0 0 0 3px rgba(246, 194, 27, .45); display: grid; place-items: center; z-index: 1; pointer-events: none; }
.pbonus b { position: absolute; bottom: 105%; left: 50%; transform: translateX(-50%); font: 400 clamp(10px, 3.2vw, 13px)/1 'Luckiest Guy', sans-serif; color: #b07d00; white-space: nowrap; text-shadow: 0 0 2px var(--paper), 0 0 2px var(--paper); }
.pbonus.hit { animation: tuntil 1ms var(--u, 0ms) both, bonushit .5s var(--t, 0ms) both; }
@keyframes bonushit { 0% { filter: none; } 30% { filter: brightness(1.6); transform: scale(1.5); } 100% { filter: brightness(1.2); transform: none; } }
.pplus { position: absolute; transform: translate(-50%, -50%); font: 400 clamp(14px, 4.6vw, 20px)/1 'Luckiest Guy', sans-serif; color: #b07d00; text-shadow: 0 0 3px var(--paper), 0 0 3px var(--paper); pointer-events: none; z-index: 2; animation: plusup .9s var(--t, 0ms) ease-out both; }
.pplus.pbig { color: var(--green); font-size: clamp(18px, 6vw, 26px); }
@keyframes plusup { from { opacity: 0; translate: 0 6px; } 15% { opacity: 1; } 70% { opacity: 1; } to { opacity: 0; translate: 0 -22px; } }
.pslots button.used { background: var(--panel-2); color: var(--muted); }
.plkpts { font: 400 20px/1 'Luckiest Guy', sans-serif; display: inline-flex; align-items: baseline; gap: 2px; font-variant-numeric: tabular-nums; } .g-arc .ctal .plkpts small { font-size: 12px; }
.ppts { display: inline-grid; text-align: right; min-width: 2ch; } .ppts > span { grid-area: 1 / 1; }
.pchip.X { background: var(--x); } .pchip.O { background: var(--o); }
.pchip.drop { animation: var(--path) var(--d, 1800ms) linear both; }
/* Cup Pong: the table, the rack, the ball thrown with a swipe */
.pong { flex: 1; display: flex; flex-direction: column; min-height: 0; gap: 6px; }
.pong.live { touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }   /* the whole game area takes the flick */
.ptable { position: relative; margin: 0 auto; width: min(100%, 300px, calc(var(--gh) * .62)); aspect-ratio: 5 / 7; border: 4px solid #6b4a2b; border-radius: 12px; background: #c88a4a; box-shadow: inset 0 0 0 6px #d9a467; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
.pcup { position: absolute; width: 17%; aspect-ratio: 1; margin: -8.5% 0 0 -8.5%; border-radius: 50%; border: 3px solid var(--ink); background: radial-gradient(circle at 50% 45%, #fff 0 30%, var(--x) 32%); }
.pcup.O { background: radial-gradient(circle at 50% 45%, #fff 0 30%, var(--sky) 32%); }
.pcup.gone { display: none; }
.pcup.sink { animation: cupsink .5s var(--t, 0ms) both; }
@keyframes cupsink { to { transform: scale(.3); opacity: 0; } }
.pball { position: absolute; width: 9%; aspect-ratio: 1; margin: -4.5% 0 0 -4.5%; border-radius: 50%; background: #fff; border: 2.5px solid var(--ink); box-shadow: 0 2px 0 var(--ink); }
.pball.ready { cursor: grab; }
.pfly { position: absolute; inset: 0; pointer-events: none; animation: pflight var(--d, 900ms) cubic-bezier(.3, .2, .6, 1) both; will-change: transform; }
@keyframes pflight { from { transform: none; } to { transform: translate(var(--tx, 0%), var(--ty, 0%)); } }
.parc { position: absolute; left: 50%; top: 92%; width: 9%; aspect-ratio: 1; margin: -4.5% 0 0 -4.5%; animation: parc var(--d, 900ms) ease-in-out both; will-change: transform; }
@keyframes parc { 0%, 100% { transform: none; } 50% { transform: scale(1.7); } }
.parc .pball { position: absolute; inset: 0; width: auto; margin: 0; animation: none; }
.parc .pball.in { animation: ballin .35s var(--f, 900ms) both; }
.parc .pball.off { animation: balloff .5s var(--f, 900ms) both; }
.parc .pball.rim.off { animation: prim .4s var(--t, 900ms) both, balloff .5s var(--f, 900ms) both; }
@keyframes prim { 25% { translate: -22% 0; } 75% { translate: 22% 0; } }
.pball.launch { animation: plaunch .25s ease-out both; }   /* let go, online: the ball answers at once while the server works out the throw */
@keyframes plaunch { 50% { transform: scale(1.18); } to { transform: scale(1.08); } }
.pball.fly { animation: var(--arc) var(--d, 900ms) cubic-bezier(.3, .2, .6, 1) both; }
.pball.rim { animation: var(--arc) var(--d, 900ms) cubic-bezier(.3, .2, .6, 1) both, rimwobble .4s var(--t, 900ms) both; }
@keyframes rimwobble { 0%, 100% { margin-left: -4.5%; } 25% { margin-left: -6.5%; } 75% { margin-left: -2.5%; } }
.pball.in { animation: var(--arc) var(--d, 900ms) cubic-bezier(.3, .2, .6, 1) both, ballin .35s var(--f, 900ms) both; }
@keyframes ballin { to { transform: scale(.2); opacity: 0; } }
.pball.off { animation: var(--arc) var(--d, 900ms) cubic-bezier(.3, .2, .6, 1) both, balloff .5s var(--f, 900ms) both; }
@keyframes balloff { to { opacity: 0; } }
.pcups { display: inline-flex; gap: 3px; } .pcups i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--ink); background: var(--paper); }
.ctal.X .pcups i.on { background: var(--x); } .ctal.O .pcups i.on { background: var(--o); }
/* Dash and Lane Rush: the two progress bars, the run on a canvas, the countdown over it */
.runner { flex: 1; display: flex; flex-direction: column; min-height: 0; gap: 8px; }
.rprogs { display: grid; gap: 6px; }
.rprog { display: grid; grid-template-columns: 84px minmax(0, 1fr) 7.4em; align-items: center; gap: 8px; font-weight: 800; font-size: 14px; }   /* fixed columns: both bars the same length, whatever the names */
.rprog > b { display: block; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rprog.now > b { text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 3px; }
.rbar { position: relative; height: 16px; border: 3px solid var(--ink); border-radius: 10px; background: var(--paper); overflow: hidden; }
.rbar i { position: absolute; left: 0; top: 0; bottom: 0; width: var(--w0, 0%); border-radius: 6px; }
.rprog.X .rbar i { background: var(--x); } .rprog.O .rbar i { background: var(--o); }
.rbar i.grow { animation: rgrow var(--d, 900ms) var(--t, 0ms) cubic-bezier(.2, .7, .3, 1) both; }   /* the run's result: the bar grows to the new distance, from the move */
@keyframes rgrow { from { width: var(--w0, 0%); } to { width: var(--w1, 0%); } }
.rprog small { color: var(--muted); font-size: 12px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; text-align: right; overflow: hidden; }
.rscene { position: relative; margin: 0 auto; width: 100%; border: 3px solid var(--ink); border-radius: 14px; overflow: hidden; background: #cfe9f7; touch-action: none; user-select: none; -webkit-user-select: none; min-height: 150px; }
.rscene.dash { flex: 0 1 auto; aspect-ratio: 16 / 11; max-height: 100%; }
.rscene.lane { flex: 1; min-height: 220px; }
.rscene.flap { flex: 0 1 auto; aspect-ratio: 4 / 3; max-height: 100%; }
.rscene.chopper { flex: 0 1 auto; aspect-ratio: 16 / 11; max-height: 100%; }
.rscene canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.rhud { position: absolute; left: 10px; top: 6px; font-family: 'Luckiest Guy', 'Arial Black', sans-serif; font-size: 18px; color: var(--ink); text-shadow: 0 2px 0 #fff; pointer-events: none; font-variant-numeric: tabular-nums; }
.rcount { position: absolute; inset: 0; display: grid; place-items: center; font-family: 'Luckiest Guy', 'Arial Black', sans-serif; font-size: 76px; color: var(--paper); -webkit-text-stroke: 3px var(--ink); text-shadow: 0 4px 0 var(--ink); pointer-events: none; }
.rhint { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; color: var(--ink); font-weight: 800; font-size: 13px; pointer-events: none; opacity: .85; }
.fing { flex: 1; display: flex; flex-direction: column; min-height: 0; gap: 8px; }
.fing > .rprogs, .fing > .ctals { flex: none; }
.fing .ctals.col { gap: 6px; margin-top: 4px; }   /* (clear of the header's two lines, the turn's ring and all) */
.fing .ctal.fprog { padding: 4px 10px 2px; }
.fing .ctal.fprog .pips i { width: 14px; height: 14px; }
.fscene { position: relative; flex: 1; min-height: 160px; width: 100%; border: 3px solid var(--ink); border-radius: 14px; overflow: hidden; background: #cfe9f7; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.fscene.scoop { background: #fff4f5; } .fscene.pinball { background: #241b38; }
.fscene canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.fscene.pinball .fhud { color: var(--paper); text-shadow: 0 2px 0 var(--ink); }
.fhint { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; color: var(--ink); font-weight: 800; font-size: 14px; pointer-events: none; text-shadow: 0 1px 0 #fff; animation: fhint 1.8s ease-out both; }
.fscene.pinball .fhint { color: var(--paper); text-shadow: 0 2px 0 var(--ink); bottom: auto; top: 36%; }
@keyframes fhint { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
.atwords.fwords { height: 40px; min-height: 40px; max-height: 40px; font-size: 14px; flex: none; }
.trun { display: grid; gap: 5px; width: 100%; padding: 0 6px; }
.trun .tr { display: grid; grid-template-columns: 12px 1fr; align-items: center; gap: 4px; }
.trun .tr b { font-size: 11px; }
.trun .tr i { display: block; height: 9px; border: 2px solid var(--ink); border-radius: 5px; background: var(--paper); overflow: hidden; position: relative; }
.trun .tr i::after { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: var(--w, 0%); }
.trun .tr.X i::after { background: var(--x); } .trun .tr.O i::after { background: var(--o); }
/* Mini Golf, Pool and Bowling: the table on a canvas, letterboxed in its box */
.phys { flex: 1; display: flex; flex-direction: column; min-height: 0; gap: 8px; }
.phys .arcres, .phys .arcnote { margin: 0; height: 26px; line-height: 26px; flex: none; }   /* the line under the table keeps its height, so the table never jumps */
.pscene { position: relative; flex: 1; min-height: 160px; margin: 0 auto; width: 100%; border: 3px solid var(--ink); border-radius: 14px; overflow: hidden; background: #2f7a3a; touch-action: none; user-select: none; -webkit-user-select: none; }
.pscene.pool { background: #7a4a22; } .pscene.bowling { background: #6b6f78; }
.pscene.wait { display: grid; place-items: center; background: var(--panel-2); }
.pscene canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.pstrike { position: absolute; inset: 0; display: grid; place-items: center; font-family: 'Luckiest Guy', 'Arial Black', sans-serif; font-size: 58px; color: var(--o); -webkit-text-stroke: 3px var(--ink); text-shadow: 0 5px 0 var(--ink); pointer-events: none; animation: strikein .7s var(--t, 0ms) cubic-bezier(.3, 1.6, .5, 1) both; transform: rotate(-8deg); }
@keyframes strikein { from { opacity: 0; transform: rotate(-8deg) scale(.3); } 60% { opacity: 1; transform: rotate(-8deg) scale(1.15); } to { opacity: 1; transform: rotate(-8deg) scale(1); } }
.ctal small i.pins { font-style: normal; display: inline-grid; } .ctal small i.pins b { grid-area: 1 / 1; } .ctal small i.pins .was { animation: fadeout .2s var(--t, 0ms) both; } .ctal small i.pins .now { animation: appearin .4s var(--t, 0ms) ease-out both; }
@keyframes fadeout { from { opacity: 1; } to { opacity: 0; } }
.tphys { display: block; height: 100%; width: auto; max-width: 100%; }
.tphys.wait { display: grid; place-items: center; width: 100%; color: var(--muted); } .tphys.wait svg { width: 40cqw; height: 40cqw; }
.tphys .grass { fill: #5fbf5a; stroke: var(--ink); stroke-width: 3; } .tphys .wall { fill: #c58a4a; stroke: var(--ink); stroke-width: 2.5; } .tphys .bump { fill: #f3f0e6; stroke: var(--ink); stroke-width: 2.5; }
.tphys .cup { fill: #17331c; stroke: var(--ink); stroke-width: 2; } .tphys .rail { fill: #7a4a22; } .tphys .cloth { fill: #2d8a4e; } .tphys .pocket { fill: #0d0d0d; }
.tphys circle.X { fill: var(--x); stroke: var(--ink); stroke-width: 1.5; } .tphys circle.O { fill: var(--o); stroke: var(--ink); stroke-width: 1.5; } .tphys circle.cue { fill: #fdfaf0; stroke: var(--ink); stroke-width: 1.5; } .tphys circle.black { fill: #1b1b1b; stroke: var(--ink); stroke-width: 1.5; }
.tphys text { fill: var(--ink); font-weight: 800; text-anchor: middle; font-family: Nunito, Arial, sans-serif; }
.tbowl { display: grid; gap: 4cqw; width: 84cqw; } .tbowl svg { display: block; width: 100%; height: 46cqw; } .tbowl .pin { fill: #fff; stroke: var(--ink); stroke-width: 1.5; } .tbowl .pin.down { fill: var(--panel-2); stroke: var(--muted); }
.tbowl .trun { padding: 0; }
/* Craps: the point strip with its puck, the felt where the dice tumble, the rolls so far */
.craps { flex: 1; display: flex; flex-direction: column; gap: 10px; min-height: 0; justify-content: center; }
.cpts { position: relative; display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; width: min(100%, 360px); margin: 0 auto; }
.cpts > i { font-style: normal; height: 40px; display: grid; place-items: center; border: 3px solid var(--ink); border-radius: 10px; background: #2f7a3a; color: #fff; font-family: 'Luckiest Guy', sans-serif; font-size: 18px; padding-top: 3px; }
.cpts > i.off { background: transparent; border-style: dashed; border-color: var(--muted); }
.cpuck { position: absolute; top: 50%; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; border: 3px solid var(--ink); background: #1b1b1b; color: #fff; display: grid; place-items: center; font: 800 10px Nunito, sans-serif; box-shadow: 0 3px 0 var(--ink); z-index: 1; }
.cpuck.on { background: #fff; color: var(--ink); }
.cpuck.move { animation: puckon .42s var(--t, 0ms) cubic-bezier(.3, 1.4, .5, 1) both; }
.cpuck.moveoff { animation: puckoff .42s var(--t, 0ms) cubic-bezier(.3, 1.4, .5, 1) both; }
@keyframes puckoff { from { left: var(--from); background: #fff; color: var(--ink); } 60% { background: #fff; color: var(--ink); } to { left: var(--to); background: #1b1b1b; color: #fff; } }
@keyframes puckon { from { left: var(--from); background: #1b1b1b; color: #fff; } 60% { background: #1b1b1b; color: #fff; } to { left: var(--to); background: #fff; color: var(--ink); } }
.cfelt { position: relative; height: 150px; width: min(100%, 360px); margin: 0 auto; border: 3px solid var(--ink); border-radius: 18px; background: radial-gradient(circle at 50% 45%, #3b9a4b, #2a7238); overflow: hidden; display: grid; place-items: center; }
.cpair { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 18px; }
.cpair .cdie { width: 64px; height: 64px; border-radius: 16px; border-width: 3px; box-shadow: 0 5px 0 var(--ink); }
.cpair.tumble { animation: cpairin .55s var(--t, 0ms) both; }
.cpair.tumble .cdie { animation: cdietumble .55s var(--t, 0ms) cubic-bezier(.25, .8, .4, 1) both; } .cpair.tumble .cdie.b { animation-name: cdietumble2; }
.cpair.gone { animation: cpairin .55s var(--t, 0ms) both, cpairout 1ms var(--t2, 0ms) forwards; }
@keyframes cpairin { from { opacity: 0; } 1% { opacity: 1; } to { opacity: 1; } }
@keyframes cpairout { to { opacity: 0; } }
@keyframes cdietumble { from { transform: translate(-90px, -70px) rotate(-260deg) scale(.7); } 60% { transform: translate(6px, 6px) rotate(20deg); } 80% { transform: translate(-2px, -6px) rotate(-6deg); } to { transform: none; } }
@keyframes cdietumble2 { from { transform: translate(90px, -80px) rotate(300deg) scale(.7); } 60% { transform: translate(-6px, 4px) rotate(-18deg); } 80% { transform: translate(2px, -5px) rotate(5deg); } to { transform: none; } }
.crolls { display: flex; flex-wrap: nowrap; gap: 6px; justify-content: center; height: 26px; overflow: hidden; }   /* one row, always this tall: the round's last eight rolls */
.crolls span { min-width: 26px; height: 26px; padding: 0 6px; border-radius: 13px; background: var(--panel-2); border: 2px solid var(--ink); display: grid; place-items: center; font-weight: 800; font-size: 13px; }
.tcdice { display: flex; gap: 2cqw; justify-content: center; } .tcdice span { width: 15cqw; height: 15cqw; border: 1.2cqw solid var(--ink); border-radius: 3cqw; background: #fff; display: grid; place-items: center; } .tcdice span svg { width: 100%; height: 100%; }
.tcdice.w span { box-shadow: 0 0 0 1.2cqw var(--green); }
/* Takeover: the 5x5 board; the tapped square pops, the ones round it turn over */
.takeover { flex: 1; display: flex; flex-direction: column; gap: 10px; justify-content: center; min-height: 0; }
.tkgrid { display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(5, 1fr); gap: 6px; width: min(100%, 340px, calc(100dvh - 370px)); aspect-ratio: 1; margin: 0 auto; }
.tkc { min-width: 0; min-height: 0; border: 3px solid var(--ink); border-radius: 10px; background: var(--paper); padding: 0; display: grid; place-items: center; font-family: 'Luckiest Guy', sans-serif; font-size: 20px; box-shadow: 0 3px 0 var(--ink); color: var(--ink); perspective: 300px; }
.tkc:disabled { box-shadow: none; }
.tkc.X { background: var(--x); color: #fff; } .tkc.O { background: var(--o); color: var(--ink); }
.tkc b { font-weight: 400; padding-top: 3px; }
.tkc.pop { animation: markpop .35s ease-out both; }
.tkc.turn { animation: tkturn .45s var(--t, 0ms) ease-in-out both; }
.tkc.turn.X.fromO, .tkc.turn.O.fromX, .tkc.turn.fromnone { --c0: var(--paper); }
.tkc.turn.X.fromO { --c0: var(--o); } .tkc.turn.O.fromX { --c0: var(--x); }
.tkc.turn.X { --c1: var(--x); } .tkc.turn.O { --c1: var(--o); }
@keyframes tkturn { 0% { transform: rotateY(0); background: var(--c0); color: transparent; } 49% { transform: rotateY(90deg); background: var(--c0); color: transparent; } 51% { transform: rotateY(90deg); background: var(--c1); } 100% { transform: none; background: var(--c1); } }
.tg.gtk { grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(5, 1fr); width: 62cqw; height: 62cqw; }
.tg.gtk i { border-radius: 2px; background: var(--panel-2); } .tg.gtk i.X { background: var(--x); } .tg.gtk i.O { background: var(--o); }
/* Flood: the 6x6 grid; the blob's cells and each player's in their colour */
.flood { flex: 1; display: flex; flex-direction: column; gap: 10px; justify-content: center; min-height: 0; }
.flgrid { display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(6, 1fr); gap: 0; width: min(100%, 330px, calc(100dvh - 430px)); aspect-ratio: 1; margin: 0 auto; padding: 2px; border: 3px solid var(--ink); border-radius: 14px; background: var(--ink); overflow: hidden; }
.flc { position: relative; min-width: 0; min-height: 0; border: 1.5px solid var(--ink); border-radius: 5px; display: grid; place-items: center; }
.flc.blob { border-radius: 0; }                                   /* the blob: one shape, no lines inside it */
.flc.jt { border-top-color: transparent; } .flc.jr { border-right-color: transparent; } .flc.jb { border-bottom-color: transparent; } .flc.jl { border-left-color: transparent; }
.flc.own.X { --pc: var(--x); } .flc.own.O { --pc: var(--o); }
.flc b { font: 400 12px/1 'Luckiest Guy', sans-serif; color: var(--pc); -webkit-text-stroke: .6px var(--ink); padding-top: 2px; }   /* whose cell: a small X or O, nothing more */
.flc.start::before { content: '★'; position: absolute; color: #fff; font-size: 16px; text-shadow: 0 1px 0 var(--ink); }
.flc.grab { animation: flgrab .35s var(--t, 0ms) cubic-bezier(.3, 1.5, .5, 1) both; }
.flc.grab b { animation: appear .2s var(--t, 0ms) both; }
@keyframes flgrab { from { transform: scale(.5); filter: brightness(1.6); } to { transform: none; filter: none; } }
.flc.recolor { animation: flrecolor .45s var(--t, 0ms) both; }
@keyframes flrecolor { from { background: var(--c0); } to { background: var(--c1); } }
.fsc { font-style: normal; display: inline-block; animation: appearin .4s var(--t, 0ms) ease-out both; }
/* the bar charts under Takeover's and Flood's boards (sbar): one height, the segments' widths and numbers move with the move */
.sbar { display: flex; height: 24px; border: 2.5px solid var(--ink); border-radius: 8px; overflow: hidden; background: var(--paper); flex: 1; min-width: 0; }
.sbar i { display: flex; align-items: center; justify-content: center; width: calc(var(--w) * 1%); min-width: 0; overflow: hidden; font: 400 13px/1 'Luckiest Guy', sans-serif; font-style: normal; padding-top: 2px; white-space: nowrap; }
.sbar i + i { box-shadow: inset 2px 0 0 var(--ink); }
.sbar i.X { background: var(--x); color: #fff; } .sbar i.O { background: var(--o); color: var(--ink); } .sbar i.E { background: var(--paper); color: var(--muted); }
.sbar i.grow { animation: sbarw .45s var(--t, 0ms) ease-out both; }
@keyframes sbarw { from { width: calc(var(--w0) * 1%); } to { width: calc(var(--w) * 1%); } }
.sbn { display: inline-grid; } .sbn > span { grid-area: 1 / 1; }
.takeover > .sbar { flex: none; width: min(100%, 340px, calc(100dvh - 370px)); margin: 0 auto; }
.fbars { display: grid; gap: 6px; width: min(100%, 330px); margin: 0 auto; flex: none; }
.fbr { display: flex; align-items: center; gap: 8px; } .fbr > b { font: 400 16px 'Luckiest Guy', sans-serif; width: 14px; padding-top: 2px; } .fbr .sbar { height: 18px; }
.fbr > small { font: 400 15px 'Luckiest Guy', sans-serif; min-width: 3.4em; text-align: right; padding-top: 2px; font-variant-numeric: tabular-nums; } .fbr > small span { color: var(--muted); font-size: 12px; }
.fbtns { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; width: min(100%, 360px); margin: 0 auto; flex: none; }
.fsw { height: 48px; border: 3px solid var(--ink); border-radius: 12px; box-shadow: 0 3px 0 var(--ink); padding: 0; display: grid; place-items: center; }
.fsw:disabled { box-shadow: none; opacity: .45; } .fsw i { font-style: normal; font-size: 11px; font-weight: 800; color: #fff; text-shadow: 0 1px 0 var(--ink); }
.tg.gfl { grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(6, 1fr); width: 62cqw; height: 62cqw; gap: 1px; }
.tg.gfl i { border-radius: 1.5px; } .tg.gfl i.own.X { box-shadow: inset 0 0 0 1.6cqw var(--x); } .tg.gfl i.own.O { box-shadow: inset 0 0 0 1.6cqw var(--o); }
/* Seating: ten tables, two coloured seats each; the customer walks in from the door */
.seating { flex: 1; display: flex; flex-direction: column; gap: 8px; justify-content: center; min-height: 0; }
.sdoor { display: flex; justify-content: center; flex: none; }
.snext { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; font-size: 14px; background: var(--paper); border: 3px solid var(--ink); border-radius: 12px; padding: 4px 10px; min-width: 15em; justify-content: flex-start; }
.sgwrap, .snext .sgwrap { display: inline-grid; } .sgwrap > span { grid-area: 1 / 1; }
.snext span { display: inline-flex; align-items: center; gap: 5px; }
.sgdot { width: 16px; height: 16px; border-radius: 50%; border: 2.5px solid var(--ink); flex: none; }
.sgo { animation: sgo .25s var(--t, 0ms) ease-in forwards; }
@keyframes sgo { to { opacity: 0; transform: translateY(8px); } }
.stbls { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; width: min(100%, 360px); margin: 0 auto; }
.sleave { position: absolute; left: 50%; top: 0; margin-left: -17px; z-index: 2; pointer-events: none; animation: sleave .9s var(--t, 0ms) ease-in-out both; }   /* a customer with no seat of their colour: walks through and out */
.sleave .sguest { width: 34px; height: 34px; box-shadow: 0 0 0 3px var(--sc); }
@keyframes sleave { 0% { opacity: 0; transform: translate(0, -40px) scale(.6); } 15% { opacity: 1; transform: translate(0, -20px) rotate(-8deg); } 40% { transform: translate(-30px, 60px) rotate(8deg); } 65% { opacity: 1; transform: translate(30px, 140px) rotate(-8deg); } 100% { opacity: 0; transform: translate(150px, 200px) scale(.7); } }
.stbl { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; gap: 4px; }
.sts { width: 44px; height: 44px; border: 3px solid var(--ink); border-radius: 50% 50% 38% 38%; background: var(--sc); box-shadow: 0 3px 0 var(--ink); padding: 0; display: grid; place-items: center; }
.sts:disabled { box-shadow: none; }
.sts b { width: 30px; height: 30px; border-radius: 50%; border: 2.5px solid var(--ink); display: grid; place-items: center; font: 400 17px 'Luckiest Guy', sans-serif; padding-top: 3px; }
.sts.X b { background: var(--x); color: #fff; } .sts.O b { background: var(--o); color: var(--ink); }
.sguest { width: 30px; height: 30px; border-radius: 50%; background: #8d8d8d; border: 2.5px solid var(--ink); display: grid; place-items: center; overflow: hidden; }
.sguest svg { width: 80%; height: 80%; fill: #f4f4f4; margin-top: 3px; }
.sts.pop b { animation: markpop .35s ease-out both; }
.sts.walk .sguest { animation: swalk .9s var(--t, 0ms) cubic-bezier(.3, .7, .4, 1) both; }
@keyframes swalk { 0% { opacity: 0; transform: translateY(-70px) scale(.6); } 15% { opacity: 1; transform: translateY(-58px) rotate(-10deg); } 35% { transform: translateY(-38px) rotate(10deg); } 55% { transform: translateY(-18px) rotate(-8deg); } 80% { transform: translateY(3px) scale(1.06); } 100% { transform: none; } }
.stop { height: 32px; border: 3px solid var(--ink); border-radius: 10px; background: #e7cfa6; display: grid; place-items: center; font-weight: 800; font-size: 12px; color: var(--muted); min-width: 0; }
.stbl.own.X .stop { background: var(--x); color: #fff; } .stbl.own.O .stop { background: var(--o); color: var(--ink); }
.stop b { font: 400 18px 'Luckiest Guy', sans-serif; font-weight: 400; padding-top: 3px; }
.stbl.got .stop { animation: stgot .6s var(--t, 0ms) both; }
@keyframes stgot { from { background: #e7cfa6; transform: scale(.85); } 50% { transform: scale(1.14); } to { transform: none; } }
.tseat { display: grid; grid-template-columns: 1fr 1fr; gap: 2cqw 5cqw; width: 66cqw; }
.tseat span { display: flex; gap: 1.2cqw; padding: .8cqw; border-radius: 2cqw; border: .9cqw solid transparent; }
.tseat span.own.X { border-color: var(--x); } .tseat span.own.O { border-color: var(--o); }
.tseat i { flex: 1; height: 7cqw; border-radius: 2cqw; background: var(--sc); opacity: .5; }
.tseat i.X { background: var(--x); opacity: 1; } .tseat i.O { background: var(--o); opacity: 1; } .tseat i.Z { background: #8d8d8d; opacity: 1; }
/* Districts: the map, each region in its leader's shade; spots on borders count for both sides */
.districts { flex: 1; display: flex; flex-direction: column; gap: 8px; justify-content: center; min-height: 0; }
.dmap { display: block; width: min(100%, 320px, calc((100dvh - 328px) * .84)); margin: 0 auto; }   /* (328: the bars, the tallies, the ties line and the status line) */
.dreg { fill: var(--paper); stroke: var(--ink); stroke-width: 1.2; stroke-linejoin: round; }
.dreg.X { fill: var(--x-soft); } .dreg.O { fill: var(--o-soft); }
.dreg.shift { animation: dshift .45s var(--t, 0ms) both; }
.dreg.shift.fromnone { --f0: var(--paper); } .dreg.shift.fromX { --f0: var(--x-soft); } .dreg.shift.fromO { --f0: var(--o-soft); }
@keyframes dshift { from { fill: var(--f0); } }
.dspot .dhit { fill: transparent; }
.dspot .dpc { fill: #fff; stroke: var(--ink); stroke-width: 1.3; }
.dspot.edge .dpc { stroke-width: 1.7; }
.dspot.open { cursor: pointer; } .dspot.open:hover .dpc { fill: var(--panel-2); }
.dspot.X .dpc { fill: var(--x); } .dspot.O .dpc { fill: var(--o); } .dspot.G .dpc { fill: #9d9d9d; }
.dspot.drop .pp { animation: ddrop .5s var(--t, 0ms) both; }
@keyframes ddrop { 0% { transform: translateY(-12px); opacity: 0; } 35% { opacity: 1; } 65% { transform: translateY(0); } 80% { transform: translateY(-2px); } 100% { transform: none; } }
.dties { margin: 0; flex: none; height: 20px; line-height: 20px; text-align: center; font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }   /* always this tall: the map never moves */
.dties b { font-weight: 800; }
.dspot text { font: 400 5.4px 'Luckiest Guy', sans-serif; text-anchor: middle; fill: #fff; pointer-events: none; } .dspot.O text { fill: var(--ink); }
.dspot .pp { transform-box: fill-box; transform-origin: center; }
.dspot.pop .pp { animation: markpop .35s ease-out both; }
.tdist { width: 52cqw; height: 62cqw; }
.tdist .dreg { stroke-width: 2; }
.tdist circle { fill: #fff; stroke: var(--ink); stroke-width: 1.6; } .tdist circle.X { fill: var(--x); } .tdist circle.O { fill: var(--o); } .tdist circle.G { fill: #a3a3a3; }
/* Shelves: six shelves of three; the grey mark drops in after each move */
.shelves { flex: 1; display: flex; flex-direction: column; gap: 8px; justify-content: center; min-height: 0; }
.shcase { width: min(100%, 330px); margin: 0 auto; border: 3px solid var(--ink); border-radius: 12px; background: #8a5a35; padding: 6px 8px 4px; display: grid; gap: 4px; box-shadow: 0 4px 0 var(--ink); }
.shrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: end; padding-bottom: 4px; border-bottom: 6px solid #d9a46b; }
.shspots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.shs { height: 38px; border: 3px dashed rgba(255, 255, 255, .55); border-radius: 8px 8px 3px 3px; background: rgba(255, 255, 255, .12); padding: 0; display: grid; place-items: center; }
.shs.X, .shs.O, .shs.G { border: 3px solid var(--ink); }
.shs.X { background: var(--x); color: #fff; } .shs.O { background: var(--o); color: var(--ink); } .shs.G { background: #9d9d9d; }
.shs b { font: 400 20px 'Luckiest Guy', sans-serif; padding-top: 3px; }
.shs.pop { animation: markpop .35s ease-out both; }
.shs.drop { animation: shdrop .5s var(--t, 0ms) both; }
@keyframes shdrop { 0% { transform: translateY(-36px); opacity: 0; } 35% { opacity: 1; } 65% { transform: translateY(0); } 80% { transform: translateY(-6px); } 100% { transform: none; } }
.shon { display: flex; gap: 3px; padding-bottom: 6px; }
.shon i { width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid rgba(0, 0, 0, .3); font: 400 12px 'Luckiest Guy', sans-serif; font-style: normal; display: grid; place-items: center; color: rgba(255, 255, 255, .3); padding-top: 2px; }
.shon i.on { border-color: var(--ink); } .shon i.on.X { background: var(--x); color: #fff; } .shon i.on.O { background: var(--o); color: var(--ink); }
.shon i.fillin { animation: pipfill .4s cubic-bezier(.3, 1.6, .5, 1) both; }
.tshelf { display: grid; gap: 1.4cqw; width: 52cqw; padding: 2cqw; background: #8a5a35; border-radius: 2.5cqw; }
.tshelf span { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.4cqw; padding-bottom: .8cqw; border-bottom: 1.4cqw solid #d9a46b; }
.tshelf i { height: 5.2cqw; border-radius: 1cqw; background: rgba(255, 255, 255, .2); } .tshelf i.X { background: var(--x); } .tshelf i.O { background: var(--o); } .tshelf i.G { background: #a3a3a3; }
/* Roads: dots and lines; a claimed line draws in, a blocked one is crossed; the longest roads glow */
.roads { flex: 1; display: flex; flex-direction: column; gap: 8px; justify-content: center; min-height: 0; }
.rmap { display: block; width: min(100%, 320px, calc(100dvh - 320px)); margin: 0 auto; background: var(--paper); border: 3px solid var(--ink); border-radius: 16px; }
.rseg, .rcase, .rglow { stroke-linecap: round; fill: none; }
.rseg.open { stroke: #b9ad94; stroke-width: 1.3; stroke-dasharray: 2.4 2.4; }
.rcase { stroke: var(--ink); stroke-width: 6; }
.rseg.X, .rseg.O { stroke-width: 3.8; } .rseg.X { stroke: var(--x); } .rseg.O { stroke: var(--o); }
.rseg.B { stroke: #9a9a9a; stroke-width: 2.4; }
.rx { stroke: #4d4d4d; stroke-width: 1.6; stroke-linecap: round; fill: none; }
.rseg.draw, .rcase.draw { stroke-dasharray: 1; animation: rdraw .35s ease-out both; }
@keyframes rdraw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
.rblk.drop { animation: appear .3s var(--t, 0ms) both; }
.rglow { stroke-width: 11; opacity: .4; } .rglow.X { stroke: var(--x); } .rglow.O { stroke: var(--o); }
.rglow[style] { animation: appear .35s var(--t, 0ms) both; }
.rdot { fill: var(--ink); }
.rhit { stroke: transparent; stroke-width: 12; cursor: pointer; }
.rhit:hover { stroke: rgba(22, 18, 16, .07); }
.troad { width: 62cqw; height: 62cqw; }
.troad line { stroke: #b3a68b; stroke-width: 2.6; stroke-linecap: round; } .troad line.X { stroke: var(--x); stroke-width: 8; } .troad line.O { stroke: var(--o); stroke-width: 8; } .troad line.B { stroke: #8d8d8d; stroke-width: 4; stroke-dasharray: 3 4; }
@media (prefers-reduced-motion: reduce) { .sgo { display: none; } }
@media (prefers-reduced-motion: reduce) { .rbar i.grow { animation: none; width: var(--w1, 0%); } }
/* Patterns: the sequence with its gap, then four options; a wrong one struck through (as Trivia), the right one drops into the gap */
.patterns { flex: 1; display: flex; flex-direction: column; min-height: 0; gap: 8px; justify-content: center; }
.patcard { background: var(--paper); border: 3px solid var(--ink); border-radius: 16px 12px 15px 11px; box-shadow: 0 4px 0 var(--ink); padding: 8px 10px 10px; }
.patcard small { display: block; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; margin-bottom: 6px; }
.pseq { display: grid; grid-template-columns: repeat(var(--n, 5), minmax(0, 1fr)); gap: 6px; }
.patit { aspect-ratio: 1; border: 2.5px solid var(--ink); border-radius: 10px; background: #fff; display: grid; place-items: center; min-width: 0; }
.patit svg, .popt svg { width: 100%; height: 100%; display: block; }
.patit.gap { border-style: dashed; background: var(--panel-2); }
.patit.gap b { font-family: 'Luckiest Guy', 'Arial Black', sans-serif; font-size: 26px; color: var(--muted); }

  tok.style.animation = 'none';                                    // the CSS pop is only the fallback
  tok.animate(frames, { duration: total, delay, fill: 'both' });
  const hit = f.type === 'bump' && f.bumped && app.querySelector('.gwrap .track .tok.knocked');
  if (hit) {                                                       // knocked back Home: a jolt, then a tumbling arc
    const [lx, ly] = spec.at(f.to - 1), hx = Number(hit.dataset.x), hy = Number(hit.dataset.y);
    hit.style.animation = 'none';
    hit.animate([
      { transform: `translate(${lx}px, ${ly}px) rotate(0deg) scale(1)`, offset: 0 },
      { transform: `translate(${lx + 2}px, ${ly - 2}px) rotate(-25deg) scale(1.25)`, offset: .18 },
      { transform: `translate(${(lx + hx) / 2}px, ${Math.min(ly, hy) - 9}px) rotate(-200deg) scale(1.1)`, offset: .6 },
      { transform: `translate(${hx}px, ${hy}px) rotate(-360deg) scale(1)`, offset: 1 },
    ], { duration: KNOCK_MS, delay: delay + hops * HOP_MS, fill: 'both', easing: 'ease-out' });
  }
}
