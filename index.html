<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0e1016">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Tiger-Tac-Toe</title>
<style>
:root {
  --bg: #0e1016;
  --panel: #181b26;
  --panel-2: #232737;
  --line: #2f3447;
  --text: #eef0f6;
  --muted: #9298ab;
  --x: #ff6b6b;
  --o: #4dabf7;
  --x-soft: rgba(255, 107, 107, .17);
  --o-soft: rgba(77, 171, 247, .17);
  --sea: #15395f;
  --sea-2: #1f4f84;
  --stone: #d9c7a6;
  --green: #5aa65b;
  --yellow: #c9a93d;
  --card: #f3eee4;
  --cr: #ef476f;
  --cy: #ffd166;
  --cg: #06d6a0;
  --cb: #4cc9f0;
  --hdr: 64px;
  --foot: 52px;
  --bar: 56px;
  --pad: 12px;
  --r: 14px;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
}
:root { color-scheme: dark; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  position: fixed; inset: 0; overflow: hidden;
  background: var(--bg); color: var(--text);
  font: 16px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  overscroll-behavior: none;
}
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:disabled { cursor: default; }
svg { display: block; }
b.X { color: var(--x); } b.O { color: var(--o); }
#app {
  height: 100vh; height: 100dvh;
  display: flex; flex-direction: column;
  padding: var(--sat) var(--sar) var(--sab) var(--sal);
}

/* ---------- header: whose turn ---------- */
.hdr {
  flex: none; height: var(--hdr);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px; border-bottom: 1px solid var(--line);
  transition: background .25s;
}
.hdr.t-X { background: linear-gradient(90deg, var(--x-soft), transparent 75%); }
.hdr.t-O { background: linear-gradient(90deg, var(--o-soft), transparent 75%); }
.turn { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 20px; }
.turn .g {
  width: 38px; height: 38px; border-radius: 10px;
  display: grid; place-items: center;
  font-size: 24px; font-weight: 900; color: var(--bg);
}
.t-X .turn { color: var(--x); } .t-X .turn .g { background: var(--x); }
.t-O .turn { color: var(--o); } .t-O .turn .g { background: var(--o); }
.score { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 15px; color: var(--muted); }
.score b { font-size: 17px; }

/* ---------- screens ---------- */
.scr {
  flex: 1; min-height: 0; position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: var(--pad);
  --vh: 100vh;
  --gw: calc(100vw - 2 * var(--pad) - var(--sal) - var(--sar));
}
@supports (height: 100dvh) { .scr { --vh: 100dvh; } }

/* ---------- main board ---------- */
.board-scr { --s: min(var(--gw), calc(var(--vh) - var(--hdr) - var(--foot) - 2 * var(--pad) - var(--sat) - var(--sab))); }
.board {
  width: var(--s); height: var(--s);
  display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 8px;
}
.sq {
  position: relative; border: 0; border-radius: var(--r); padding: 7px;
  background: var(--panel); box-shadow: inset 0 0 0 1px var(--line);
  display: flex; flex-direction: column; justify-content: space-between; gap: 4px;
  overflow: hidden; container-type: size; transition: transform .08s;
}
.sq:active:not(:disabled) { transform: scale(.96); }
.sq.last-X { box-shadow: inset 0 0 0 2px var(--x); }
.sq.last-O { box-shadow: inset 0 0 0 2px var(--o); }
.sq.own-X { background: var(--x-soft); box-shadow: inset 0 0 0 2px var(--x); }
.sq.own-O { background: var(--o-soft); box-shadow: inset 0 0 0 2px var(--o); }
.own-ov {
  position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none;
  font-weight: 900; line-height: 1; font-size: 56px; font-size: 64cqw; opacity: .55; text-shadow: 0 2px 14px rgba(0, 0, 0, .7);
}
.own-X .own-ov { color: var(--x); }
.own-O .own-ov { color: var(--o); }
.own-ov.stamp { animation: stamp .55s cubic-bezier(.2, 1.1, .4, 1) both; }
.tg.tmem i.up { background: var(--card); }
.tg.tmem i.up svg { width: 72%; height: 72%; }
.lab {
  display: flex; align-items: center; justify-content: center; gap: 4px;
  color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .03em; white-space: nowrap;
  font-size: 10px; font-size: clamp(8px, 9cqw, 13px);
}
.lab svg { width: 1.25em; height: 1.25em; flex: none; }
.thumb { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }

/* miniatures */
.tg { display: grid; gap: 2px; }
.tg.g3 { grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); width: 62px; height: 62px; width: 60cqw; height: 60cqw; }
.tg.g3 i { display: grid; place-items: center; border-radius: 3px; background: var(--panel-2); font-weight: 900; line-height: 1; font-size: 12px; font-size: 12cqw; }
.tg i.X { color: var(--x); }
.tg i.O { color: var(--o); }
.tg.g5 { grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(6, 1fr); width: 52px; height: 62px; width: 52cqw; height: 62cqw; }
.tg.g5 i { border-radius: 50%; background: var(--panel-2); }
.tg.g5 i.X { background: var(--x); }
.tg.g5 i.O { background: var(--o); }
.tg.sea i { background: var(--sea); }
.tg.sea i.miss::after { content: ''; width: 36%; height: 36%; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .55); }
.tw { display: flex; flex-direction: column; align-items: center; gap: 1.5cqw; }
.twr { display: flex; gap: 1.5cqw; }
.twr i { width: 11cqw; height: 11cqw; border-radius: 1.5cqw; background: var(--panel-2); box-shadow: inset 0 0 0 1px var(--line); display: grid; place-items: center; font-size: 7cqw; font-weight: 800; line-height: 1; }
.twr i.g { background: var(--green); box-shadow: none; color: #fff; }
.twr i.y { background: var(--yellow); box-shadow: none; color: #1a1a1a; }
.twr i.x { background: var(--line); box-shadow: none; color: var(--muted); }
.tw small, .thg small, .thilo small { font-size: 8cqw; color: var(--muted); font-weight: 700; line-height: 1.2; }
.thg { display: flex; flex-direction: column; align-items: center; gap: 3cqw; }
.thg .hw { display: flex; gap: 1.2cqw; --tw: min(12cqw, calc(82cqw / var(--n))); }
.thg .hw i { width: var(--tw); height: calc(var(--tw) * 1.25); border-bottom: 2px solid var(--muted); display: grid; place-items: center; font-weight: 800; font-size: calc(var(--tw) * .75); line-height: 1; }
.thg .hw i.on { border-color: var(--text); }
.thex { display: flex; flex-direction: column; gap: 1cqw; }
.thex .hr { display: flex; gap: 1cqw; margin-left: calc(var(--k) * 5.5cqw); }
.thex .hr i { width: 10cqw; height: 10cqw; border-radius: 50%; background: var(--panel-2); }
.thex .hr i.X { background: var(--x); }
.thex .hr i.O { background: var(--o); }
.thumb .track { width: 86cqw; }
.thilo { text-align: center; }
.thilo b { display: block; font-size: 16cqw; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tdice { display: flex; flex-direction: column; gap: 4cqw; width: 84cqw; }
.tdice .tr { display: grid; grid-template-columns: 9cqw 1fr 12cqw; gap: 2cqw; align-items: center; font-weight: 800; font-size: 9cqw; line-height: 1; }
.tdice .tr span { text-align: right; font-variant-numeric: tabular-nums; }
.tdice .bar { height: 6cqw; border-radius: 99px; background: var(--panel-2); overflow: hidden; }
.tdice .bar i { display: block; height: 100%; }
.tdice .X .bar i { background: var(--x); }
.tdice .O .bar i { background: var(--o); }
/* the winding tracks (Candy race, Dice race) */
.track { display: block; width: 100%; height: auto; overflow: visible; }
.track .path { fill: none; stroke: #343a4f; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
.track .arrow { fill: none; stroke: rgba(255, 255, 255, .6); stroke-width: .9; stroke-linecap: round; stroke-linejoin: round; }
.track .space.red { fill: var(--cr); } .track .space.yellow { fill: var(--cy); } .track .space.green { fill: var(--cg); } .track .space.blue { fill: var(--cb); }
.track .space.plain { fill: var(--panel-2); stroke: #3a4058; stroke-width: .5; }
.track .num { font-size: 2.6px; font-weight: 800; fill: rgba(0, 0, 0, .45); }
.track .numc { font-size: 3.8px; font-weight: 800; fill: var(--muted); text-anchor: middle; dominant-baseline: central; }
.track .pill { fill: #1d2130; stroke: #3a4058; stroke-width: .6; }
.track .lbl { font-size: 2.5px; font-weight: 800; letter-spacing: .25px; fill: #fff; text-anchor: middle; dominant-baseline: central; }
.track .tok { transform-box: fill-box; transform-origin: center; }
.track .tok circle { stroke: rgba(0, 0, 0, .6); stroke-width: .7; }
.track .tok.X circle { fill: var(--x); } .track .tok.O circle { fill: var(--o); }
.track .tok text { fill: #fff; font-weight: 900; font-size: 4.2px; text-anchor: middle; dominant-baseline: central; }
.track.small .tok text { font-size: 5.4px; }
.track .tok.moved { animation: pop .3s 1s both; }   /* fallback only: with the Web Animations API the piece hops instead */
.tg.tmem i { background: repeating-linear-gradient(45deg, #2a2f44 0 3px, #232737 3px 6px); color: var(--muted); font-size: 9cqw; }
.tcoin { display: flex; gap: 1.5cqw; }
.tcoin i { width: 12cqw; height: 12cqw; border-radius: 50%; display: grid; place-items: center; font-size: 8cqw; font-weight: 900; line-height: 1; color: var(--bg); }
.tcoin i.X { background: var(--x); }
.tcoin i.O { background: var(--o); }
.tg.g5x5 { grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(5, 1fr); width: 62px; height: 62px; width: 62cqw; height: 62cqw; gap: 1.5cqw; }
.tg.g5x5 i { display: grid; place-items: center; border-radius: 1.5cqw; background: var(--panel-2); font-size: 7cqw; font-weight: 800; line-height: 1; }
.tg.g5x5 i svg { width: 80%; height: 80%; }

.foot {
  flex: none; height: var(--foot); width: 100%; max-width: 560px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.hint { color: var(--muted); font-size: 13px; font-weight: 600; }
.link { border: 0; border-radius: 10px; height: 36px; padding: 0 12px; background: var(--panel-2); font-weight: 700; font-size: 13px; flex: none; }

/* ---------- zoomed mini-game ---------- */
.mini {
  --gh: calc(var(--vh) - var(--hdr) - var(--bar) - 2 * var(--pad) - var(--sat) - var(--sab));
  --g: min(var(--gw), var(--gh));
}
.mini.enter { animation: zoomin .18s ease-out; }   /* only on the way in from the board, not on every re-render */
.bar { flex: none; height: var(--bar); width: 100%; display: flex; align-items: center; gap: 12px; }
.bar.won { border-radius: 14px; padding: 0 12px 0 6px; }
.bar.won-X { background: var(--x-soft); }
.bar.won-O { background: var(--o-soft); }
.ttl small.won { color: var(--text); }
.back {
  flex: none; height: 44px; padding: 0 14px 0 10px; border: 0; border-radius: 12px;
  background: var(--panel-2); font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 2px;
}
.back:disabled { opacity: .35; }
.back svg { width: 20px; height: 20px; }
.ttl { min-width: 0; flex: 1; }
.ttl > b { display: block; font-size: 17px; }
.ttl small { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; color: var(--muted); font-size: 12px; font-weight: 600; line-height: 1.25; }
.gwrap { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }

.g-ttt, .g-bs {
  width: var(--g); height: var(--g);
  display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 10px;
}
.cell {
  position: relative; overflow: hidden; border: 0; border-radius: 16px; padding: 0; background: var(--panel-2);
  display: grid; place-items: center; font-weight: 900; line-height: 1;
  font-size: calc(var(--g) * .22); transition: transform .08s;
}
.cell .mk { display: block; }
.cell.pop .mk { animation: markpop .4s ease-out both; }
.cell:active:not(:disabled) { transform: scale(.95); }
.cell.X { color: var(--x); }
.cell.O { color: var(--o); }
.cell.win.X { background: var(--x-soft); box-shadow: inset 0 0 0 3px var(--x); }
.cell.win.O { background: var(--o-soft); box-shadow: inset 0 0 0 3px var(--o); }
.cell.win.lit { animation: winbg .3s .35s ease-out both; }
.g-ttt { position: relative; }
.winline { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.winline line { stroke-width: 4; stroke-linecap: round; stroke-dasharray: 160; stroke-dashoffset: 0; }
.winline line.X { stroke: var(--x); } .winline line.O { stroke: var(--o); }
.winline.draw line { animation: draw .45s .4s ease-out both; }

.cell.sea { background: radial-gradient(circle at 30% 30%, var(--sea-2), var(--sea)); }
.cell.sea::after { content: ''; width: 16%; height: 16%; border-radius: 50%; background: rgba(255, 255, 255, .08); }
.cell.miss { background: var(--panel-2); }
.cell.miss::after { width: 26%; height: 26%; border: 3px solid rgba(255, 255, 255, .5); background: transparent; }
.cell.hit::after { display: none; }
.cell.hit svg { width: 62%; height: 62%; }
.cell.hit.X { background: var(--x-soft); box-shadow: inset 0 0 0 3px var(--x); color: var(--x); }
.cell.hit.O { background: var(--o-soft); box-shadow: inset 0 0 0 3px var(--o); color: var(--o); }
/* a battleship cell flips over: sea on the front, the result on the back; then a splash or a burst */
.cell.miss { --fb: var(--panel-2); --fs: none; }
.cell.hit.X { --fb: var(--x-soft); --fs: inset 0 0 0 3px var(--x); }
.cell.hit.O { --fb: var(--o-soft); --fs: inset 0 0 0 3px var(--o); }
.cell.flipin { animation: flipcell .5s ease-in-out both; }
.cell.flipin::after { animation: halfshow .5s linear both; }
.cell.flipin svg { animation: pop .4s .5s ease-out both; }
.cell.flipin::before { content: ''; position: absolute; left: 30%; top: 30%; width: 40%; height: 40%; border-radius: 50%; pointer-events: none; }
.cell.miss.flipin::before { border: 3px solid rgba(255, 255, 255, .7); animation: splash .55s .5s ease-out both; }
.cell.hit.flipin::before { background: radial-gradient(circle, currentColor 0, transparent 70%); animation: burst .65s .5s ease-out both; }

.g-c4 {
  --cw: min(var(--gw), calc(var(--gh) * 5 / 6));
  width: var(--cw); height: calc(var(--cw) * 6 / 5);
  display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(6, 1fr); gap: 6px;
  padding: 8px; background: var(--panel); border-radius: 16px;
}
.c4c { border: 0; padding: 0; border-radius: 50%; background: var(--panel-2); }
.c4c.X { background: var(--x); }
.c4c.O { background: var(--o); }
.c4c.win { box-shadow: inset 0 0 0 4px rgba(255, 255, 255, .85); }
.c4c.drop { animation: drop .55s linear both; }
.c4c.win.lit { animation: c4win .5s ease-out both; animation-delay: calc(.55s + var(--k, 0) * .08s); }
.c4c.drop.win.lit { animation: drop .55s linear both, c4win .5s ease-out both; animation-delay: 0s, calc(.55s + var(--k, 0) * .08s); }

/* on-screen keyboard (Wordle, Hangman) */
.kb { flex: none; width: 100%; display: flex; flex-direction: column; gap: 6px; }
.krow { display: flex; justify-content: center; gap: 4px; }
.key {
  position: relative; flex: none; width: calc((100% - 9 * 4px) / 10); min-width: 0; height: 46px; padding: 0;
  border: 0; border-radius: 8px; background: var(--panel-2);
  display: grid; place-items: center; font-weight: 800; font-size: 15px;
}
.key.wide { width: calc((100% - 9 * 4px) / 10 * 1.5 + 2px); font-size: 12px; }
.key svg { width: 22px; height: 22px; }
.key.g, .key.hit { background: var(--green); color: #fff; }
.key.y { background: var(--yellow); color: #1a1a1a; }
.key.x, .key.miss { background: var(--line); color: var(--muted); }
.key:disabled:not(.hit):not(.miss):not(.g):not(.y):not(.x) { opacity: .4; }
.key:active:not(:disabled) { transform: scale(.94); }
.key.miss::after { content: ''; position: absolute; left: 22%; right: 22%; top: 50%; height: 3px; margin-top: -1px; border-radius: 2px; background: var(--x); opacity: .9; }
.key.shake { animation: shake .4s; }
.key.shake::after { animation: strike .25s .35s ease-out both; }
.key.kc { animation: keycolor .25s 1.1s ease-out both; }

.g-wordle { width: min(var(--gw), 520px); height: var(--gh); display: flex; flex-direction: column; gap: 10px; --tile: min(52px, calc((var(--gw) - 40px) / 5)); }
.wlist { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; align-items: center; padding: 4px 0; }
.wlist > :first-child { margin-top: auto; }
.wrow { display: flex; gap: 5px; flex: none; }
.wrow.cur { justify-content: center; }
.wt {
  width: var(--tile); height: var(--tile); display: grid; place-items: center; border-radius: 6px;
  background: var(--panel-2); box-shadow: inset 0 0 0 2px var(--line);
  font-weight: 800; font-size: calc(var(--tile) * .5); line-height: 1;
}
.wt.g { --wbg: var(--green); --wfg: #fff; }
.wt.y { --wbg: var(--yellow); --wfg: #1a1a1a; }
.wt.x { --wbg: var(--line); --wfg: var(--muted); }
.wt.g, .wt.y, .wt.x { background: var(--wbg); box-shadow: none; color: var(--wfg); }
.wt.reveal { animation: wflip .42s ease-in-out both; animation-delay: calc(var(--k, 0) * .18s); }
.wt.typed { box-shadow: inset 0 0 0 2px var(--muted); }
.empty { color: var(--muted); font-weight: 600; text-align: center; padding: 10px; }

.g-hang { width: min(var(--gw), 520px); height: var(--gh); display: flex; flex-direction: column; gap: 14px; --htile: min(50px, calc((var(--gw) - 48px) / 7)); }
.hword { flex: 1; min-height: 0; display: flex; gap: 6px; justify-content: center; align-items: center; }
.ht {
  width: var(--htile); height: calc(var(--htile) * 1.2); display: grid; place-items: center;
  border-bottom: 3px solid var(--muted); font-weight: 800; font-size: calc(var(--htile) * .62); line-height: 1;
}
.ht.on { border-color: var(--text); }
.ht.flipin { animation: tflip .45s ease-out both; animation-delay: calc(var(--k, 0) * .1s); }
.hmiss { text-align: center; color: var(--muted); font-weight: 700; min-height: 20px; }
.hmiss b { color: var(--text); letter-spacing: .25em; }
.hmiss i { font-style: normal; text-decoration: line-through; text-decoration-color: var(--x); text-decoration-thickness: 2px; }
.hmiss i.new { display: inline-block; animation: shake .4s, pop .3s both; }

.big { height: 64px; border: 0; border-radius: 16px; font-weight: 800; font-size: 20px; background: var(--panel-2); transition: transform .08s; }
.big.X { background: var(--x); color: var(--bg); }
.big.O { background: var(--o); color: var(--bg); }
.big:active:not(:disabled) { transform: scale(.97); }
.big:disabled { opacity: .5; }

.g-hex { width: var(--g); display: flex; flex-direction: column; align-items: center; gap: 8px; --hw: calc((var(--g) * .86 - 10px) / 5.5); --hh: calc(var(--hw) * 1.1547); }
.hexmid { display: flex; align-items: stretch; gap: 8px; }
.hexgoal { display: grid; place-items: center; font-weight: 900; font-size: 14px; border-radius: 999px; }
.hexgoal.O { width: calc(var(--g) * .86); height: 22px; background: var(--o-soft); color: var(--o); }
.hexgoal.X { width: 22px; background: var(--x-soft); color: var(--x); }
.hexboard { display: flex; flex-direction: column; }
.hrow { display: flex; gap: 2px; margin-left: calc(var(--r) * (var(--hw) + 2px) / 2); }
.hrow + .hrow { margin-top: calc(var(--hh) * -.25 + 2px); }
.hexc {
  width: var(--hw); height: var(--hh); border: 0; padding: 0; background: var(--panel-2);
  clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); display: grid; place-items: center;
}
.hexc.X { background: var(--x); }
.hexc.O { background: var(--o); }
.hexc.win { filter: brightness(1.25); }
.hexc.win::after { content: ''; width: 30%; height: 30%; border-radius: 50%; background: rgba(255, 255, 255, .9); }
.hexc.fill { animation: hexfill .4s ease-out both; }
.hexc.win.lit { animation: hexlit .45s ease-out both; animation-delay: calc(.4s + var(--k, 0) * .09s); }
.hexc.fill.win.lit { animation: hexfill .4s ease-out both, hexlit .45s ease-out both; animation-delay: 0s, calc(.4s + var(--k, 0) * .09s); }
.hexc.win.lit::after { animation: pop .3s ease-out both; animation-delay: calc(.4s + var(--k, 0) * .09s); }

/* ---------- main menu ---------- */
.menu-card { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 14px; text-align: center; animation: pop .25s ease-out; }
.menu-card h1 { margin: 0 0 4px; font-size: 36px; line-height: 1.1; }
.menu-card .sub { margin: 0 0 10px; color: var(--muted); font-weight: 600; font-size: 15px; }
.primary.alt { background: var(--panel-2); color: var(--text); }

/* ---------- online play ---------- */
.link.wide { width: 100%; height: 44px; font-size: 15px; }
.room { background: var(--panel); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.room small { color: var(--muted); font-weight: 800; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
.room .code { font-size: 44px; font-weight: 900; letter-spacing: .18em; line-height: 1.1; font-variant-numeric: tabular-nums; padding-left: .18em; }
.room .row { display: flex; gap: 10px; }
.status { color: var(--muted); font-weight: 700; font-size: 14px; min-height: 18px; }
.status.ok { color: var(--text); }
.status.bad, .status .bad { color: var(--x); }
.namebox { height: 48px; padding: 0 12px; border-radius: 12px; border: 2px dashed var(--line); display: flex; align-items: center; font-weight: 700; font-size: 17px; }
.namebox i { color: var(--muted); font-style: normal; font-weight: 600; font-size: 14px; }
.codein { text-transform: uppercase; letter-spacing: .25em; font-size: 22px !important; font-weight: 900 !important; }
.netbar {
  position: absolute; top: 6px; left: var(--pad); right: var(--pad); z-index: 6;
  display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap;
  padding: 8px 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line);
  font-weight: 700; font-size: 13px; box-shadow: 0 8px 24px rgba(0, 0, 0, .4); animation: pop .2s ease-out;
}
.netbar.lost, .netbar.connecting { border-color: var(--yellow); }
.netbar.error, .netbar.left { border-color: var(--x); }
.netbar .btn { height: 34px; padding: 0 12px; font-size: 13px; }

/* ---------- setup screen ---------- */
.setup { justify-content: flex-start; gap: 10px; }
.setup .bar { max-width: 520px; }
.setup-box { width: 100%; max-width: 520px; flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding: 4px 0; }
.adv { border-radius: 12px; }
.adv-h { width: 100%; height: 48px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border: 0; border-radius: 12px; background: var(--panel-2); box-shadow: inset 0 0 0 1px var(--line); font-weight: 800; font-size: 14px; color: var(--text); }
.adv-h small { flex: 1; text-align: right; color: var(--muted); font-weight: 700; font-size: 12px; }
.adv-h .chev { display: block; width: 20px; height: 20px; transform: rotate(180deg); transition: transform .2s; }
.adv-h .chev svg { width: 20px; height: 20px; }
.adv.open .adv-h .chev { transform: rotate(270deg); }
.adv .games { padding-top: 10px; }
.modes, .sides { display: flex; gap: 8px; align-items: center; }
.sides > span { flex: none; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.seg { flex: 1; min-width: 0; height: 44px; padding: 0 8px; border: 0; border-radius: 12px; background: var(--panel-2); box-shadow: inset 0 0 0 1px var(--line); font-weight: 700; font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg.on { background: var(--text); color: var(--bg); box-shadow: none; }
.seg.X.on { background: var(--x); } .seg.O.on { background: var(--o); }
.names { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field span { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.field.X span { color: var(--x); }
.field.O span { color: var(--o); }
.field input {
  width: 100%; min-width: 0; height: 48px; padding: 0 12px; border-radius: 12px;
  border: 2px solid var(--line); background: var(--panel-2); color: var(--text);
  font: inherit; font-size: 17px; font-weight: 700; user-select: text; -webkit-user-select: text;
}
.field input:focus { outline: none; border-color: var(--muted); }
.field.X input:focus { border-color: var(--x); }
.field.O input:focus { border-color: var(--o); }
.games-h { display: flex; justify-content: space-between; align-items: baseline; font-weight: 800; font-size: 15px; }
.games-h small { color: var(--muted); font-weight: 700; font-size: 12px; }
.games { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.chk {
  display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 12px; border-radius: 12px;
  background: var(--panel-2); box-shadow: inset 0 0 0 1px var(--line); font-weight: 700; font-size: 14px; cursor: pointer; min-width: 0;
}
.chk input { width: 20px; height: 20px; margin: 0; flex: none; accent-color: var(--o); }
.chk svg { width: 18px; height: 18px; flex: none; color: var(--muted); }
.chk span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chk.off { opacity: .55; }
@media (max-width: 359px) {
  .chk { font-size: 13px; padding: 0 10px; gap: 8px; }
  .chk svg { display: none; }
}
.setup-foot { flex: none; width: 100%; max-width: 520px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.setup-foot .primary { width: 100%; }
.primary:disabled { opacity: .35; }
.warn { color: var(--x); font-weight: 700; font-size: 13px; min-height: 16px; }
.turn .who { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 48vw; }
.notice { align-self: center; flex: none; background: var(--text); color: var(--bg); font-weight: 800; font-size: 14px; padding: 6px 14px; border-radius: 999px; animation: pop .15s; }
.wrow.cur.shake { animation: shake .4s; }

.g-coins { width: var(--g); display: flex; flex-direction: column; gap: 18px; }
.coins { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.coin {
  aspect-ratio: 1; border: 0; padding: 0; border-radius: 50%; display: grid; place-items: center;
  font-weight: 900; font-size: calc(var(--g) * .085); line-height: 1; color: var(--bg);
  box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .25), 0 3px 6px rgba(0, 0, 0, .4);
}
.coin.X { background: var(--x); }
.coin.O { background: var(--o); }
.coin.flip { animation: coinflip 1s cubic-bezier(.3, .7, .3, 1) both; animation-delay: calc(var(--k, 0) * .08s); }
.coin.flip b { animation: lateshow 1s linear both; animation-delay: calc(var(--k, 0) * .08s); }

.g-pig { width: var(--g); display: flex; flex-direction: column; gap: 12px; }
.pigscores { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pscore { background: var(--panel); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.pscore .nm { font-weight: 800; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pscore .val { font-size: 26px; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
.pscore .val small { font-size: 13px; color: var(--muted); font-weight: 700; }
.pscore .bar { height: 8px; border-radius: 999px; background: var(--panel-2); overflow: hidden; }
.pscore .bar i { display: block; height: 100%; border-radius: 999px; }
.pscore.X .bar i { background: var(--x); }
.pscore.O .bar i { background: var(--o); }
.pscore.now { box-shadow: inset 0 0 0 2px currentColor; }
.pscore.X.now { color: var(--x); }
.pscore.O.now { color: var(--o); }
.pscore.now .val, .pscore.now .nm { color: var(--text); }
.pigturn { background: var(--panel); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.faces { display: flex; gap: 6px; }
.face { width: 38px; height: 38px; border-radius: 9px; background: var(--panel-2); display: grid; place-items: center; font-weight: 800; font-size: 16px; color: var(--muted); font-variant-numeric: tabular-nums; }
.face.hit { background: rgba(255, 107, 107, .22); color: var(--x); box-shadow: inset 0 0 0 2px var(--x); }
.pot { font-weight: 800; font-size: 18px; }
.pot span { color: var(--muted); font-weight: 700; font-size: 14px; }
.pigbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.big.bank { background: var(--text); color: var(--bg); }
.die.roll { animation: dieroll .6s ease-out both; }
.die.roll svg { animation: appear .6s step-end both; }
.face.fresh { animation: facehit .3s .6s ease-out both; }
.face.again { animation: shake .4s .6s both; }
.pigturn.bust { animation: bustflash .7s .65s both; }
.pot.slide-X, .pot.slide-O { animation: potslide .6s .3s ease-in both; }
.pot.slide-X { --sx: -38%; } .pot.slide-O { --sx: 38%; }
.pscore.gain .bar i { animation: fill .5s .4s ease-out both; }

.g-hunt { --hg: min(var(--gw), calc(var(--gh) - 30px)); width: var(--hg); display: flex; flex-direction: column; gap: 10px; }
.hgrid { width: var(--hg); height: var(--hg); display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(5, 1fr); gap: 6px; }
.dig { border: 0; padding: 0; border-radius: 10px; background: var(--panel-2); display: grid; place-items: center; font-weight: 900; font-size: calc(var(--g) * .07); line-height: 1; }
.dig.found svg { width: 60%; height: 60%; }
.dig.open { animation: digopen .7s ease-out both; }
.dig.open > span, .dig.open svg { animation: pop .35s .45s ease-out both; }
.dig.found.open svg { animation: pop .35s .45s ease-out both, sparkle .45s .85s ease-in-out 2 alternate; }
.dig.found.open::after { content: '✦'; position: absolute; top: 6%; right: 10%; color: #fff; font-size: 45%; animation: twinkle .4s .9s ease-in-out 3 alternate both; }
.heat { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: var(--muted); }
.heat i { flex: 1; height: 8px; border-radius: 999px; background: linear-gradient(90deg, #ff4d4d, #ffb627, #7fd36b, #4aa3e0, #3b6fd6); }
.g-candy { width: var(--g); display: flex; flex-direction: column; gap: 10px; }
.wheelwrap { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.pointer { width: 0; height: 0; border-left: 9px solid transparent; border-right: 9px solid transparent; border-top: 14px solid var(--text); }
.wheel {
  width: min(120px, calc(var(--g) * .3)); aspect-ratio: 1; border-radius: 50%; border: 4px solid var(--text);
  background: conic-gradient(var(--cr) 0 90deg, var(--cy) 90deg 180deg, var(--cg) 180deg 270deg, var(--cb) 270deg 360deg);
  transform: rotate(var(--to, 0deg)); box-shadow: 0 6px 16px rgba(0, 0, 0, .4);
}
.wheel.spin { animation: spin 1s cubic-bezier(.15, .75, .25, 1) both; }
.wheelwrap .dielab { margin-top: 6px; }
.wheelwrap .dielab.late { animation-delay: 1s; }
/* the result overlay stays invisible until the move's animation is over */
.flash.late, .flash.late .card, .flash.late .toast, .flash.late .big-g { animation-delay: var(--late, 0s); animation-fill-mode: both; }
.big-g.bang { animation: bang .45s cubic-bezier(.2, 1.1, .4, 1) both; }

.g-hilo { width: var(--g); display: flex; flex-direction: column; gap: 14px; }
.range { background: var(--panel); border-radius: 16px; padding: 14px; text-align: center; }
.range small { display: block; color: var(--muted); font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
.range b { font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; }
.range span { color: var(--muted); font-weight: 700; margin: 0 10px; }
.rbar { position: relative; height: 10px; margin-top: 12px; border-radius: 999px; background: var(--panel-2); overflow: hidden; }
.rbar .seg { position: absolute; top: 0; bottom: 0; left: var(--l); width: var(--w); border-radius: 999px; background: var(--text); }
.rbar .seg.shrink { animation: shrink .6s .45s ease-out both; }
.hist { color: var(--muted); font-weight: 600; font-size: 14px; text-align: center; min-height: 18px; }
.guess { display: flex; justify-content: center; align-items: center; gap: 6px; min-height: 18px; color: var(--muted); font-weight: 700; font-size: 15px; }
.guess .n { color: var(--text); font-size: 20px; }
.guess.fresh { animation: pop .3s ease-out both; }
.arrow { display: inline-block; font-size: 18px; line-height: 1; }
.arrow.up, .arrow.yes { color: var(--green); } .arrow.dn { color: var(--x); }
.guess.fresh .arrow.up { animation: bobup .5s .3s ease-in-out 2; }
.guess.fresh .arrow.dn { animation: bobdn .5s .3s ease-in-out 2; }
.pad button.out { animation: fadeout .4s .45s ease-out both; }
.pad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.pad button { height: 52px; border: 0; border-radius: 12px; background: var(--panel-2); font-weight: 800; font-size: 18px; font-variant-numeric: tabular-nums; }
.pad button:disabled { opacity: .25; }
.pad button.X { box-shadow: inset 0 0 0 2px var(--x); opacity: .6; }
.pad button.O { box-shadow: inset 0 0 0 2px var(--o); opacity: .6; }

.g-dice { width: var(--g); display: flex; flex-direction: column; gap: 14px; }
.dielab.late { animation: appear .2s .6s both; }
.dieWrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.die { width: 92px; height: 92px; border-radius: 20px; background: var(--card); display: grid; place-items: center; box-shadow: 0 6px 16px rgba(0, 0, 0, .4); }
.die svg { width: 78%; height: 78%; }
.die .q { font-size: 40px; font-weight: 900; color: #8a8378; }
.dielab { color: var(--muted); font-weight: 700; }

.g-mem { width: var(--g); height: var(--g); display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 10px; }
.mc { position: relative; border: 0; padding: 0; border-radius: 16px; background: transparent; perspective: 700px; }
.mc .in { position: absolute; inset: 0; border-radius: 16px; transform-style: preserve-3d; }
.mc .bk, .mc .ft { position: absolute; inset: 0; border-radius: 16px; display: grid; place-items: center; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.mc .bk { background: repeating-linear-gradient(45deg, #2a2f44 0 8px, #232737 8px 16px); box-shadow: inset 0 0 0 2px var(--line); color: var(--muted); font-weight: 900; font-size: calc(var(--g) * .1); }
.mc .ft { background: var(--card); transform: rotateY(180deg); }
.mc .ft svg { width: 60%; height: 60%; }
.mc.up .in { transform: rotateY(180deg); }
.mc.pick .bk, .mc.pick .ft { box-shadow: inset 0 0 0 3px var(--text); }
.mc.win .ft { box-shadow: inset 0 0 0 4px var(--green); }
.mc.win.glow .ft { animation: glow .45s .5s ease-in-out 4 alternate; }
.mc.flipup .in { animation: flipup .45s ease-in-out both; }
.mc.flipdown .in { animation: flipdown .45s ease-in-out both; }

/* ---------- move result overlay ---------- */
.flash {
  position: absolute; inset: 0; z-index: 5; padding: 24px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(14, 16, 22, .6); animation: fade .15s;
}
.flash.lite { align-items: flex-end; background: transparent; padding-bottom: 28px; }
.card {
  max-width: 92%; padding: 22px 26px; text-align: center;
  background: var(--panel); border: 1px solid var(--line); border-radius: 22px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, .55); animation: pop .2s ease-out;
}
.big-g { font-size: 76px; font-weight: 900; line-height: 1; }
.big-g.X { color: var(--x); }
.big-g.O { color: var(--o); }
.big-g svg { width: 76px; height: 76px; margin: 0 auto; color: var(--muted); }
.card .big-g > svg[fill="#1a1a1a"] { background: var(--card); border-radius: 18px; padding: 8px; }
.card h2 { margin: 10px 0 6px; font-size: 22px; }
.card p { margin: 0; color: var(--muted); font-weight: 600; font-size: 15px; }
.card .row { display: flex; gap: 10px; justify-content: center; margin-top: 18px; }
.btn { height: 48px; padding: 0 18px; border: 0; border-radius: 12px; background: var(--panel-2); font-weight: 800; font-size: 15px; }
.btn.go { background: var(--text); color: var(--bg); }
.btn:active { transform: scale(.96); }
.toast {
  padding: 12px 20px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
  font-weight: 700; font-size: 15px; box-shadow: 0 10px 30px rgba(0, 0, 0, .5); animation: pop .15s ease-out;
}

/* ---------- win screen ---------- */
.win-card { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; animation: pop .25s ease-out; }
.win-card .row { display: flex; gap: 10px; align-items: center; margin-top: 6px; }
.win-card h1 { margin: 0; font-size: 30px; }
.win-card p { margin: 0; color: var(--muted); font-weight: 600; font-size: 16px; }
.final { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: min(228px, 56vw); margin: 6px 0; }
.final i {
  aspect-ratio: 1; border-radius: 10px; background: var(--panel-2);
  display: grid; place-items: center; font-weight: 900; font-size: 28px;
}
.final i.X { color: var(--x); background: var(--x-soft); }
.final i.O { color: var(--o); background: var(--o-soft); }
.final i.hl { box-shadow: inset 0 0 0 3px currentColor; }
.primary {
  height: 58px; padding: 0 30px; border: 0; border-radius: 16px;
  background: var(--text); color: var(--bg); font-weight: 800; font-size: 18px;
}
.primary:active { transform: scale(.97); }

@keyframes pop { from { transform: scale(.85); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }
@keyframes markpop { 0% { transform: scale(.2); opacity: 0; } 60% { transform: scale(1.18); opacity: 1; } 100% { transform: scale(1); } }
@keyframes winbg { from { background: var(--panel-2); box-shadow: none; } }
@keyframes draw { from { stroke-dashoffset: 160; } }
@keyframes drop {
  0% { transform: translateY(calc(var(--fall, 1) * (-100% - 6px))); animation-timing-function: ease-in; }
  62% { transform: translateY(0); animation-timing-function: ease-out; }
  78% { transform: translateY(-14%); animation-timing-function: ease-in; }
  92%, 100% { transform: translateY(0); }
}
@keyframes c4win { 0% { box-shadow: inset 0 0 0 0 rgba(255, 255, 255, 0); transform: scale(1); } 50% { box-shadow: inset 0 0 0 5px #fff, 0 0 14px #fff; transform: scale(1.15); } 100% { box-shadow: inset 0 0 0 4px rgba(255, 255, 255, .85); transform: scale(1); } }
@keyframes flipcell {
  0% { transform: rotateY(0); background: radial-gradient(circle at 30% 30%, var(--sea-2), var(--sea)); box-shadow: none; }
  50% { transform: rotateY(90deg); background: radial-gradient(circle at 30% 30%, var(--sea-2), var(--sea)); box-shadow: none; }
  50.1% { transform: rotateY(-90deg); background: var(--fb); box-shadow: var(--fs); }
  100% { transform: rotateY(0); background: var(--fb); box-shadow: var(--fs); }
}
@keyframes halfshow { 0%, 50% { opacity: 0; } 50.1%, 100% { opacity: 1; } }
@keyframes splash { from { transform: scale(.4); opacity: 1; } to { transform: scale(2.8); opacity: 0; } }
@keyframes burst { from { transform: scale(.3); opacity: 1; } to { transform: scale(3.2); opacity: 0; } }
@keyframes wflip {
  0% { transform: rotateX(0); background: var(--panel-2); box-shadow: inset 0 0 0 2px var(--line); color: var(--text); }
  50% { transform: rotateX(90deg); background: var(--panel-2); box-shadow: inset 0 0 0 2px var(--line); color: var(--text); }
  50.1% { transform: rotateX(-90deg); background: var(--wbg); box-shadow: none; color: var(--wfg); }
  100% { transform: rotateX(0); background: var(--wbg); box-shadow: none; color: var(--wfg); }
}
@keyframes keycolor { from { background: var(--panel-2); color: var(--text); } }
@keyframes strike { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes tflip { 0% { transform: rotateX(90deg); opacity: 0; } 60% { transform: rotateX(-15deg); opacity: 1; } 100% { transform: rotateX(0); } }
@keyframes hexfill { 0% { transform: scale(.25); } 70% { transform: scale(1.1); } 100% { transform: scale(1); } }
@keyframes hexlit { 0% { filter: brightness(1); } 50% { filter: brightness(1.9); } 100% { filter: brightness(1.25); } }
@keyframes shrink { from { left: var(--pl); width: var(--pw); } }
@keyframes bobup { 50% { transform: translateY(-7px); } }
@keyframes bobdn { 50% { transform: translateY(7px); } }
@keyframes fadeout { from { opacity: 1; } to { opacity: .25; } }
@keyframes fill { from { width: var(--pw, 0%); } }
@keyframes glow { from { box-shadow: inset 0 0 0 4px var(--green); } to { box-shadow: inset 0 0 0 6px var(--green), 0 0 18px var(--green); } }
@keyframes flipup { from { transform: rotateY(0); } to { transform: rotateY(180deg); } }
@keyframes flipdown { from { transform: rotateY(180deg); } to { transform: rotateY(0); } }
@keyframes lateshow { 0%, 84% { opacity: 0; } 85%, 100% { opacity: 1; } }
@keyframes facehit { from { background: var(--panel-2); color: var(--muted); box-shadow: none; } }

  const view = state.screen + ':' + state.zoom;
  entering = view !== lastView; lastView = view;

// How long the move's animation takes. The result toast or card waits this long, and so does any tap.
function animMs(f) {
  if (REDUCED) return 0;
  const won = f.kind === 'claim' || f.kind === 'match';
  switch (f.type) {
    case 'ttt':     return won ? 950 : 450;
    case 'c4':      return won ? 1150 : 600;
    case 'bs':      return won ? 1200 : 1100;
    case 'wordle':  return 1200;
    case 'hangman': return 650;
    case 'hex':     return won ? 900 + hexLen(f) * 90 : 450;
    case 'hilo':    return 1100;
    case 'dice':    return DIE_MS + Math.max(1, diceSlot(f.total) - diceSlot(f.total - f.roll)) * HOP_MS + 250;
    case 'memory':  return 500;
    case 'candy':   return SPIN_MS + Math.max(1, f.to - f.from) * HOP_MS + 250;
    case 'coins':   return 1050 + (f.n - 1) * 80;
    case 'pig':     return f.note === 'bank' ? 1000 : f.note === 'bust' ? 1350 : 1050;
    case 'hunt':    return won ? 1400 : 800;
  }
  return 500;
}
function hexLen(f) { const sq = state.squares[f.square]; return sq && sq.mini.winCells ? sq.mini.winCells.length : 4; }
// The JS-driven bits of the animations: numbers that count up or down, and the candy token's hops.
function animate() {
  if (!state.flash) return;
  for (const el of app.querySelectorAll('.cnt[data-from]')) {
    countTo(el, Number(el.dataset.from), Number('to' in el.dataset ? el.dataset.to : el.textContent), Number(el.dataset.ms) || 400, Number(el.dataset.delay) || 0);
  }
  hopToken();
}
function countTo(el, from, to, ms, delay) {
  if (REDUCED || from === to) { el.textContent = to; return; }
  el.textContent = from;
  const t0 = performance.now() + delay;
  const step = now => {
    if (!el.isConnected) return;                                   // re-rendered meanwhile
    const k = Math.min(1, Math.max(0, (now - t0) / ms));
    el.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - k, 2)));
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
// Once the wheel stops or the die lands, the piece hops space by space from where it was to where it landed.
function hopToken() {
  const f = state.flash;
  if (!f || (f.type !== 'candy' && f.type !== 'dice') || !WAAPI || REDUCED) return;
  const tok = app.querySelector('.gwrap .track .tok.moved');
  if (!tok) return;
  const spec = f.type === 'candy' ? CANDY_SPEC : DICE_SPEC;
  const from = f.type === 'candy' ? f.from : diceSlot(f.total - f.roll), to = f.type === 'candy' ? f.to : diceSlot(f.total);
  const stops = [];
  for (let i = from; i <= to; i++) stops.push(spec.at(i));
  stops[stops.length - 1] = [Number(tok.dataset.x), Number(tok.dataset.y)];   // land exactly where the piece now sits
  if (stops.length < 2) return;
  const n = stops.length - 1, frames = [];
  stops.forEach(([x, y], k) => {
    frames.push({ transform: `translate(${x}px, ${y}px) scale(1)`, offset: k / n, easing: 'ease-in-out' });
    if (k < n) {
      const [nx, ny] = stops[k + 1];
      frames.push({ transform: `translate(${(x + nx) / 2}px, ${(y + ny) / 2 - 4}px) scale(1.3)`, offset: (k + .5) / n, easing: 'ease-in-out' });
    }
  });
  tok.style.animation = 'none';                                    // the CSS pop is only the fallback
  tok.animate(frames, { duration: n * HOP_MS, delay: f.type === 'candy' ? SPIN_MS : DIE_MS, fill: 'both' });
}
function renderMain() {
  if (state.screen === 'menu') return renderMenu();
  if (state.screen === 'online') return renderOnline();
  if (state.screen === 'join') return renderJoin();
  if (state.screen === 'setup') return renderSetup();
  if (state.screen === 'win' && state.winner) return renderWin();
  if (state.screen === 'mini' && state.zoom != null) {
    const sq = state.squares[state.zoom];
    if (sq) return renderMini(sq);
  }
  return renderBoard();
}
function renderHeader() {

  const x = state.squares.filter(s => s.owner === 'X').length;
  const o = state.squares.filter(s => s.owner === 'O').length;

}

/* ----- main board ----- */
function renderBoard() {
  const sqs = state.squares.map((sq, i) => {
    const cls = ['sq'];
    if (sq.owner) cls.push('own-' + sq.owner);
    else if (i === state.lastSquare && state.lastBy) cls.push('last-' + state.lastBy);
    const info = INFO[sq.mini.type];
    // a claimed square keeps its label and final state, with the owner's mark laid over them
    const body = `<div class="lab">${ICONS[sq.mini.type]}<span>${info.name}</span></div><div class="thumb">${thumb(sq.mini, !!sq.owner)}</div>`
      + (sq.owner ? `<div class="own-ov${state.stamp === i ? ' stamp' : ''}" aria-hidden="true">${sq.owner}</div>` : '');   // a fresh claim stamps in
    const label = sq.owner ? `Square ${i + 1}: ${info.name}, won by ${N(sq.owner)}. Tap to view` : `Square ${i + 1}: ${info.name}`;
    return `<button class="${cls.join(' ')}" data-act="zoom" data-i="${i}" aria-label="${label}"${cpuTurn() ? ' disabled' : ''}>${body}</button>`;
  }).join('');
  const hint = cpuTurn() ? `${N(state.turn)} is thinking…` : remoteTurn() ? `Waiting for ${N(state.turn)}…`
    : state.moves ? 'Tap any open square to make a move' : `${N(state.turn)} goes first. Tap a square to play`;
  const confirm = state.confirm === 'new'
    ? `<div class="flash"><div class="card"><h2>Start a new match?</h2><p>The current match will be lost${isHost() ? ' for both of you' : ''}.</p>
        <div class="row"><button class="btn" data-act="cancel">Keep playing</button><button class="btn go" data-act="confirm-new">New match</button></div></div></div>`
    : state.confirm === 'leave'
    ? `<div class="flash"><div class="card"><h2>Leave the game?</h2><p>${isHost() ? 'The room closes for your friend too.' : 'You can rejoin with the same code while the host keeps the room open.'}</p>
        <div class="row"><button class="btn" data-act="cancel">Keep playing</button><button class="btn go" data-act="confirm-leave">Leave</button></div></div></div>`
    : '';
  return `<main class="scr board-scr">${netBar()}<div class="board">${sqs}</div>
    <div class="foot"><span class="hint">${hint}</span><button class="link" data-act="${isGuest() ? 'leave' : 'new'}">${isGuest() ? 'Leave game' : 'New match'}</button></div>${confirm}</main>`;
}
// Miniatures: public information only. Hidden words, numbers, cards and the ship never appear here,
// except that a claimed Memory square shows the pair that won it.
function thumb(mini, final) {
  switch (mini.type) {
    case 'ttt': return `<div class="tg g3">${mini.cells.map(c => `<i class="${c || ''}">${c || ''}</i>`).join('')}</div>`;
    case 'c4':  return `<div class="tg g5">${mini.cells.map(c => `<i class="${c || ''}"></i>`).join('')}</div>`;
    case 'bs':  return `<div class="tg g3 sea">${mini.revealed.map(r => `<i class="${r ? 'miss' : ''}"></i>`).join('')}</div>`;
    case 'wordle': {
      const last = mini.guesses.slice(-4);
      const rows = last.length
        ? last.map(g => `<div class="twr">${g.word.split('').map((ch, k) => `<i class="${g.marks[k]}">${ch}</i>`).join('')}</div>`).join('')
        : `<div class="twr">${'<i></i>'.repeat(5)}</div><div class="twr">${'<i></i>'.repeat(5)}</div>`;
      const more = mini.guesses.length - last.length;
      return `<div class="tw">${rows}${more > 0 ? `<small>+${more} earlier</small>` : ''}</div>`;
    }
    case 'hangman': {
      const got = new Set(mini.letters.filter(x => x.hit).map(x => x.l));
      const wrong = mini.letters.length - got.size;
      return `<div class="thg"><div class="hw" style="--n:${mini.word.length}">${mini.word.split('').map(ch => `<i class="${got.has(ch) ? 'on' : ''}">${got.has(ch) ? ch : ''}</i>`).join('')}</div><small>${wrong} wrong</small></div>`;
    }
    case 'hex': return `<div class="thex">${[0, 1, 2, 3].map(r => `<div class="hr" style="--k:${r}">${[0, 1, 2, 3].map(c => `<i class="${mini.cells[r * HEX_N + c] || ''}"></i>`).join('')}</div>`).join('')}</div>`;
    case 'hilo': return `<div class="thilo"><b>${mini.lo}–${mini.hi}</b><small>${mini.guesses.length} guess${mini.guesses.length === 1 ? '' : 'es'}</small></div>`;
    case 'dice': return trackSvg(DICE_SPEC, { tokens: { X: diceSlot(mini.totals.X), O: diceSlot(mini.totals.O) }, finish: 'flag', mini: true });
    case 'memory': {
      const shown = final && mini.winCells ? mini.winCells : [];
      return `<div class="tg g3 tmem">${mini.cards.map((card, i) => (shown.includes(i) ? `<i class="up">${shapeSvg(card)}</i>` : '<i>?</i>')).join('')}</div>`;
    }
    case 'candy': return trackSvg(CANDY_SPEC, { colors: mini.track, tokens: { X: mini.pos.X, O: mini.pos.O }, finish: 'colours', mini: true });
    case 'coins': return `<div class="tcoin">${mini.coins.map(c => `<i class="${c}">${c}</i>`).join('')}</div>`;
    case 'pig': return `<div class="tdice">${['X', 'O'].map(p => `<div class="tr ${p}"><b class="${p}">${p}</b><div class="bar"><i style="width:${Math.min(100, mini.bank[p] / PIG.goal * 100)}%"></i></div><span>${mini.bank[p]}</span></div>`).join('')}</div>`;
    case 'hunt': return `<div class="tg g5x5">${mini.dug.map((d, i) => {
      if (!d) return '<i></i>';
      const k = clueAt(mini, i), [bg, fg] = HUNT_COLORS[k];
      return `<i style="background:${bg};color:${fg}">${k ? k : GEM}</i>`;
    }).join('')}</div>`;
  }
  return '';
}
// QWERTY keyboard. With `extra` the keys type into the Wordle draft; without it each key is a Hangman move.
function keyboard(cls, disabled, extra) {
  const rows = ['QWERTYUIOP', 'ASDFGHJKL', 'ZXCVBNM'];
  return `<div class="kb">${rows.map((row, ri) => `<div class="krow">${ri === 2 && extra ? `<button class="key wide" data-act="enter"${extra.enter ? ' disabled' : ''}>Enter</button>` : ''}${row.split('').map(k =>
    `<button class="key ${cls(k)}" data-act="${extra ? 'key' : 'move'}" ${extra ? `data-k="${k}"` : mv(k)} aria-label="${k}"${disabled(k) ? ' disabled' : ''}>${k}</button>`
  ).join('')}${ri === 2 && extra ? `<button class="key wide" data-act="bksp" aria-label="Backspace"${extra.bksp ? ' disabled' : ''}>${BKSP}</button>` : ''}</div>`).join('')}</div>`;
}

// The connection banner during online play: nothing while all is well.
function netBar() {
  if (!state.online || net.status === 'connected' || net.status === 'idle') return '';
  const leave = net.status === 'left' || net.status === 'error' ? ' <button class="btn" data-act="leave">Leave game</button>' : '';
  return `<div class="netbar ${net.status}" role="status">${esc(net.msg || (net.status === 'lost' ? 'Connection lost — reconnecting…' : 'Connecting…'))}${leave}</div>`;
}
/* ----- zoomed mini-game ----- */
// Tic-tac-toe's winning line, drawn across the grid (animated when the win is fresh).
function tttLine(run, p, animate) {
  const c = k => [(k % 3) * 100 / 3 + 100 / 6, Math.floor(k / 3) * 100 / 3 + 100 / 6];
  const [x1, y1] = c(run[0]), [x2, y2] = c(run[run.length - 1]);
  const len = Math.hypot(x2 - x1, y2 - y1), ex = (x2 - x1) / len * 9, ey = (y2 - y1) / len * 9;   // a little past the end cells
  return `<svg class="winline${animate ? ' draw' : ''}" viewBox="0 0 100 100" aria-hidden="true"><line x1="${x1 - ex}" y1="${y1 - ey}" x2="${x2 + ex}" y2="${y2 + ey}" class="${p}"/></svg>`;
}
function renderMini(sq) {
  const f = state.flash;                            // the move just made: its animation and result are playing
  const d = state.done;                             // the move made here, on show until the player heads back to the board
  const mini = d && d.drawn ? d.drawn : sq.mini;    // after a draw, keep showing the full board that drew
  const info = INFO[mini.type];
  const view = !!sq.owner && !f;                    // a claimed square: final state, read-only, secrets revealed
  const locked = !!f || !!d || view || blocked();   // no input while the result plays, once the move is made, when just looking, or while it is not this phone's move
  const a = f && f.type === mini.type ? f : null;   // the move to animate (only while its result is fresh)
  const anim = a ? (Number.isInteger(mini.last) ? mini.last : null) : null;   // the cell just played, for grid games
  const won = i => !!(mini.winCells && mini.winCells.includes(i));
  const wk = i => (mini.winCells ? mini.winCells.indexOf(i) : -1);           // place in the winning run, for staggered highlights
  const fresh = a && (a.kind === 'claim' || a.kind === 'match');             // the square was just won
  const turn = state.turn;
  let g = '';
  switch (mini.type) {
    case 'ttt': {
      const line = mini.winCells ? tttLine(mini.winCells, sq.owner || 'X', !!fresh) : '';
      g = `<div class="g-ttt">${mini.cells.map((c, i) =>
        `<button class="cell ${c || ''}${won(i) ? ' win' : ''}${won(i) && fresh ? ' lit' : ''}${anim === i ? ' pop' : ''}" data-act="move" ${mv(i)} aria-label="Cell ${i + 1}${c ? ', ' + c : ''}"${c || locked ? ' disabled' : ''}>${c ? `<span class="mk">${c}</span>` : ''}</button>`
      ).join('')}${line}</div>`;
      break;
    }
    case 'c4':
      g = `<div class="g-c4">${mini.cells.map((c, i) => {
        const col = i % C4.cols, full = !!mini.cells[col];
        const lit = won(i) && fresh;
        const style = anim === i ? ` style="--fall:${Math.floor(i / C4.cols) + 1}${lit ? `;--k:${wk(i)}` : ''}"` : lit ? ` style="--k:${wk(i)}"` : '';
        return `<button class="c4c ${c || ''}${won(i) ? ' win' : ''}${lit ? ' lit' : ''}${anim === i ? ' drop' : ''}"${style} data-act="move" ${mv(col)} aria-label="Drop in column ${col + 1}"${full || locked ? ' disabled' : ''}></button>`;
      }).join('')}</div>`;
      break;
    case 'bs':
      g = `<div class="g-bs">${mini.revealed.map((r, i) => {
        const hit = (r || view) && i === mini.hidden;
        const cls = hit ? ' hit ' + (r || sq.owner) : r ? ' miss' : '';
        return `<button class="cell sea${cls}${anim === i ? ' flipin' : ''}" data-act="move" ${mv(i)} aria-label="Cell ${i + 1}${hit ? ', hit' : r ? ', miss' : ''}"${r || locked ? ' disabled' : ''}>${hit ? BOAT : ''}</button>`;
      }).join('')}</div>`;
      break;
    case 'wordle': {
      const n = mini.guesses.length;
      const rows = mini.guesses.map((gs, r) => `<div class="wrow">${gs.word.split('').map((ch, k) =>
        `<i class="wt ${gs.marks[k]}${a && r === n - 1 ? ' reveal' : ''}"${a && r === n - 1 ? ` style="--k:${k}"` : ''}>${ch}</i>`).join('')}</div>`).join('');
      const dr = state.draft || '';
      const cur = Array.from({ length: 5 }, (_, k) => `<i class="wt${dr[k] ? ' typed' : ''}">${dr[k] || ''}</i>`).join('');
      const rank = { x: 1, y: 2, g: 3 };
      const bestOf = list => { const b = {}; for (const gs of list) gs.word.split('').forEach((ch, k) => { if ((rank[gs.marks[k]] || 0) > (rank[b[ch]] || 0)) b[ch] = gs.marks[k]; }); return b; };
      const best = bestOf(mini.guesses), before = a ? bestOf(mini.guesses.slice(0, -1)) : best;   // keys recolour once the tiles have flipped
      g = `<div class="g-wordle"><div class="wlist" id="wlist">${rows || '<div class="empty">No guesses yet. Type a 5-letter word.</div>'}</div>
        ${state.notice ? `<div class="notice" role="alert">${esc(state.notice)}</div>` : ''}
        ${view ? '' : `<div class="wrow cur${state.notice ? ' shake' : ''}" aria-label="Your guess">${cur}</div>`}
        ${keyboard(k => (best[k] || '') + (best[k] && best[k] !== before[k] ? ' kc' : ''), () => locked || dr.length >= 5, { enter: locked || dr.length !== 5, bksp: locked || !dr.length })}</div>`;
      break;
    }
    case 'hangman': {
      const got = {};
      for (const x of mini.letters) got[x.l] = x.hit ? 'hit' : 'miss';
      const justL = a ? a.letter : null;
      let kk = 0;
      const tiles = mini.word.split('').map(ch => {
        const on = got[ch] || view, flip = on && ch === justL;
        return `<i class="ht${on ? ' on' : ''}${flip ? ' flipin' : ''}"${flip ? ` style="--k:${kk++}"` : ''}>${on ? ch : ''}</i>`;
      }).join('');
      const wrong = mini.letters.filter(x => !x.hit).map(x => `<i${x.l === justL ? ' class="new"' : ''}>${x.l}</i>`).join(' ');
      g = `<div class="g-hang"><div class="hword">${tiles}</div>
        <div class="hmiss">${wrong ? `Wrong: <b>${wrong}</b>` : 'No wrong letters yet'}</div>
        ${keyboard(k => (got[k] || '') + (k === justL && got[k] === 'miss' ? ' shake' : ''), k => locked || !!got[k])}</div>`;
      break;
    }
    case 'hex': {
      const rows = [0, 1, 2, 3].map(r => `<div class="hrow" style="--r:${r}">${[0, 1, 2, 3].map(c => {
        const i = r * HEX_N + c, v = mini.cells[i], lit = won(i) && fresh;
        return `<button class="hexc ${v || ''}${won(i) ? ' win' : ''}${lit ? ' lit' : ''}${anim === i ? ' fill' : ''}"${lit ? ` style="--k:${mini.winCells.length - 1 - wk(i)}"` : ''} data-act="move" ${mv(i)} aria-label="Row ${r + 1} cell ${c + 1}${v ? ', ' + v : ''}"${v || locked ? ' disabled' : ''}></button>`;
      }).join('')}</div>`).join('');
      g = `<div class="g-hex"><div class="hexgoal O">O</div><div class="hexmid"><div class="hexgoal X">X</div><div class="hexboard">${rows}</div><div class="hexgoal X">X</div></div><div class="hexgoal O">O</div></div>`;
      break;
    }
    case 'hilo': {
      const by = {};
      for (const x of mini.guesses) by[x.n] = x.by;
      const first = !mini.guesses.length;
      const span = HILO.hi - HILO.lo + 1;

// One line about a move, for the result toast and the handoff bar.
function summary(f) {

/* ----- win screen ----- */
function renderWin() {
  const w = state.winner;
  const why = state.winReason === 'line'
    ? 'Three squares in a row'
    : `Most squares: ${state.counts[w]} to ${state.counts[other(w)]}`;

    <div class="final" aria-hidden="true">${final}</div>
    <div class="row"><button class="primary" data-act="new"${isGuest() && net.status !== 'connected' ? ' disabled' : ''}>New match</button><button class="btn" data-act="${state.online ? 'leave' : 'menu'}">Main menu</button></div></div></main>`;

/* ===================== Online play (PeerJS, host as the single source of truth) =====================
 * The host's browser keeps the real state and makes every random choice. The guest only sends move
 * requests; the host validates and applies them, then sends both screens a public snapshot of the
 * state with every secret of an unclaimed square left out (publicState). Moves by the other player
 * play back the way computer moves do: zoom into the square, animate, hold, back to the board.

function isGuest() { return !!state.online && state.online.role === 'guest'; }
// the side played at this phone: the host's or guest's own side online, the person's side against the computer, null when both play here
function mySide() { return state.online ? state.online.me : state.cpu ? other(state.cpu) : null; }
function remoteTurn() { return !!state.online && !state.winner && state.turn !== state.online.me; }
// nothing to tap: the computer or the other player is on the move, a move of ours is still travelling, or the line is down
function blocked() { return cpuTurn() || remoteTurn() || !!moveWait || (isGuest() && net.status !== 'connected'); }

function roomLink() { return location.origin + location.pathname + '?room=' + state.online.code; }

function loadPeer() {

      s.onerror = () => { clearTimeout(t); s.remove(); tryAt(k + 1); };

function send(c, msg) { if (c && c.open) { try { c.send(msg); } catch (e) { /* the line just dropped; the close handler takes over */ } } }

// ---------- host ----------
async function hostRoom(code, resume) {

    state.setup.mode = 'online'; state.screen = 'setup'; lobby = null;

// ---------- guest ----------
async function joinRoom(code, name, resume) {
  if (!resume) {
    code = String(code || '').toUpperCase().replace(/[^A-Z]/g, '');
    if (!validCode(code)) { setNet('error', 'Enter the 5-letter room code.'); render(); return; }
    try { localStorage.setItem(KEY + '.name', name); } catch (e) { /* no storage */ }
    state.online = { role: 'guest', code, me: null, name, joined: false };
    state.setup.mode = 'online'; state.screen = 'join'; lobby = null;
  }
  shownMoves = -1; pendingSnap = null; moveWait = null;
  setNet('connecting', resume ? 'Reconnecting…' : 'Connecting…');
  commit();
  try { await loadPeer(); } catch (e) {
    setNet('error', 'Online play needs an internet connection. Check it (Wi-Fi helps) and try again.'); commit(); return;
  }

  openGuestPeer();
}
function openGuestPeer() {

  p.on('open', () => { if (peer === p) connectToHost(); });

  p.on('error', err => {

  c.on('open', () => {

    clearTimeout(netTimer);

    commit();

function onHostMessage(c, msg) {

/* ----- online screens ----- */
function renderOnline() {
  return `<main class="scr menu"><div class="menu-card">
    <h1>Play Online</h1>
    <p class="sub">One of you hosts a room and shares its code; the other joins. Both phones need an internet connection.</p>
    <button class="primary" data-act="host">Host game</button>
    <button class="primary alt" data-act="join-go">Join game</button>
    <button class="link wide" data-act="menu">Back to menu</button>
  </div></main>`;
}
function renderJoin() {
  const o = online(), joined = !!(o && o.joined);
  const host = joined && o.me ? playerName(state, other(o.me)) : null;
  const status = net.status === 'error' ? `<div class="warn">${esc(net.msg)}</div>`
    : joined && net.status === 'connected' ? `<div class="status ok">Joined <b>${esc(host || 'the host')}</b>'s game · you play <b class="${o.me}">${o.me}</b> · waiting for ${esc(host || 'the host')} to start…</div>`
    : net.status === 'connected' ? '<div class="status">Connected · waiting for the host…</div>'

  const form = o ? '' : `<label class="field"><span>Your name</span><input id="jname" value="${esc(joinName)}" maxlength="${NAME_MAX}" placeholder="Your name" autocomplete="off" autocapitalize="words"></label>
    <label class="field"><span>Room code</span><input id="jcode" class="codein" value="${esc(joinCode)}" maxlength="5" placeholder="ABCDE" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="latin"></label>`;

    <div class="setup-box">${form}${status}${o && net.status === 'error' ? '<button class="primary" data-act="rejoin">Try again</button>' : ''}</div>
    ${o ? '' : `<div class="setup-foot"><button class="primary" data-act="join">Join</button></div>`}</main>`;

/* ----- input ----- */
app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const act = el.dataset.act;
  if (act === 'dismiss') { if (Date.now() >= flashReady) dismissFlash(); return; }   // not before the animation is over
  const free = ['new', 'confirm-new', 'cancel', 'leave', 'confirm-leave', 'menu', 'rejoin', 'host-retry', 'share'];
  if (state.flash) return;                      // everything else waits for the result to clear
  if (state.done) return;                       // the result is still on show
  if (cpuTurn() && !free.includes(act)) return;   // the computer is playing
  state.stamp = null;                           // a claim stamps in once
  if (act === 'zoom') {                        // open squares to play, claimed squares to look
    const i = Number(el.dataset.i);
    if (state.winner || !state.squares[i]) return;
    if (lockMine() && state.lock !== i) return;
    state.screen = 'mini'; state.zoom = i; state.draft = ''; state.sel = []; state.notice = null;
    if (!isGuest()) { state.pick = null; state.pickSq = null; }
    commit();
  } else if (act === 'back') {
    if (lockMine()) return;
    if (state.done) return;
    state.screen = 'board'; state.zoom = null; state.draft = ''; state.sel = []; state.notice = null; state.stamp = null;
    if (!isGuest()) { state.pick = null; state.pickSq = null; }
    commit();
  } else if (act === 'mode-go') {              // the main menu: pick a mode, then set up
    state.setup.mode = el.dataset.mode === 'cpu' ? 'cpu' : 'two'; syncNames(state.setup); state.screen = 'setup'; advOpen = false; commit();
  } else if (act === 'menu') {
    state.screen = 'menu'; state.confirm = null; commit();
  } else if (act === 'online-go') {
    state.screen = 'online'; commit();
  } else if (act === 'online-back') {
    if (state.online) leaveRoom(); else { state.screen = 'online'; commit(); }
  } else if (act === 'host') {
    advOpen = false; hostRoom(null, false);
  } else if (act === 'host-retry') {
    hostRoom(state.online.code, true);
  } else if (act === 'join-go') {
    state.screen = 'join'; state.online = null; setNet('idle', ''); render();
  } else if (act === 'join') {
    const nameEl = document.getElementById('jname'), codeEl = document.getElementById('jcode');
    joinName = (nameEl ? nameEl.value : joinName).trim().slice(0, NAME_MAX) || 'Friend'; joinCode = (codeEl ? codeEl.value : joinCode).toUpperCase().replace(/[^A-Z]/g, '');
    joinRoom(joinCode, joinName, false);
  } else if (act === 'rejoin') {
    if (state.online) joinRoom(null, null, true);
  } else if (act === 'share') {
    shareRoom();
  } else if (act === 'leave') {
    if (state.online && !state.winner && state.moves > 0 && state.screen !== 'setup' && state.screen !== 'join' && net.status === 'connected') { state.confirm = 'leave'; commit(); }
    else leaveRoom();
  } else if (act === 'confirm-leave') {
    leaveRoom();
  } else if (act === 'adv') {
    advOpen = !advOpen; render();
  } else if (act === 'side') {
    const side = el.dataset.side === 'O' ? 'O' : 'X', was = state.setup.human === 'O' ? 'O' : 'X';
    state.setup.human = side; syncNames(state.setup);
    if (isHost() && side !== was) {                           // the host's name goes with the host's side
      state.online.me = side;
      state.setup.names[side] = state.setup.names[was]; state.setup.names[was] = state.online.joined ? state.setup.names[was] : was;
      if (!state.online.joined) state.setup.names[was] = was;
    }
    commit();
  } else if (act === 'move') {
    attemptMove(JSON.parse(el.dataset.m));
  } else if (act === 'key') {
    typeLetter(el.dataset.k);
  } else if (act === 'bksp') {
    backspace();
  } else if (act === 'enter') {
    submitWord();
  } else if (act === 'pick') {
    const i = Number(el.dataset.i);
    const first = state.pick != null && state.pickSq === state.zoom ? state.pick : null;
    if (isGuest()) {                             // the host turns the card for us; two cards make the move
      if (blocked()) return;
      if (first == null || first === i) send(conn, { t: 'pick', i: state.zoom, card: first === i ? null : i });
      else attemptMove([first, i]);
      return;
    }
    if (first == null) { state.pick = i; state.pickSq = state.zoom; }
    else if (first === i) { state.pick = null; state.pickSq = null; }
    else if (!playMove(state, state.zoom, [first, i]).ok) { state.pick = null; state.pickSq = null; }
    commit();
  } else if (act === 'new') {
    if (isGuest()) { if (state.winner && net.status === 'connected') send(conn, { t: 'rematch' }); return; }
    if (isHost()) { if (state.winner || state.moves === 0) { startMatch(state); state.confirm = null; commit(); } else { state.confirm = 'new'; commit(); } return; }
    if (state.winner || state.moves === 0) { state.screen = 'setup'; state.confirm = null; commit(); }
    else { state.confirm = 'new'; commit(); }
  } else if (act === 'confirm-new') {
    if (isHost()) { startMatch(state); state.confirm = null; commit(); return; }
    state.screen = 'setup'; state.confirm = null; commit();
  } else if (act === 'cancel') {
    state.confirm = null; commit();
  } else if (act === 'start') {
    if (isHost() && !(state.online.joined && net.status === 'connected')) return;
    if (startMatch(state)) { shownMoves = -1; commit(); }
  }
});
// Setup screen: names are saved as they are typed (no re-render, so the field keeps focus);

app.addEventListener('input', e => {

function zoomedType() {

// Physical keyboard, for desktops: Wordle typing and Hangman letters.
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target && e.target.tagName === 'INPUT') return;   // typing a name
  const type = zoomedType();
  if (!type) return;
  if (/^[a-zA-Z]$/.test(e.key)) {
    if (type === 'wordle') typeLetter(e.key.toUpperCase());
    else if (type === 'hangman') attemptMove(e.key.toUpperCase());
  } else if (e.key === 'Backspace') backspace();
  else if (e.key === 'Enter') submitWord();
});
document.addEventListener('contextmenu', e => e.preventDefault());

function commit() { save(); render(); scheduleCpu(); netSync(); }
function boot() {
  const room = new URLSearchParams(location.search).get('room');
  try { joinName = localStorage.getItem(KEY + '.name') || ''; } catch (e) { /* no storage */ }
  if (room && validCode(room.toUpperCase()) && !state.online) { joinCode = room.toUpperCase(); state.screen = 'join'; }   // a shared link: straight to joining
  render(); scheduleCpu();
  if (state.online) resumeOnline();

/* ----- the computer's turn: a pause to think, a zoom into its square, its choice shown, then the move ----- */
function cpuTurn() { return !!state.cpu && state.turn === state.cpu && !state.winner && state.screen !== 'setup' && state.screen !== 'menu'; }

  if (state.screen === 'board') { cpuPlan = null; cpuTimer = setTimeout(cpuZoom, CPU_MS.think); return; }
  if (state.screen !== 'mini') return;
  if (!cpuPlan || cpuPlan.square !== state.zoom) {
    cpuPlan = cpuMove(state); cpuPlan.stage = 0;
    if (cpuPlan.square !== state.zoom) { state.zoom = cpuPlan.square; state.draft = ''; state.pick = null; state.sel = []; commit(); return; }   // after a reload mid-move
  }
  cpuTimer = setTimeout(cpuAct, cpuPlan.stage ? CPU_MS.pre : state.lock != null ? CPU_MS.again : CPU_MS.zoom);
}
function cpuZoom() {
  cpuTimer = null;
  if (!cpuTurn() || state.screen !== 'board' || state.confirm) return;
  cpuPlan = cpuMove(state); cpuPlan.stage = 0;
  state.screen = 'mini'; state.zoom = cpuPlan.square; state.draft = ''; state.pick = null; state.sel = []; state.notice = null;
  commit();
}
function cpuAct() {
  cpuTimer = null;
  if (!cpuTurn() || state.screen !== 'mini' || !cpuPlan || cpuPlan.square !== state.zoom) return;
  const plan = cpuPlan, type = state.squares[plan.square].mini.type;
  if (!plan.stage && (type === 'memory' || type === 'wordle')) {   // show the choice first, as a person would
    if (type === 'memory') state.pick = plan.move[0]; else state.draft = plan.move;
    plan.stage = 1; commit(); return;
  }
  cpuPlan = null;
  const r = playMove(state, plan.square, plan.move);
  if (!r.ok) {                                   // never expected; rather than freeze, hand the match to two players
    console.error('The computer could not play', plan, r);
    state.cpu = null; leaveSquare(state);
  }
  commit();
}
function armFlash() {
  if (!state.flash || flashTimer) return;
  const f = state.flash, ms = animMs(f);
  flashReady = Date.now() + ms;                   // no tapping the result away while the move is still animating
  let hold = FLASH_MS[f.kind] || 800;
  if (f.type === 'memory' && f.kind === 'move') hold = MEMORY_MS;
  if (f.type === 'pig' && f.kind === 'move') hold = FLASH_MS.card;   // a bust or a bank gets a proper card
  flashTimer = setTimeout(dismissFlash, ms + hold);
}
function dismissFlash() {
  clearTimeout(flashTimer); flashTimer = null;
  const f = state.flash;
  if (!f) return;
  const hold = f.type === 'memory' && f.kind === 'move' && !state.winner;   // let the two cards turn back over first
  endFlash(state, hold);
  commit();
  if (hold && state.done) {
    clearTimeout(holdTimer);
    holdTimer = setTimeout(() => { if (state.done && !state.flash && leaveSquare(state)) commit(); applyPending(); }, FLIP_MS);
  } else applyPending();                        // online guest: the host may have moved on meanwhile
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* no storage: just play without resume */ }
}
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && s.v === 4 && Array.isArray(s.squares) && s.squares.length === 9 && (s.turn === 'X' || s.turn === 'O') && s.setup) {
      if (s.lock != null && !s.winner) { s.screen = 'mini'; s.zoom = s.lock; }
      else if (s.done && !s.flash && !s.winner) leaveSquare(s);   // a result that was still on show: the board was next anyway
      s.notice = null; s.sel = []; s.stamp = null;
      if (!s.setup.mode) s.setup.mode = 'two';
      if (!s.setup.human) s.setup.human = 'X';
      if (s.cpu !== 'X' && s.cpu !== 'O') s.cpu = null;
      if (!(s.online && (s.online.role === 'host' || s.online.role === 'guest') && validCode(s.online.code))) s.online = null;
      if (s.online && s.online.role === 'guest' && s.online.me !== 'X' && s.online.me !== 'O') s.online.me = null;
      if (s.online && !['board', 'mini', 'win', 'setup', 'join'].includes(s.screen)) s.screen = s.online.role === 'host' ? 'setup' : 'join';
      for (const sq of s.squares) if (sq.mini.type === 'memory' && !Array.isArray(sq.mini.seen)) sq.mini.seen = [];
      for (const t of TYPES) if (!(t in s.setup.games)) s.setup.games[t] = true;   // a game added since the save is on by default
      return s;
    }
  } catch (e) { /* ignore corrupt saves */ }
  return null;
}

boot();
</script>
