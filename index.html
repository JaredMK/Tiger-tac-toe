  } else if (act === 'side') {
    const side = el.dataset.side === 'O' ? 'O' : 'X', was = state.setup.human === 'O' ? 'O' : 'X';
    if (isHost()) { if (side !== was) hostSide(side); return; }   // the seats move over in the room; the room's answer updates the screen
    state.setup.human = side; syncNames(state.setup);
    commit();
  } else if (act === 'mmslot') {                // Mastermind: pick a slot; a filled one is cleared
    if (zoomedType() !== 'mastermind' || !mmDraft) return;
    const k = Number(el.dataset.k);
    if (mmDraft.slots[k] != null) mmDraft.slots[k] = null;
    mmDraft.at = k;
    render();
  } else if (act === 'mmcol') {                 // ...then a colour goes into it, and the next empty slot is picked
    if (zoomedType() !== 'mastermind' || !mmDraft) return;
    const c = Number(el.dataset.c);
    if (mmDraft.slots.includes(c)) return;
    const k = mmDraft.slots[mmDraft.at] == null ? mmDraft.at : mmDraft.slots.indexOf(null);
    if (k < 0) return;
    mmDraft.slots[k] = c; mmPop = { sq: state.zoom, k, at: performance.now() };
    const nxt = mmDraft.slots.findIndex((x, j) => x == null && j > k);
    mmDraft.at = nxt >= 0 ? nxt : Math.max(0, mmDraft.slots.indexOf(null));
    render();
  } else if (act === 'hpsel') {                 // Hexapawn: pick a pawn (again to put it down) to see its moves
    if (zoomedType() !== 'hexapawn') return;
    const i = Number(el.dataset.i);
    hpSel = hpSel && hpSel.sq === state.zoom && hpSel.from === i ? null : { sq: state.zoom, from: i };
    render();
  } else if (act === 'move') {
    hpSel = null;
    if (el.dataset.m === '[]') return;
    attemptMove(JSON.parse(el.dataset.m));
  } else if (act === 'key') {
    typeLetter(el.dataset.k);
  } else if (act === 'bksp') {
    backspace();
  } else if (act === 'enter') {
    submitWord();
  } else if (act === 'pick') {
    const i = Number(el.dataset.i);
    const first = state.pick != null && state.pickSq === state.zoom ? state.pick : null;
    if (state.online) {                          // the first card is turned up in the room, for both to see; two cards make the move
      if (blocked()) return;
      if (first == null || first === i) dbPick(state.zoom, first === i ? null : i);
      else attemptMove([first, i]);
      return;
    }
    if (first == null) { state.pick = i; state.pickSq = state.zoom; }
    else if (first === i) { state.pick = null; state.pickSq = null; }
    else if (!playMove(state, state.zoom, [first, i]).ok) { state.pick = null; state.pickSq = null; }
    commit();
  } else if (act === 'cancel') {
    state.confirm = null; commit();
  } else if (act === 'start') {
    if (state.online) { startOnline(); return; }
    if (startMatch(state)) commit();
  }
});
// Setup screen: names are saved as they are typed (no re-render, so the field keeps focus);
// ticking a game re-renders the list.
app.addEventListener('input', e => {
  const el = e.target;
  if (el.matches && el.matches('input[data-p]') && state.setup) { state.setup.names[el.dataset.p] = el.value; save(); if (state.online && state.online.me === el.dataset.p) dbName(el.value); }
  if (el.id === 'jname') joinName = el.value;
  if (el.id === 'jcode') { const v = el.value.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 5); if (v !== el.value) el.value = v; joinCode = v; }
});
app.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target && e.target.id === 'jcode') { e.preventDefault(); const b = app.querySelector('[data-act="join"]'); if (b) b.click(); }
});
app.addEventListener('change', e => {
  const el = e.target;
  if (el.matches && el.matches('input[data-t]') && state.setup) { state.setup.games[el.dataset.t] = el.checked; commit(); dbSetup({ games: state.setup.games }); }
});
function zoomedType() {
  if (state.screen !== 'mini' || state.zoom == null || state.flash || state.done || state.winner || blocked()) return null;
  const sq = state.squares[state.zoom];
  return sq && !sq.owner ? sq.mini.type : null;
}
function typeLetter(k) {
  if (zoomedType() !== 'wordle' || (state.draft || '').length >= 5) return;
  state.draft = (state.draft || '') + k; commit();
}
function backspace() {
  if (zoomedType() !== 'wordle' || !(state.draft || '').length) return;
  state.draft = state.draft.slice(0, -1); commit();
}
function submitWord() {
  if (zoomedType() !== 'wordle' || (state.draft || '').length !== 5) return;
  const r = attemptMove(state.draft);
  if (r === true || r.ok) return;
  if (r.reason === 'notword') {                 // the guess stays typed and the turn is still theirs
    state.notice = 'Not a word'; commit();
    clearTimeout(noticeTimer);
    noticeTimer = setTimeout(() => { state.notice = null; commit(); }, 1200);
  }
}
// Physical keyboard, for desktops: Wordle typing and Hangman letters.
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target && e.target.tagName === 'INPUT') return;   // typing a name
  const type = zoomedType();
  if (!type) return;
  if (/^[a-zA-Z]$/.test(e.key)) {
    if (type === 'wordle') typeLetter(e.key.toUpperCase());
    else if (type === 'hangman') attemptMove(e.key.toUpperCase());
  } else if (e.key === 'Backspace') backspace();
  else if (e.key === 'Enter') submitWord();
});
document.addEventListener('contextmenu', e => e.preventDefault());

function commit() { save(); render(); scheduleCpu(); }
function boot() {
  clockTimer = setInterval(tick, 250);
  const room = new URLSearchParams(location.search).get('room');
  try { joinName = localStorage.getItem(KEY + '.name') || ''; } catch (e) { /* no storage */ }
  if (room && validCode(room.toUpperCase()) && !state.online) { joinCode = room.toUpperCase(); state.screen = 'join'; }   // a shared link: straight to joining
  render(); scheduleCpu();
  if (state.online) resumeOnline();
}

/* ----- the computer's turn: a pause to think, a zoom into its square, its choice shown, then the move ----- */
function cpuTurn() { return !!state.cpu && state.cpu.includes(state.turn) && !state.winner && state.screen !== 'setup' && state.screen !== 'menu'; }
// Runs after every render: arms the computer's next step whenever it is its turn and nothing else is going on.
function scheduleCpu() {
  clearTimeout(cpuTimer); cpuTimer = null;
  if (!cpuTurn() || state.flash || state.done || state.confirm || menuOpen) return;
  if (state.screen === 'board') { cpuPlan = null; cpuTimer = setTimeout(cpuSpot, CPU_MS.think); return; }
  if (state.screen !== 'mini') return;
  if (cpuPlan && cpuPlan.square === state.zoom && state.spot) return;   // the glow is still showing; cpuZoom takes it from here
  if (!cpuPlan || cpuPlan.square !== state.zoom) {
    cpuPlan = cpuMove(state); cpuPlan.stage = 0;
    if (cpuPlan.square !== state.zoom) { state.zoom = cpuPlan.square; state.draft = ''; state.pick = null; state.sel = []; commit(); return; }   // after a reload mid-move
  }
  cpuTimer = setTimeout(cpuAct, cpuPlan.stage ? CPU_MS.pre : state.lock != null ? CPU_MS.again : CPU_MS.zoom);
}
function cpuSpot() {                                           // the computer has chosen: show where, then go there
  cpuTimer = null;
  if (!cpuTurn() || state.screen !== 'board' || state.confirm || menuOpen) return;
  cpuPlan = cpuMove(state); cpuPlan.stage = 0;
  state.spot = { square: cpuPlan.square, by: state.turn, label: `${playerName(state, state.turn)} plays here` };
  render();                                                     // no commit: the glow is not for the saved state
  cpuTimer = setTimeout(cpuZoom, CPU_MS.spot);
}
function cpuZoom() {
  cpuTimer = null;
  state.spot = null;
  if (!cpuTurn() || state.screen !== 'board' || state.confirm || menuOpen || !cpuPlan) { render(); return; }
  state.screen = 'mini'; state.zoom = cpuPlan.square; state.draft = ''; state.pick = null; state.sel = []; state.notice = null;
  commit();
}
function cpuAct() {
  cpuTimer = null;
  if (!cpuTurn() || state.screen !== 'mini' || !cpuPlan || cpuPlan.square !== state.zoom || menuOpen) return;
  const plan = cpuPlan, type = state.squares[plan.square].mini.type;
  if (!plan.stage && (type === 'memory' || type === 'wordle' || type === 'hexapawn' || type === 'mastermind')) {   // show the choice first, as a person would
    if (type === 'memory') state.pick = plan.move[0]; else if (type === 'hexapawn') hpSel = { sq: plan.square, from: plan.move[0] };
    else if (type === 'mastermind') mmDraft = { sq: plan.square, slots: plan.move.slice(), at: 0 }; else state.draft = plan.move;
    plan.stage = 1; commit(); return;
  }
  cpuPlan = null;
  const r = playMove(state, plan.square, plan.move);
  if (!r.ok) {                                   // never expected; rather than freeze, hand the match to two players
    console.error('The computer could not play', plan, r);
    state.cpu = null; leaveSquare(state);
  }
  commit();
}
function armFlash() {
  if (!state.flash || flashTimer || state.spot) return;         // while the square glows on the board, the move has not played yet
  const f = state.flash, ms = animMs(f);
  flashReady = Date.now() + ms;                   // no tapping the result away while the move is still animating
  let hold = FLASH_MS[f.kind] || 800;
  if (f.type === 'memory' && f.kind === 'move') hold = MEMORY_MS;
  if (f.type === 'pig' && f.kind === 'move') hold = FLASH_MS.card;   // a bust or a bank gets a proper card
  flashTimer = setTimeout(dismissFlash, ms + hold);
}
function dismissFlash() {
  clearTimeout(flashTimer); flashTimer = null;
  const f = state.flash;
  if (!f) return;
  const hold = f.type === 'memory' && f.kind === 'move' && !state.winner;   // let the two cards turn back over first
  endFlash(state, hold);
  commit();
  if (hold && state.done) {
    clearTimeout(holdTimer);
    holdTimer = setTimeout(() => { if (state.done && !state.flash && leaveSquare(state)) commit(); applyPending(); }, FLIP_MS);
  } else applyPending();                        // online: the room may have moved on meanwhile
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* no storage: just play without resume */ }
}
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && s.v === 4 && Array.isArray(s.squares) && s.squares.length === 9 && (s.turn === 'X' || s.turn === 'O') && s.setup) {
      if (s.lock != null && !s.winner) { s.screen = 'mini'; s.zoom = s.lock; }
      else if (s.done && !s.flash && !s.winner) leaveSquare(s);   // a result that was still on show: the board was next anyway
      s.notice = null; s.sel = []; s.stamp = null; s.spot = null;
      if (!s.timer || typeof s.timer !== 'object') s.timer = newTimer(0);
      if (s.setup.timer == null) s.setup.timer = 0;
      if (!s.setup.mode) s.setup.mode = 'two';
      if (!s.setup.human) s.setup.human = 'X';
      if (!['X', 'O', 'XO'].includes(s.cpu)) s.cpu = null;
      normSetup(s.setup);
      if (s.screen === 'review' || s.screen === 'review-mini') s.screen = s.winner ? 'win' : 'board';
      if (!(s.online && (s.online.role === 'host' || s.online.role === 'guest') && validCode(s.online.code))) s.online = null;
      if (s.online) {
        if (s.online.me !== 'X' && s.online.me !== 'O') s.online.me = null;
        if (!Number.isInteger(s.online.shownSeq)) s.online.shownSeq = null;
        if (typeof s.online.matchId !== 'string') s.online.matchId = null;
        s.flash = null; s.done = null; s.spot = null;              // a move cut short by the reload plays back from the room
        if (!['board', 'mini', 'win', 'setup', 'join'].includes(s.screen)) s.screen = s.online.role === 'host' ? 'setup' : 'join';
      }
      for (const sq of s.squares) if (sq.mini.type === 'memory' && !Array.isArray(sq.mini.seen)) sq.mini.seen = [];
      for (const sq of s.squares) upgradeMini(sq.mini);                     // Connect 4 grew from 5 to 7 columns
      for (const t of TYPES) if (!(t in s.setup.games)) s.setup.games[t] = true;   // a game added since the save is on by default
      return s;
    }
  } catch (e) { /* ignore corrupt saves */ }
  return null;
}

boot();
</script>
