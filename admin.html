<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex, nofollow">

<title>Tic Tac Chaos Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
/* The admin's stats dashboard. Only the account with the admin flag can read the stats: the database
   rules refuse everyone else, whatever this page does. */
:root {
  --bg: #f4e6c8; --paper: #fff8e8; --card: #fffdf6; --ink: #161210; --muted: #6b5a45; --line: #d9c7a6;
  --x: #e5432a; --o: #f6c21b; --x-soft: #f9c7b6; --o-soft: #fbe39a; --sky: #58a8cf; --green: #4e9d3a; --plum: #8a5bb5; --stone: #a89577;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; touch-action: manipulation; }   /* no zooming: no double-tap zoom here either */
input, select, textarea { font-size: max(16px, 1em) !important; }   /* (iPhone zooms into a field under 16px when it is focused: this wins over the forms' own smaller type) */
body { background: var(--bg); color: var(--ink); font: 17px/1.35 'Patrick Hand', system-ui, sans-serif; }
h1, h2, .lg { font-family: 'Luckiest Guy', 'Arial Black', sans-serif; font-weight: 400; letter-spacing: .02em; }
h1 { margin: 0; font-size: 28px; line-height: 1; padding-top: 4px; }
h2 { margin: 0 0 10px; font-size: 20px; padding-top: 3px; }
button, select { font: inherit; color: inherit; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 16px max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left)); display: flex; flex-direction: column; gap: 16px; }
.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.top .sp { flex: 1; }
.who { color: var(--muted); font-size: 15px; }
.btn { border: 3px solid var(--ink); background: #fff; box-shadow: 0 3px 0 var(--ink); border-radius: 14px 10px 13px 9px; padding: 8px 14px 6px; font-family: 'Luckiest Guy', sans-serif; font-size: 15px; cursor: pointer; }
.btn.go { background: var(--o); }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.btn:disabled { opacity: .5; cursor: default; }
.card { background: var(--card); border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); border-radius: 18px 12px 20px 14px / 14px 20px 12px 18px; padding: 14px 16px; min-width: 0; }
.msg { text-align: center; padding: 30px 16px; }
.msg p { margin: 8px 0 16px; color: var(--muted); }
.signin { display: flex; flex-direction: column; gap: 10px; max-width: 360px; margin: 0 auto; }
.signin input { border: 3px solid var(--ink); border-radius: 12px; padding: 8px 10px; font: 18px 'Patrick Hand', sans-serif; background: #fff; }
.err { color: var(--x); }
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
.kpi { display: flex; flex-direction: column; gap: 2px; }
.kpi small { color: var(--muted); font-size: 14px; }
.kpi b { font-family: 'Luckiest Guy', sans-serif; font-weight: 400; font-size: 26px; padding-top: 3px; }
.kpi span { color: var(--muted); font-size: 14px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 16px; }
.chart { max-width: 820px; } .chart svg { width: 100%; height: auto; display: block; }
.chart .ax { stroke: var(--line); stroke-width: 1; }
.chart text { font: 11px 'Patrick Hand', sans-serif; fill: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; color: var(--muted); margin-top: 6px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; border: 1.5px solid var(--ink); margin-right: 5px; vertical-align: -1px; }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 16px; }
th, td { padding: 6px 8px; text-align: right; white-space: nowrap; border-bottom: 1.5px solid var(--line); }
th:first-child, td:first-child { text-align: left; }
th { font-family: 'Luckiest Guy', sans-serif; font-weight: 400; font-size: 13px; letter-spacing: .03em; color: var(--muted); vertical-align: bottom; }
th button { all: unset; cursor: pointer; }
th button:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; }
th[aria-sort] { color: var(--ink); }
th[aria-sort="ascending"] button::after { content: ' ▲'; }
th[aria-sort="descending"] button::after { content: ' ▼'; }
td.dim, span.dim { color: var(--muted); }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.row h2 { margin: 0; flex: 1; }
.tabs { display: flex; gap: 6px; }
.tabs button { border: 2.5px solid var(--ink); background: #fff; border-radius: 999px; padding: 3px 12px 1px; font-family: 'Luckiest Guy', sans-serif; font-size: 13px; cursor: pointer; }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
select { border: 2.5px solid var(--ink); border-radius: 10px; padding: 4px 8px; background: #fff; font-size: 16px; }
.note { color: var(--muted); font-size: 14px; margin: 8px 0 0; }
.ctl .row h2 { flex: 1; }
.sw { display: inline-flex; align-items: center; gap: 8px; font-family: 'Luckiest Guy', sans-serif; font-size: 15px; cursor: pointer; }
.sw input { width: 22px; height: 22px; accent-color: var(--green); }
.savemsg { font-size: 15px; margin-left: 8px; align-self: center; }
.rels { list-style: none; padding: 0; margin: 10px 0 0; }
.rels li { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1.5px solid var(--line); }
.rels .rn { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.rels .sw { flex: none; } .rels .sw span { display: inline-block; min-width: 92px; }
.rels .sw.ios span { min-width: 58px; } .rels .mv { color: var(--muted, #888); font-size: .8em; }
.rels .savemsg { flex: none; margin: 0; }
.fields { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin-top: 10px; }
.fields label { display: inline-flex; align-items: center; gap: 6px; }
.fields input[type="number"] { width: 72px; }
.fields input[type="text"], .fields input[type="tel"], .fields input[type="email"], .fields input[type="password"] { width: min(100%, 260px); }
.fields input { border: 2.5px solid var(--ink); border-radius: 10px; padding: 5px 8px 3px; background: #fff; font: 17px 'Patrick Hand', sans-serif; }
.fields input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--green); }
.fields h3 { flex: 0 0 100%; margin: 6px 0 0; font: 400 14px 'Luckiest Guy', sans-serif; letter-spacing: .03em; color: var(--muted); }
.set { color: var(--green); font-size: 14px; } .unset { color: var(--muted); font-size: 14px; }
.res { font-size: 15px; } .bad { color: var(--x); } .good { color: var(--green); }
.chart .hit { fill: transparent; } .chart .hit:hover { fill: rgba(22, 18, 16, .07); }
.mltl { font: 13px/1.45 ui-monospace, Menlo, Consolas, monospace; overflow-wrap: anywhere; max-height: 420px; overflow: auto; margin: 6px 0 0; padding: 0; list-style: none; }
.mltl li { padding: 2px 0; border-bottom: 1px dashed var(--stone); } .mltl .k { display: inline-block; min-width: 72px; font-weight: 800; } .mltl .k.reject, .mltl .k.error, .mltl .k.report { color: var(--x); } .mltl .k.offline { color: var(--plum); }
.funnel { display: grid; grid-template-columns: max-content 1fr max-content; gap: 6px 10px; align-items: center; font-size: 16px; margin-top: 6px; }
.funnel .fb { height: 14px; border-radius: 7px; background: var(--sky); border: 1.5px solid var(--ink); min-width: 2px; }
.mid-left { color: var(--x); } .mid-open { color: var(--plum); }
@media (max-width: 480px) { h1 { font-size: 23px; } .kpi b { font-size: 22px; } table { font-size: 15px; } }
    /* the runners' tuning card */
    .runner h3 { margin: 6px 0 8px; }
    .rkpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
    .rbins { display: flex; align-items: flex-end; gap: 2px; height: 90px; padding: 0 2px 16px; border-bottom: 1px solid #ddd; position: relative; }
    .rbin { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; position: relative; min-width: 4px; }
    .rbin i { display: block; background: #e5432a; border-radius: 2px 2px 0 0; min-height: 1px; }
    .rbin small { position: absolute; top: 100%; left: 0; font-size: 10px; color: #777; }
    .rform { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; margin-top: 12px; align-items: end; }
    .presets { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 10px 0 2px; font-size: 13px; } .presets > span { font-weight: 700; } .presets .btn.on { background: #222; color: #fff; } .presets small { flex-basis: 100%; color: #666; }   /* a game's difficulty presets (Shell Game) */
    .rform .rf { display: grid; gap: 2px; font-size: 12px; color: #555; }
    .rform .rf input { width: 100%; padding: 4px 6px; font: inherit; border: 1px solid #bbb; border-radius: 6px; }
    .rform .btn { grid-column: 1 / -1; justify-self: start; margin-top: 4px; }
    .wgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; } .wgrid .rform { grid-template-columns: 1fr; margin-top: 0; }   /* Risky Spins' three wheels */
/* a section's head, a game's settings page */
.back:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }
.sechead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; } .sechead h2 { margin: 0; font-size: 24px; }
.btn.back { text-decoration: none; color: inherit; display: inline-block; }
.chg { color: var(--x); }
.tform { grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); }
.tform .rf small { color: var(--muted); font-size: 12px; } .tform .rf.chg span { color: var(--x); font-weight: 700; }
#tuneCard h3 { margin: 12px 0 0; font: 400 14px 'Luckiest Guy', sans-serif; letter-spacing: .03em; color: var(--muted); }
.tbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 14px; }
.gpage { display: flex; flex-direction: column; gap: 16px; }
/* the Games page (November 2026): the list of every mini-game, each a row to its page; the badges; a game's Mode switch; unsaved edits */
.glist { list-style: none; margin: 10px 0 0; padding: 0; }
.glist li { border-bottom: 1.5px solid var(--line); }
.grow { display: flex; align-items: center; gap: 10px; padding: 8px 2px; color: inherit; text-decoration: none; min-height: 52px; }
.grow.glit { animation: glit 2.2s ease-out; }
@keyframes glit { 0%, 35% { background: color-mix(in srgb, var(--sky) 38%, transparent); } 100% { background: transparent; } }
.grow:active { background: var(--paper); } .grow:focus-visible { outline: 3px solid var(--sky); outline-offset: -3px; border-radius: 10px; }
.gico { display: inline-flex; width: 28px; height: 28px; flex: none; color: var(--ink); vertical-align: middle; } .gico svg { width: 100%; height: 100%; }
.sechead h2 .gico { width: 26px; height: 26px; margin-right: 8px; }
.gnm { flex: 1; min-width: 0; display: flex; flex-direction: column; } .gnm b { font: 400 17px/1.1 'Luckiest Guy', sans-serif; letter-spacing: .02em; padding-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .gnm small { color: var(--muted); font-size: 14px; }
.gbadges { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; flex: 0 1 auto; max-width: 52%; }
.badge { display: inline-block; border: 2px solid var(--ink); border-radius: 999px; padding: 1px 8px 0; font: 400 12px/1.4 'Luckiest Guy', sans-serif; letter-spacing: .03em; background: #fff; white-space: nowrap; }
.badge.rel { background: color-mix(in srgb, var(--green) 28%, #fff); } .badge.adm { background: var(--paper); color: var(--muted); }
.badge.ios { background: color-mix(in srgb, var(--stone) 35%, #fff); } .badge.soon { background: var(--o-soft); } .note.warn { color: #9a3412; background: #fff3e0; border-left: 4px solid #ea580c; padding: 6px 10px; } .rf.soondate input { min-width: 150px; } .badge.race { background: color-mix(in srgb, var(--plum) 30%, #fff); } .badge.shared { background: var(--paper); } .badge.chg { background: var(--o-soft); color: var(--x); }
.luform { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } .luform .lublurb { grid-column: 1 / -1; } .luform .rf small { color: var(--muted); font-size: 12px; } .luform .rf.chg > span { color: var(--x); font-weight: 700; }
.luform textarea { width: 100%; box-sizing: border-box; padding: 6px 8px; font: inherit; border: 1px solid #bbb; border-radius: 6px; resize: vertical; } .luform select { width: 100%; } .lucount { float: right; font-weight: 400; } .lucount.over { color: var(--x); font-weight: 700; }
.relst { display: inline-flex; flex-wrap: wrap; gap: 6px; } .stopt { display: inline-flex; align-items: center; gap: 6px; border: 2px solid var(--line); border-radius: 999px; padding: 6px 12px 5px 8px; background: #fff; cursor: pointer; min-height: 44px; box-sizing: border-box; }
.stopt input { width: 20px; height: 20px; margin: 0; accent-color: var(--ink); } .stopt b { font: 400 15px/1 'Luckiest Guy', sans-serif; letter-spacing: .02em; padding-top: 2px; }
.stopt:has(input:checked) { border-color: var(--ink); box-shadow: 0 3px 0 var(--ink); } .stopt.st-released:has(input:checked) { background: color-mix(in srgb, var(--green) 28%, #fff); } .stopt.st-depri:has(input:checked) { background: #e8e4dc; }
.leaverow { flex-wrap: wrap; gap: 10px; margin-top: 8px; } .rf.leavedate input { min-width: 150px; }
.card h3.ggrp { margin: 18px 0 0; padding: 6px 10px 4px; display: flex; align-items: baseline; gap: 8px; font: 400 18px/1.1 'Luckiest Guy', sans-serif; letter-spacing: .02em; color: var(--ink); background: var(--paper); border-radius: 10px; } .ggrp small { color: var(--muted); font: 600 14px/1 system-ui, sans-serif; }
.badge.dep { background: #e8e4dc; color: #5b5346; }
.badge.ret { background: #fde2e2; color: #8a1c1c; } .retrow { flex-wrap: wrap; gap: 10px; margin-top: 8px; } .retrow h3 { margin: 0; font-size: 15px; flex: 1 0 100%; } .retrow .rf input { min-width: 150px; }
.modesw { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 10px; margin-top: 6px; }
.modeopt { display: grid; grid-template-columns: 24px 1fr; gap: 2px 10px; align-items: center; border: 2.5px solid var(--line); border-radius: 14px; padding: 10px 12px; background: #fff; cursor: pointer; }
.modeopt input { width: 22px; height: 22px; accent-color: var(--plum); grid-row: 1 / span 2; margin: 0; }
.modeopt b { font: 400 17px/1.1 'Luckiest Guy', sans-serif; letter-spacing: .02em; padding-top: 3px; } .modeopt small { color: var(--muted); font-size: 14px; }
.modeopt:has(input:checked) { border-color: var(--ink); background: color-mix(in srgb, var(--plum) 14%, #fff); box-shadow: 0 3px 0 var(--ink); }
.rf.dirty > span, .rf.dirty > span + small, .modeopt.dirty b { color: var(--plum); } .rf.dirty input, .rf.dirty select { border-color: var(--plum); box-shadow: 0 0 0 2px color-mix(in srgb, var(--plum) 30%, transparent); }
.tbar .unsaved { color: var(--plum); font-family: 'Luckiest Guy', sans-serif; font-size: 14px; letter-spacing: .03em; min-height: 1em; }
#tuneCard .tbar { margin-top: 16px; }
#modeCard .row h2, #relCard .row h2 { flex: 1; }
.atttab { border-collapse: collapse; margin: 6px 0 10px; } .atttab th, .atttab td { padding: 3px 6px; text-align: left; font-size: 13px; } .atttab input { width: 68px; }
.bflag { display: inline-block; margin-left: 4px; padding: 1px 6px; border-radius: 999px; font-size: 12px; border: 1.5px solid currentColor; } .bflag.slow { color: #b3261e; } .bflag.small { color: #8a6d00; }
.vlog { margin: 6px 0 0; padding-left: 18px; } .vlog li { margin: 3px 0; }
.exrow { gap: 8px; flex-wrap: wrap; }
.exrow input { flex: 1 1 160px; min-width: 0; }
.olink { word-break: break-all; padding: 4px 6px; background: rgba(0, 0, 0, .05); border-radius: 4px; }

/* ---------- the dashboard (December 2026): one layout, one table, one chart ----------
   The bar of sections on every page; the filters on every stats page; a number is a link to its rows; every table is
   src/admin/table.js's; on a phone the bar and the tables scroll sideways and the filters wrap. */
a { color: inherit; }
.btn.sm { padding: 5px 10px 3px; font-size: 13px; border-width: 2.5px; box-shadow: 0 2px 0 var(--ink); border-radius: 11px 8px 10px 7px; }
.nav { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 6px; margin: -6px 0; scrollbar-width: none; position: sticky; top: 0; z-index: 5; background: var(--bg); }
.nav::-webkit-scrollbar { display: none; }
.nav a { flex: none; text-decoration: none; border: 2.5px solid var(--ink); background: #fff; border-radius: 999px; padding: 6px 14px 3px; font: 400 15px/1.2 'Luckiest Guy', sans-serif; letter-spacing: .02em; }
.nav a[aria-current="page"] { background: var(--ink); color: var(--paper); }
.nav a:focus-visible, .jump a:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
.jump { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 16px; }
.fbar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; background: var(--paper); border: 2.5px solid var(--ink); border-radius: 14px; padding: 8px 12px; font-size: 15px; }
.fbar label { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.fbar select, .fbar input[type="date"] { border: 2px solid var(--ink); border-radius: 9px; padding: 3px 6px; background: #fff; font: inherit; }
.fbar .sw { font-size: 14px; } .fbar .sw input { width: 20px; height: 20px; }
.fbar .frange { color: var(--muted); font-size: 14px; flex: 1 1 200px; text-align: right; }
#gameStats .fbar { margin-bottom: 12px; }
.kpi a.big, .kpi b.big { font: 400 26px/1.15 'Luckiest Guy', sans-serif; padding-top: 3px; text-decoration: none; color: var(--ink); }
.kpi a.big { text-decoration: underline dotted 2px; text-underline-offset: 4px; text-decoration-color: var(--stone); }
.kpi a.big:hover, .kpi a.big:focus-visible { text-decoration-color: var(--ink); }
.kpi b.big a { text-decoration: underline dotted 2px; text-underline-offset: 4px; text-decoration-color: var(--stone); }
.kpi b.big b { font: inherit; }
.kpi .more, .card > .more { font-size: 14px; color: var(--muted); margin-top: 4px; display: inline-block; }
.card .kpis .card.kpi { box-shadow: none; border-width: 2px; border-color: var(--line); border-radius: 12px; padding: 10px 12px; }
.card h3 { margin: 14px 0 6px; font: 400 15px 'Luckiest Guy', sans-serif; letter-spacing: .03em; color: var(--muted); }
.card > .kpis + .kpis, .card > .kpis + .tb, .card > .funnel + .kpis { margin-top: 12px; }
.tipi { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--muted); color: var(--muted); font: 700 11px/1 system-ui, sans-serif; font-style: normal; cursor: help; vertical-align: 1px; margin-left: 3px; }
.tipi:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; }

.tb .tbbar .btn[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.tb .tbn { color: var(--muted); font-size: 14px; margin-left: auto; }
.tb table { font: 14px/1.3 system-ui, -apple-system, 'Segoe UI', sans-serif; font-variant-numeric: tabular-nums; }

.badge.own { background: var(--o-soft); }
.nick { background: none; border: 0; padding: 2px 0; font: inherit; font-weight: 700; text-align: left; cursor: pointer; text-decoration: underline dotted; color: inherit; }
.nickedit { display: inline-flex; gap: 6px; flex-wrap: wrap; } .nickedit input { width: 150px; border: 2px solid var(--ink); border-radius: 8px; padding: 2px 6px; }
.tb .sw { font: inherit; gap: 6px; white-space: nowrap; } .tb .sw input { width: 18px; height: 18px; }
.funnel a { font-weight: 700; }
.chart + .more { margin-top: 6px; }
@media (max-width: 640px) {
  .wrap { padding-top: 10px; gap: 12px; }
  .card { padding: 12px; }
