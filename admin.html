<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<title>Tic Tac Chaos Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
/* The admin's stats dashboard. Only the account with the admin flag can read the stats: the database
   rules refuse everyone else, whatever this page does. */
:root {
  --bg: #f4e6c8; --paper: #fff8e8; --card: #fffdf6; --ink: #161210; --muted: #6b5a45; --line: #d9c7a6;
  --x: #e5432a; --o: #f6c21b; --x-soft: #f9c7b6; --o-soft: #fbe39a; --sky: #58a8cf; --green: #4e9d3a; --plum: #8a5bb5; --stone: #a89577;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; touch-action: manipulation; }   /* no zooming: no double-tap zoom here either */
input, select, textarea { font-size: max(16px, 1em) !important; }   /* (iPhone zooms into a field under 16px when it is focused: this wins over the forms' own smaller type) */
body { background: var(--bg); color: var(--ink); font: 17px/1.35 'Patrick Hand', system-ui, sans-serif; }
h1, h2, .lg { font-family: 'Luckiest Guy', 'Arial Black', sans-serif; font-weight: 400; letter-spacing: .02em; }
h1 { margin: 0; font-size: 28px; line-height: 1; padding-top: 4px; }
h2 { margin: 0 0 10px; font-size: 20px; padding-top: 3px; }
button, select { font: inherit; color: inherit; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 16px max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left)); display: flex; flex-direction: column; gap: 16px; }
.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.top .sp { flex: 1; }
.who { color: var(--muted); font-size: 15px; }
.btn { border: 3px solid var(--ink); background: #fff; box-shadow: 0 3px 0 var(--ink); border-radius: 14px 10px 13px 9px; padding: 8px 14px 6px; font-family: 'Luckiest Guy', sans-serif; font-size: 15px; cursor: pointer; }
.btn.go { background: var(--o); }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.btn:disabled { opacity: .5; cursor: default; }
.card { background: var(--card); border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); border-radius: 18px 12px 20px 14px / 14px 20px 12px 18px; padding: 14px 16px; min-width: 0; }
.msg { text-align: center; padding: 30px 16px; }
.msg p { margin: 8px 0 16px; color: var(--muted); }
.signin { display: flex; flex-direction: column; gap: 10px; max-width: 360px; margin: 0 auto; }
.signin input { border: 3px solid var(--ink); border-radius: 12px; padding: 8px 10px; font: 18px 'Patrick Hand', sans-serif; background: #fff; }
.err { color: var(--x); }
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
.kpi { display: flex; flex-direction: column; gap: 2px; }
.kpi small { color: var(--muted); font-size: 14px; }
.kpi b { font-family: 'Luckiest Guy', sans-serif; font-weight: 400; font-size: 26px; padding-top: 3px; }
.kpi span { color: var(--muted); font-size: 14px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 16px; }
.chart svg { width: 100%; height: auto; display: block; }
.chart .ax { stroke: var(--line); stroke-width: 1; }
.chart text { font: 11px 'Patrick Hand', sans-serif; fill: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; color: var(--muted); margin-top: 6px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; border: 1.5px solid var(--ink); margin-right: 5px; vertical-align: -1px; }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 16px; }
th, td { padding: 6px 8px; text-align: right; white-space: nowrap; border-bottom: 1.5px solid var(--line); }
th:first-child, td:first-child { text-align: left; }
th { font-family: 'Luckiest Guy', sans-serif; font-weight: 400; font-size: 13px; letter-spacing: .03em; color: var(--muted); vertical-align: bottom; }
th button { all: unset; cursor: pointer; }
th button:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; }
th[aria-sort] { color: var(--ink); }
th[aria-sort="ascending"] button::after { content: ' ▲'; }
th[aria-sort="descending"] button::after { content: ' ▼'; }
td.dim, span.dim { color: var(--muted); }
td.sc { background: color-mix(in srgb, var(--o) 8%, transparent); }
tr.sum td { background: var(--paper); border-bottom: 3px solid var(--ink); font-weight: 700; }
.bar { display: inline-block; height: 9px; border-radius: 5px; background: var(--sky); vertical-align: middle; margin-left: 6px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.row h2 { margin: 0; flex: 1; }
.tabs { display: flex; gap: 6px; }
.tabs button { border: 2.5px solid var(--ink); background: #fff; border-radius: 999px; padding: 3px 12px 1px; font-family: 'Luckiest Guy', sans-serif; font-size: 13px; cursor: pointer; }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
select { border: 2.5px solid var(--ink); border-radius: 10px; padding: 4px 8px; background: #fff; font-size: 16px; }
.note { color: var(--muted); font-size: 14px; margin: 8px 0 0; }
.ctl .row h2 { flex: 1; }
.sw { display: inline-flex; align-items: center; gap: 8px; font-family: 'Luckiest Guy', sans-serif; font-size: 15px; cursor: pointer; }
.sw input { width: 22px; height: 22px; accent-color: var(--green); }
.savemsg { font-size: 15px; margin-left: 8px; align-self: center; }
.rels { list-style: none; padding: 0; margin: 10px 0 0; }
.rels li { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1.5px solid var(--line); }
.rels .rn { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.rels .sw { flex: none; } .rels .sw span { display: inline-block; min-width: 92px; }
.rels .savemsg { flex: none; margin: 0; }
.fields { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin-top: 10px; }
.fields label { display: inline-flex; align-items: center; gap: 6px; }
.fields input[type="number"] { width: 72px; }
.fields input[type="text"], .fields input[type="tel"], .fields input[type="email"], .fields input[type="password"] { width: min(100%, 260px); }
.fields input { border: 2.5px solid var(--ink); border-radius: 10px; padding: 5px 8px 3px; background: #fff; font: 17px 'Patrick Hand', sans-serif; }
.fields input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--green); }
.fields h3 { flex: 0 0 100%; margin: 6px 0 0; font: 400 14px 'Luckiest Guy', sans-serif; letter-spacing: .03em; color: var(--muted); }
.set { color: var(--green); font-size: 14px; } .unset { color: var(--muted); font-size: 14px; }
.res { font-size: 15px; } .bad { color: var(--x); } .good { color: var(--green); }
.wide-chart { overflow-x: auto; } .wide-chart svg { min-width: 640px; }
.chart .day { stroke: var(--ink); stroke-opacity: .25; stroke-width: 1; }
.chart .hit { fill: transparent; } .chart .hit:hover { fill: rgba(22, 18, 16, .07); }
.lnk { all: unset; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; font-family: ui-monospace, Menlo, monospace; font-size: 14px; }
.lnk:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; }
tr.dev, tr.mlrow, tr.acct { cursor: pointer; } tr.mlrow:hover td, tr.mlrow.open td, tr.acct:hover td, tr.acct.open td { background: var(--paper); } tr.mlrow.rep td:first-child { color: var(--x); font-weight: 800; }
.mlfilt { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 10px; } .mlfilt input, .mlfilt select { height: 36px; }
.mltl { font: 13px/1.45 ui-monospace, Menlo, Consolas, monospace; overflow-wrap: anywhere; max-height: 420px; overflow: auto; margin: 6px 0 0; padding: 0; list-style: none; }
.mltl li { padding: 2px 0; border-bottom: 1px dashed var(--stone); } .mltl .k { display: inline-block; min-width: 72px; font-weight: 800; } .mltl .k.reject, .mltl .k.error, .mltl .k.report { color: var(--x); } .mltl .k.offline { color: var(--plum); }
 tr.dev:hover td, tr.dev.open td { background: var(--paper); }
.tlpanel { margin-top: 10px; border: 2.5px solid var(--ink); border-radius: 14px; background: var(--paper); padding: 10px 12px 12px; }
.tlpanel .row { margin-bottom: 8px; } #acctDetail .tbl { margin-top: 10px; } #acctDetail .kpis { grid-template-columns: 1fr 1fr; } .tlpanel .row h3 { flex: 1; margin: 0; font: 400 16px 'Luckiest Guy', sans-serif; letter-spacing: .02em; }
#playCard .kpis { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
.tlist { display: flex; flex-direction: column; gap: 10px; }
.tses h3 { margin: 0 0 4px; font: 400 14px 'Luckiest Guy', sans-serif; letter-spacing: .03em; }
.tses p { margin: 0; color: var(--muted); font-size: 15px; }
.tses ul { margin: 4px 0 0; padding-left: 18px; } .tses li { font-size: 15px; }
.tag { display: inline-block; border: 2px solid var(--ink); border-radius: 999px; padding: 0 8px; font-size: 14px; background: var(--o-soft); }
.funnel { display: grid; grid-template-columns: max-content 1fr max-content; gap: 6px 10px; align-items: center; font-size: 16px; margin-top: 6px; }
.funnel .fb { height: 14px; border-radius: 7px; background: var(--sky); border: 1.5px solid var(--ink); min-width: 2px; }
.mid-left { color: var(--x); } .mid-open { color: var(--plum); }
@media (max-width: 480px) { h1 { font-size: 23px; } .kpi b { font-size: 22px; } table { font-size: 15px; } }
    /* the runners' tuning card */
    .runner h3 { margin: 6px 0 8px; }
    .rkpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
    .rbins { display: flex; align-items: flex-end; gap: 2px; height: 90px; padding: 0 2px 16px; border-bottom: 1px solid #ddd; position: relative; }
    .rbin { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; position: relative; min-width: 4px; }
    .rbin i { display: block; background: #e5432a; border-radius: 2px 2px 0 0; min-height: 1px; }
    .rbin small { position: absolute; top: 100%; left: 0; font-size: 10px; color: #777; }
    .rform { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; margin-top: 12px; align-items: end; }
    .rform .rf { display: grid; gap: 2px; font-size: 12px; color: #555; }
    .rform .rf input { width: 100%; padding: 4px 6px; font: inherit; border: 1px solid #bbb; border-radius: 6px; }
    .rform .btn { grid-column: 1 / -1; justify-self: start; margin-top: 4px; }
    .wgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; } .wgrid .rform { grid-template-columns: 1fr; margin-top: 0; }   /* Risk Wheels' three wheels */
/* the menu of sections, a section's head, the Mini-game Settings pages */
.tiles, .gtiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 14px; }
.gtiles { grid-template-columns: repeat(auto-fill, minmax(min(100%, 170px), 1fr)); gap: 10px; }
.tile, .gtile { display: flex; flex-direction: column; gap: 4px; color: inherit; text-decoration: none; background: var(--card); border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); border-radius: 18px 12px 20px 14px / 14px 20px 12px 18px; padding: 16px; min-height: 96px; }
.gtile { min-height: 0; padding: 10px 12px; border-width: 2.5px; box-shadow: 0 3px 0 var(--ink); border-radius: 14px 10px 13px 9px; }
.tile b, .gtile b { font: 400 20px/1.1 'Luckiest Guy', sans-serif; letter-spacing: .02em; padding-top: 3px; } .gtile b { font-size: 16px; }
.tile small, .gtile small { color: var(--muted); font-size: 15px; }
.tile:active, .gtile:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.tile:focus-visible, .gtile:focus-visible, .back:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }
.sechead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; } .sechead h2 { margin: 0; font-size: 24px; }
.btn.back { text-decoration: none; color: inherit; display: inline-block; }
.chg { color: var(--x); }
.tform { grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); }
.tform .rf small { color: var(--muted); font-size: 12px; } .tform .rf.chg span { color: var(--x); font-weight: 700; }
#tuneCard h3 { margin: 12px 0 0; font: 400 14px 'Luckiest Guy', sans-serif; letter-spacing: .03em; color: var(--muted); }
.tbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 14px; }
.gpage .tplay { display: none; } .gpage .tbar .tplay { display: inline-block; }   /* (one Test play on a game's page: the settings', which takes the tuning card's values too) */
.gpage { display: flex; flex-direction: column; gap: 16px; }
.atttab { border-collapse: collapse; margin: 6px 0 10px; } .atttab th, .atttab td { padding: 3px 6px; text-align: left; font-size: 13px; } .atttab input { width: 68px; }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="card msg"><h1>Tic Tac Chaos Stats</h1><p>Loading…</p></div></div>
<script src="src/env.js"></script>
<script src="playtest.js"></script>
<script src="admin.js"></script>
</body>
</html>
